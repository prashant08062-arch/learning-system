0.15)\" stroke=\"#38bdf8\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.45s\" />\n  <text x=\"210\" y=\"265\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">Ward 2</text>\n  <rect x=\"260\" y=\"240\" width=\"80\" height=\"40\" rx=\"4\" fill=\"rgba(251,191,36,0.15)\" stroke=\"#fbbf24\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.75s\" />\n  <text x=\"300\" y=\"265\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 0.90s\">Ward 3</text>\n  <rect x=\"350\" y=\"240\" width=\"80\" height=\"40\" rx=\"4\" fill=\"rgba(244,114,182,0.15)\" stroke=\"#f472b6\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 1.05s\" />\n  <text x=\"390\" y=\"265\" text-anchor=\"middle\" fill=\"#f472b6\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 1.20s\">Ward 4</text>\n  <rect x=\"440\" y=\"240\" width=\"80\" height=\"40\" rx=\"4\" fill=\"rgba(167,139,250,0.15)\" stroke=\"#a78bfa\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 1.35s\" />\n  <text x=\"480\" y=\"265\" text-anchor=\"middle\" fill=\"#a78bfa\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 1.50s\">Ward 5</text>\n</g>\n<!-- Ward committee functions -->\n<g class=\"el\" data-beat=\"5\">\n  <text x=\"300\" y=\"310\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"12\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.00s\">WARD COMMITTEES do:</text>\n  <rect x=\"60\" y=\"320\" width=\"120\" height=\"35\" rx=\"6\" fill=\"rgba(52,211,153,0.1)\" stroke=\"#34d399\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.15s\" />\n  <text x=\"120\" y=\"343\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"10\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">Health camps</text>\n  <rect x=\"195\" y=\"320\" width=\"120\" height=\"35\" rx=\"6\" fill=\"rgba(56,189,248,0.1)\" stroke=\"#38bdf8\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.45s\" />\n  <text x=\"255\" y=\"343\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"10\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">Anti-plastic</text>\n  <rect x=\"330\" y=\"320\" width=\"120\" height=\"35\" rx=\"6\" fill=\"rgba(251,191,36,0.1)\" stroke=\"#fbbf24\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.75s\" />\n  <text x=\"390\" y=\"343\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"10\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 0.90s\">Report leaks</text>\n  <rect x=\"465\" y=\"320\" width=\"80\" height=\"35\" rx=\"6\" fill=\"rgba(244,114,182,0.1)\" stroke=\"#f472b6\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 1.05s\" />\n  <text x=\"505\" y=\"343\" text-anchor=\"middle\" fill=\"#f472b6\" font-size=\"10\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 1.20s\">Repair roads</text>\n</g>\n<!-- Functions of urban bodies -->\n<g class=\"el\" data-beat=\"6\">\n  <rect x=\"60\" y=\"375\" width=\"480\" height=\"60\" rx=\"8\" fill=\"rgba(167,139,250,0.12)\" stroke=\"#a78bfa\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"300\" y=\"395\" text-anchor=\"middle\" fill=\"#a78bfa\" font-size=\"12\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Urban Local Bodies handle:</text>\n  <text x=\"300\" y=\"413\" text-anchor=\"middle\" fill=\"#e2e8f0\" font-size=\"11\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">Infrastructure · Garbage · Taxes · Water · Roads · Burial grounds</text>\n  <text x=\"300\" y=\"428\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">Participatory democracy: citizens must also do their duties!</text>\n</g>", "beats": ["Namaste, my little friend! In the last chapter, we saw how local government works in rural areas. Now let's see how it works in urban areas — cities and towns. Since cities are more complex and diverse, urban governance is also more complex.", "Look at this city skyline! Tall buildings, busy streets, many people — a city is very different from a village. Cities like Mumbai, Chennai, and Kolkata have millions of people. Managing such huge populations requires a complex system of governance.", "Local government structures in urban areas are called 'urban local bodies'. They are decentralised, which means that instead of operating under a central authority at the top, the local communities have a direct say on how their areas are managed or the issues they face.", "Cities and towns are divided into smaller units called 'wards'. Each ward elects representatives who form the ward committee. The ward committee is the link between the people of the ward and the urban local body.", "Ward committees facilitate activities such as conducting health camps, organising a campaign against the use of single-use plastics, and so on. They also keep an eye on anything that might go wrong — a water leak, a blocked drain, a damaged road — and report such problems to the authorities.", "Altogether, urban local bodies are responsible for a range of functions — helping take care of the infrastructure, maintaining the burial ground, garbage collection and disposal, checking the implementation of government schemes, collecting local taxes and fines, and so on. But remember: this is participatory democracy — citizens must also do their duties! In our next story, we will learn about the types of urban local bodies. Ready? Let's turn the page…"]}, {"id": "types_urban_bodies", "label": "2. Types of Urban Local Bodies", "viewBox": "0 0 600 460", "svg": "<defs><linearGradient id=\"tierU\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0%\" stop-color=\"#38bdf8\" stop-opacity=\"0.3\"/><stop offset=\"100%\" stop-color=\"#fbbf24\" stop-opacity=\"0.3\"/></linearGradient></defs>\n<g class=\"el\" data-beat=\"1\"><text x=\"300\" y=\"30\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"18\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.00s\">TYPES OF URBAN LOCAL BODIES</text><text x=\"300\" y=\"48\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Based on population</text></g>\n<!-- Municipal Corporation (top, largest) -->\n<g class=\"el\" data-beat=\"2\">\n  <polygon points=\"300,80 200,160 400,160\" fill=\"url(#tierU)\" stroke=\"#38bdf8\" stroke-width=\"2\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"300\" y=\"120\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">MUNICIPAL</text>\n  <text x=\"300\" y=\"135\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">CORPORATION</text>\n  <text x=\"300\" y=\"150\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">(Mahanagar Nigam)</text>\n</g>\n<!-- Population: above 10 lakhs -->\n<g class=\"el\" data-beat=\"3\">\n  <rect x=\"180\" y=\"170\" width=\"240\" height=\"30\" rx=\"6\" fill=\"rgba(56,189,248,0.12)\" stroke=\"#38bdf8\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"300\" y=\"190\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Population: above 10 lakhs</text>\n</g>\n<!-- Municipal Council (middle) -->\n<g class=\"el\" data-beat=\"4\">\n  <polygon points=\"200,220 130,290 470,290 400,220\" fill=\"url(#tierU)\" stroke=\"#34d399\" stroke-width=\"2\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"300\" y=\"255\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">MUNICIPAL COUNCIL</text>\n  <text x=\"300\" y=\"272\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">(Nagar Palika)</text>\n</g>\n<!-- Population: 1-10 lakhs -->\n<g class=\"el\" data-beat=\"5\">\n  <rect x=\"180\" y=\"300\" width=\"240\" height=\"30\" rx=\"6\" fill=\"rgba(52,211,153,0.12)\" stroke=\"#34d399\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"300\" y=\"320\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Population: 1 to 10 lakhs</text>\n</g>\n<!-- Nagar Panchayat (bottom) -->\n<g class=\"el\" data-beat=\"6\">\n  <polygon points=\"130,350 60,420 540,420 470,350\" fill=\"url(#tierU)\" stroke=\"#fbbf24\" stroke-width=\"2\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"300\" y=\"385\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">NAGAR PANCHAYAT</text>\n  <text x=\"300\" y=\"402\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">(City Council)</text>\n  <text x=\"300\" y=\"418\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">Smaller towns</text>\n</g>\n<!-- Examples -->\n<g class=\"el\" data-beat=\"7\">\n  <text x=\"300\" y=\"445\" text-anchor=\"middle\" fill=\"#a78bfa\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 0.00s\">Examples: Mumbai, Chennai → Municipal Corporation</text>\n</g>", "beats": ["Welcome back, my little friend! Urban local bodies come in different types, based on the population of the city or town. Let's see the three types in this pyramid!", "At the top, for the largest cities, is the Municipal Corporation (also called 'Mahanagar Nigam'). This is the highest urban local body. Only cities with a population above 10 lakhs have a Municipal Corporation.", "The Municipal Corporation is for cities with a population above 10 lakhs. Mumbai, Chennai, Delhi, Kolkata — all these big cities have Municipal Corporations. The Municipal Corporation of Greater Mumbai was created in 1865!", "In the middle is the Municipal Council (also called 'Nagar Palika'). This is for cities and towns with a population between 1 and 10 lakhs. These are medium-sized towns that are too big for a Nagar Panchayat but too small for a Municipal Corporation.", "The Municipal Council is for cities with a population between 1 and 10 lakhs. Many district headquarters and medium-sized towns have Municipal Councils.", "At the bottom is the Nagar Panchayat (also called City Council). This is for cities and towns with smaller populations — typically under 1 lakh. These are small towns that are transitioning from villages to towns.", "So the type of urban local body depends on population: above 10 lakhs → Municipal Corporation, 1-10 lakhs → Municipal Council, smaller → Nagar Panchayat. For example, Mumbai and Chennai have Municipal Corporations. In our next story, we will learn about the services they provide. Ready? Let's turn the page…"]}, {"id": "services_indore", "label": "3. Services of a Municipal Corporation (Indore)", "viewBox": "0 0 600 460", "svg": "<defs></defs>\n<g class=\"el\" data-beat=\"1\"><text x=\"300\" y=\"30\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"18\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.00s\">SERVICES OF MUNICIPAL CORPORATION</text><text x=\"300\" y=\"48\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Example: Indore Municipal Corporation</text></g>\n<!-- Services grid -->\n<g class=\"el\" data-beat=\"2\">\n  <rect x=\"60\" y=\"70\" width=\"160\" height=\"60\" rx=\"8\" fill=\"rgba(52,211,153,0.12)\" stroke=\"#34d399\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"140\" y=\"95\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"12\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Property Tax</text>\n  <text x=\"140\" y=\"112\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">Collects tax on property</text>\n  <rect x=\"240\" y=\"70\" width=\"160\" height=\"60\" rx=\"8\" fill=\"rgba(56,189,248,0.12)\" stroke=\"#38bdf8\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.45s\" />\n  <text x=\"320\" y=\"95\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"12\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">Water Charges</text>\n  <text x=\"320\" y=\"112\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">Supplies water</text>\n  <rect x=\"420\" y=\"70\" width=\"120\" height=\"60\" rx=\"8\" fill=\"rgba(251,191,36,0.12)\" stroke=\"#fbbf24\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.90s\" />\n  <text x=\"480\" y=\"95\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"11\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 1.05s\">Solid Waste</text>\n  <text x=\"480\" y=\"112\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"11\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 1.20s\">Management</text>\n</g>\n<!-- Row 2 -->\n<g class=\"el\" data-beat=\"3\">\n  <rect x=\"60\" y=\"145\" width=\"160\" height=\"60\" rx=\"8\" fill=\"rgba(244,114,182,0.12)\" stroke=\"#f472b6\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"140\" y=\"170\" text-anchor=\"middle\" fill=\"#f472b6\" font-size=\"11\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Trade Licenses</text>\n  <text x=\"140\" y=\"187\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">Business permits</text>\n  <rect x=\"240\" y=\"145\" width=\"160\" height=\"60\" rx=\"8\" fill=\"rgba(167,139,250,0.12)\" stroke=\"#a78bfa\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.45s\" />\n  <text x=\"320\" y=\"170\" text-anchor=\"middle\" fill=\"#a78bfa\" font-size=\"12\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">Marriage Cert.</text>\n  <text x=\"320\" y=\"187\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">Issues certificates</text>\n  <rect x=\"420\" y=\"145\" width=\"120\" height=\"60\" rx=\"8\" fill=\"rgba(34,211,238,0.12)\" stroke=\"#22d3ee\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.90s\" />\n  <text x=\"480\" y=\"170\" text-anchor=\"middle\" fill=\"#22d3ee\" font-size=\"11\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 1.05s\">Fire Services</text>\n  <text x=\"480\" y=\"187\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 1.20s\">Emergency</text>\n</g>\n<!-- Row 3 -->\n<g class=\"el\" data-beat=\"4\">\n  <rect x=\"60\" y=\"220\" width=\"160\" height=\"60\" rx=\"8\" fill=\"rgba(251,146,60,0.12)\" stroke=\"#fb923c\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"140\" y=\"245\" text-anchor=\"middle\" fill=\"#fb923c\" font-size=\"11\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Water Tanker</text>\n  <text x=\"140\" y=\"262\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">Water supply</text>\n  <rect x=\"240\" y=\"220\" width=\"160\" height=\"60\" rx=\"8\" fill=\"rgba(163,230,53,0.12)\" stroke=\"#a3e635\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.45s\" />\n  <text x=\"320\" y=\"245\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"11\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">Ambulance</text>\n  <text x=\"320\" y=\"262\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">Medical emergency</text>\n  <rect x=\"420\" y=\"220\" width=\"120\" height=\"60\" rx=\"8\" fill=\"rgba(248,113,113,0.12)\" stroke=\"#f87171\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.90s\" />\n  <text x=\"480\" y=\"245\" text-anchor=\"middle\" fill=\"#f87171\" font-size=\"11\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 1.05s\">Grievances</text>\n  <text x=\"480\" y=\"262\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 1.20s\">Complaints</text>\n</g>\n<!-- Row 4 -->\n<g class=\"el\" data-beat=\"5\">\n  <rect x=\"60\" y=\"295\" width=\"160\" height=\"60\" rx=\"8\" fill=\"rgba(56,189,248,0.12)\" stroke=\"#38bdf8\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"140\" y=\"320\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Tree Cutting</text>\n  <text x=\"140\" y=\"337\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">Permissions</text>\n  <rect x=\"240\" y=\"295\" width=\"160\" height=\"60\" rx=\"8\" fill=\"rgba(52,211,153,0.12)\" stroke=\"#34d399\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.45s\" />\n  <text x=\"320\" y=\"320\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"11\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">Funeral Van</text>\n  <text x=\"320\" y=\"337\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">Service</text>\n  <rect x=\"420\" y=\"295\" width=\"120\" height=\"60\" rx=\"8\" fill=\"rgba(167,139,250,0.12)\" stroke=\"#a78bfa\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.90s\" />\n  <text x=\"480\" y=\"320\" text-anchor=\"middle\" fill=\"#a78bfa\" font-size=\"11\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 1.05s\">Auditorium</text>\n  <text x=\"480\" y=\"337\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 1.20s\">Events</text>\n</g>\n<!-- Indore cleanest city -->\n<g class=\"el\" data-beat=\"6\">\n  <rect x=\"60\" y=\"375\" width=\"480\" height=\"60\" rx=\"8\" fill=\"rgba(52,211,153,0.12)\" stroke=\"#34d399\" stroke-width=\"2\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"300\" y=\"398\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Indore = Cleanest City in India! 🧹</text>\n  <text x=\"300\" y=\"415\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">Swachh Survekshan award for 7 years in a row</text>\n  <text x=\"300\" y=\"428\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">Citizens + Municipal Corporation working together!</text>\n</g>", "beats": ["Welcome back, my little friend! Let's look at the services provided by a Municipal Corporation, using Indore as an example. Indore in Madhya Pradesh has been awarded the cleanest city in India!", "The Indore Municipal Corporation provides many services. First, it collects Property Tax — a tax on property (houses, shops, land). It also collects Water Charges for supplying clean water to homes. And it manages Solid Waste — collecting and disposing of garbage.", "It also issues Trade Licenses for businesses, Marriage Certificates for couples, and provides Fire Services for emergencies. These are important administrative services that keep the city running smoothly.", "It provides Water Tankers for areas without piped water, Ambulances for medical emergencies, and a Grievances service where citizens can register complaints about problems in their area.", "It also gives permissions for Tree Cutting (you cannot cut a tree without permission!), provides Funeral Vans, and maintains Auditoriums for public events. The list of services is long — a Municipal Corporation does a lot!", "Indore in Madhya Pradesh has been awarded the cleanest city in India under the Swachh Survekshan government scheme for seven years in a row! This happened because citizens and the Municipal Corporation worked together — participatory democracy in action. In our next story, we will compare rural and urban governance. Ready? Let's turn the page…"]}, {"id": "rural_urban_comparison", "label": "4. Rural vs Urban Governance", "viewBox": "0 0 600 460", "svg": "<defs><marker id=\"arrG14\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#fbbf24\"/></marker></defs>\n<g class=\"el\" data-beat=\"1\"><text x=\"300\" y=\"30\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"18\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.00s\">RURAL vs URBAN GOVERNANCE</text></g>\n<!-- Rural side -->\n<g class=\"el\" data-beat=\"2\">\n  <rect x=\"40\" y=\"60\" width=\"240\" height=\"320\" rx=\"8\" fill=\"rgba(52,211,153,0.08)\" stroke=\"#34d399\" stroke-width=\"2\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"160\" y=\"85\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"14\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">RURAL</text>\n  <text x=\"160\" y=\"100\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">Panchayati Raj</text>\n</g>\n<!-- Urban side -->\n<g class=\"el\" data-beat=\"3\">\n  <rect x=\"320\" y=\"60\" width=\"240\" height=\"320\" rx=\"8\" fill=\"rgba(56,189,248,0.08)\" stroke=\"#38bdf8\" stroke-width=\"2\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"440\" y=\"85\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">URBAN</text>\n  <text x=\"440\" y=\"100\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">Urban Local Bodies</text>\n</g>\n<!-- Rural tiers -->\n<g class=\"el\" data-beat=\"4\">\n  <rect x=\"60\" y=\"120\" width=\"200\" height=\"30\" rx=\"4\" fill=\"rgba(52,211,153,0.12)\" stroke=\"#34d399\" stroke-width=\"1\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"160\" y=\"140\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Gram Panchayat</text>\n  <rect x=\"60\" y=\"160\" width=\"200\" height=\"30\" rx=\"4\" fill=\"rgba(52,211,153,0.12)\" stroke=\"#34d399\" stroke-width=\"1\" class=\"anim-pop-in\" style=\"animation-delay: 0.30s\" />\n  <text x=\"160\" y=\"180\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">Panchayat Samiti</text>\n  <rect x=\"60\" y=\"200\" width=\"200\" height=\"30\" rx=\"4\" fill=\"rgba(52,211,153,0.12)\" stroke=\"#34d399\" stroke-width=\"1\" class=\"anim-pop-in\" style=\"animation-delay: 0.60s\" />\n  <text x=\"160\" y=\"220\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">Zila Parishad</text>\n</g>\n<!-- Urban tiers -->\n<g class=\"el\" data-beat=\"5\">\n  <rect x=\"340\" y=\"120\" width=\"200\" height=\"30\" rx=\"4\" fill=\"rgba(56,189,248,0.12)\" stroke=\"#38bdf8\" stroke-width=\"1\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"440\" y=\"140\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Ward Committee</text>\n  <rect x=\"340\" y=\"160\" width=\"200\" height=\"30\" rx=\"4\" fill=\"rgba(56,189,248,0.12)\" stroke=\"#38bdf8\" stroke-width=\"1\" class=\"anim-pop-in\" style=\"animation-delay: 0.30s\" />\n  <text x=\"440\" y=\"180\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">Municipal Corp/Council</text>\n</g>\n<!-- Similarities -->\n<g class=\"el\" data-beat=\"6\">\n  <text x=\"300\" y=\"265\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"12\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.00s\">SIMILARITIES:</text>\n  <text x=\"300\" y=\"285\" text-anchor=\"middle\" fill=\"#e2e8f0\" font-size=\"11\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">• Both have elected representatives</text>\n  <text x=\"300\" y=\"303\" text-anchor=\"middle\" fill=\"#e2e8f0\" font-size=\"11\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">• Both are closest to the people</text>\n  <text x=\"300\" y=\"321\" text-anchor=\"middle\" fill=\"#e2e8f0\" font-size=\"11\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">• Both are forms of self-government</text>\n  <text x=\"300\" y=\"339\" text-anchor=\"middle\" fill=\"#e2e8f0\" font-size=\"11\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">• Citizens have duties in both</text>\n</g>\n<!-- Sameer and Anita -->\n<g class=\"el\" data-beat=\"7\">\n  <rect x=\"60\" y=\"395\" width=\"480\" height=\"50\" rx=\"8\" fill=\"rgba(167,139,250,0.12)\" stroke=\"#a78bfa\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" />\n  <text x=\"300\" y=\"415\" text-anchor=\"middle\" fill=\"#a78bfa\" font-size=\"12\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">\"Everyone's voice matters\" — same idea, different scale</text>\n  <text x=\"300\" y=\"432\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">Democracy works in both villages and cities!</text>\n</g>", "beats": ["Welcome back, my little friend! In this final story, let's compare how governance works in rural areas versus urban areas. The systems are different in structure, but the idea is the same!", "On the left is rural governance — the Panchayati Raj system that we learned about in Chapter 11. It works at three tiers: Gram Panchayat (village), Panchayat Samiti (block), and Zila Parishad (district).", "On the right is urban governance — the Urban Local Bodies that we learned about in this chapter. It works with Ward Committees at the ward level and Municipal Corporations or Municipal Councils at the city level.", "In rural areas, the base is the Gram Panchayat, elected by the Gram Sabha. Above it are the Panchayat Samiti and Zila Parishad. Three tiers, from village to district.", "In urban areas, the base is the Ward Committee, elected by the people of the ward. Above it is the Municipal Corporation (for big cities) or Municipal Council (for medium towns). Two main tiers, from ward to city.", "But look at the similarities! Both have elected representatives. Both are closest to the people. Both are forms of self-government. And in both, citizens have duties — to participate, to report problems, to follow rules. The structure is different, but the principle is the same.", "Remember the story of Sameer and Anita? Sameer from the village and Anita from the city discovered that even though their lives are different, the idea of democracy is the same — 'everyone's voice matters'. Whether in a village panchayat or a city municipal corporation, democracy works when people participate. The End."]}], "notes": "<div style=\"background: linear-gradient(135deg, #3b0764 0%, #5b21b6 100%); border: 1px solid #a78bfa; border-radius: 14px; padding: 22px 24px; margin-bottom: 28px;\">\n<h2 style=\"color: #ddd6fe; font-size: 22px; margin: 0 0 8px; font-weight: 700;\">📖 Before We Begin — Story-Time Words</h2>\n<p style=\"color: #ddd6fe; font-size: 13px; margin: 0 0 16px; line-height: 1.6;\">My little friend, before we explore city governance, let us learn some special words. Imagine we are standing on a busy city street, and I am telling you these words one by one. Ready? Let's begin!</p>\n<div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🏙️ 1. Urban Local Body</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">An urban local body is the local government structure in urban areas (cities and towns). It is responsible for services like water, garbage, roads, and infrastructure. There are three types: Municipal Corporation, Municipal Council, and Nagar Panchayat.</p></div>\n<div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🏛️ 2. Municipal Corporation</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">A Municipal Corporation (also called 'Mahanagar Nigam') is the highest urban local body, for cities with a population above 10 lakhs. Examples: Mumbai, Chennai, Delhi, Kolkata. The Municipal Corporation of Greater Mumbai was created in 1865.</p></div>\n<div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🏢 3. Municipal Council</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">A Municipal Council (also called 'Nagar Palika') is for cities and towns with a population between 1 and 10 lakhs. It is the urban local body for medium-sized towns.</p></div>\n<div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🏠 4. Nagar Panchayat</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">A Nagar Panchayat (also called City Council) is for cities and towns with smaller populations (typically under 1 lakh). It is for small towns that are transitioning from villages to towns.</p></div>\n<div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🗺️ 5. Ward</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">A ward is a smaller unit that a city or town is divided into. Each ward elects representatives who form the ward committee. The ward committee is the link between the people of the ward and the urban local body.</p></div>\n<div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">👥 6. Decentralisation</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">Decentralisation means operating with local communities having a direct say, instead of a central authority at the top. Urban local bodies are decentralised — citizens in a ward can come together and take decisions about what is best for them.</p></div>\n<div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🤝 7. Participatory Democracy</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">Participatory democracy is a system where citizens actively participate in governance, not just by voting but by doing their duties. For example, if people follow waste segregation rules or report water leaks, they help the city function better.</p></div>\n<div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🧹 8. Swachh Survekshan</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">Swachh Survekshan is a government scheme that ranks cities by cleanliness. Indore in Madhya Pradesh has been awarded the cleanest city in India for seven years in a row! This happened because citizens and the Municipal Corporation worked together.</p></div>\n</div>\n\n<h2>📝 Key Notes</h2>\n<h3>Types of Urban Local Bodies (by population)</h3>\n<table class=\"styled-table\">\n<tr><th>Type</th><th>Also called</th><th>Population</th><th>Example</th></tr>\n<tr><td><strong>Municipal Corporation</strong></td><td>Mahanagar Nigam</td><td>Above 10 lakhs</td><td>Mumbai, Chennai, Delhi</td></tr>\n<tr><td><strong>Municipal Council</strong></td><td>Nagar Palika</td><td>1 to 10 lakhs</td><td>Medium-sized towns</td></tr>\n<tr><td><strong>Nagar Panchayat</strong></td><td>City Council</td><td>Under 1 lakh</td><td>Small towns</td></tr>\n</table>\n<h3>Services of a Municipal Corporation (Indore example)</h3>\n<ul>\n<li>Property Tax collection</li>\n<li>Water supply (charges)</li>\n<li>Solid Waste Management (garbage)</li>\n<li>Trade Licenses &amp; business permits</li>\n<li>Marriage Certificates</li>\n<li>Fire Services (emergency)</li>\n<li>Water Tanker supply</li>\n<li>Ambulance service</li>\n<li>Grievance redressal (complaints)</li>\n<li>Tree cutting permissions</li>\n<li>Funeral Van service</li>\n<li>Auditorium for events</li>\n</ul>\n<h3>Rural vs Urban Governance</h3>\n<table class=\"styled-table\">\n<tr><th>Feature</th><th>Rural</th><th>Urban</th></tr>\n<tr><td>System</td><td>Panchayati Raj</td><td>Urban Local Bodies</td></tr>\n<tr><td>Base unit</td><td>Gram Panchayat (village)</td><td>Ward Committee (ward)</td></tr>\n<tr><td>Higher tier</td><td>Zila Parishad (district)</td><td>Municipal Corp/Council (city)</td></tr>\n<tr><td>Similarity</td><td colspan=\"2\">Both have elected representatives; both are self-government; both need citizen participation</td></tr>\n</table>", "practice": "<h2>✏️ Practice</h2>\n<div class=\"practice-card\">\n<h3>🧠 Quick Recall</h3>\n<ol>\n<li>Local government structures in urban areas are called ___.</li>\n<li>Cities are divided into smaller units called ___.</li>\n<li>The three types of urban local bodies are ___, ___, and ___.</li>\n<li>A ___ is for cities with population above 10 lakhs.</li>\n<li>A ___ is for cities with population between 1 and 10 lakhs.</li>\n<li>A ___ is for smaller towns.</li>\n<li>'___' means local communities have a direct say in governance.</li>\n<li>___ in Madhya Pradesh has been the cleanest city in India for 7 years.</li>\n<li>The Madras Corporation (now Greater Chennai Corporation) was established in ___.</li>\n<li>In ___, citizens actively participate by doing their duties.</li>\n</ol>\n<button class=\"reveal-btn\">Reveal Answers</button>\n<div class=\"reveal-answer\">\n<ol>\n<li>urban local bodies</li>\n<li>wards</li>\n<li>Municipal Corporation, Municipal Council, Nagar Panchayat</li>\n<li>Municipal Corporation (Mahanagar Nigam)</li>\n<li>Municipal Council (Nagar Palika)</li>\n<li>Nagar Panchayat</li>\n<li>Decentralisation</li>\n<li>Indore</li>\n<li>1688</li>\n<li>participatory democracy</li>\n</ol>\n</div>\n</div>", "realLife": [{"id": "sameer_anita", "title": "👥 Sameer and Anita: A Village-City Conversation", "viewBox": "0 0 600 400", "svg": "<g class=\"el\" data-beat=\"1\"><text x=\"300\" y=\"30\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"16\" font-weight=\"700\">SAMEER &amp; ANITA: A VILLAGE-CITY CONVERSATION</text></g>\n<g class=\"el\" data-beat=\"2\"><circle cx=\"150\" cy=\"100\" r=\"18\" fill=\"rgba(52,211,153,0.2)\" stroke=\"#34d399\" stroke-width=\"2\"/><text x=\"150\" y=\"105\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"11\" font-weight=\"700\">Sameer</text><text x=\"150\" y=\"130\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\">(from village)</text><circle cx=\"450\" cy=\"100\" r=\"18\" fill=\"rgba(56,189,248,0.2)\" stroke=\"#38bdf8\" stroke-width=\"2\"/><text x=\"450\" y=\"105\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\" font-weight=\"700\">Anita</text><text x=\"450\" y=\"130\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\">(from city)</text></g>\n<g class=\"el\" data-beat=\"3\"><rect x=\"80\" y=\"150\" width=\"180\" height=\"50\" rx=\"6\" fill=\"rgba(52,211,153,0.1)\" stroke=\"#34d399\" stroke-width=\"1.5\"/><text x=\"170\" y=\"170\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"11\" font-weight=\"600\">Village: everyone knows</text><text x=\"170\" y=\"185\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"11\" font-weight=\"600\">everyone, helps each other</text><rect x=\"340\" y=\"150\" width=\"180\" height=\"50\" rx=\"6\" fill=\"rgba(56,189,248,0.1)\" stroke=\"#38bdf8\" stroke-width=\"1.5\"/><text x=\"430\" y=\"170\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\" font-weight=\"600\">City: busy, crowded,</text><text x=\"430\" y=\"185\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\" font-weight=\"600\">tall buildings</text></g>\n<g class=\"el\" data-beat=\"4\"><rect x=\"80\" y=\"220\" width=\"440\" height=\"40\" rx=\"6\" fill=\"rgba(251,191,36,0.1)\" stroke=\"#fbbf24\" stroke-width=\"1.5\"/><text x=\"300\" y=\"245\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"12\" font-weight=\"600\">Both have local government &amp; elected representatives</text></g>\n<g class=\"el\" data-beat=\"5\"><text x=\"170\" y=\"285\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"10\" font-weight=\"600\">Sameer: \"Kids reported a</text><text x=\"170\" y=\"298\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"10\" font-weight=\"600\">dangerous wire → fixed!\"</text><text x=\"430\" y=\"285\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"10\" font-weight=\"600\">Anita: \"House collapsed →</text><text x=\"430\" y=\"298\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"10\" font-weight=\"600\">dozens helped clear rubble\"</text></g>\n<g class=\"el\" data-beat=\"6\"><rect x=\"60\" y=\"320\" width=\"480\" height=\"50\" rx=\"8\" fill=\"rgba(167,139,250,0.12)\" stroke=\"#a78bfa\" stroke-width=\"1.5\"/><text x=\"300\" y=\"342\" text-anchor=\"middle\" fill=\"#a78bfa\" font-size=\"13\" font-weight=\"700\">\"Everyone's voice matters!\"</text><text x=\"300\" y=\"360\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">Democracy works in both villages and cities — same idea, different scale</text></g>", "beats": ["Let me tell you a story about two friends — Sameer from a village and Anita from a city. They met by chance and started talking about their very different lives!", "Sameer lives in a village. Anita is visiting her grandparents who live nearby. Sameer asks Anita what it's like in the city. Anita says, 'It's busy and crowded, with tall buildings everywhere. There are so many people rushing around all the time, and it's noisy. Also, people are more independent and often don't even know their neighbours.'", "Sameer is surprised! In his village, everyone knows everyone else and pitches in to help. They work together in the fields, celebrate festivals together, and even make decisions as a community. It's very different from the city!", "But Anita says there's still some sense of community in the city. The other day, following heavy rains, a house collapsed two streets away. Dozens of people gathered from all over the place to help clear the rubble and make sure no one was trapped inside. Both have local government and elected representatives.", "Sameer tells Anita that in his village, even kids can get heard! The other day, a few kids noticed that an electricity wire was hanging dangerously low. They reported it to a Gram Sabha member, and it was fixed! Anita says that's how democracy should work — it's more complicated in the city, but the idea is the same.", "Anita says: 'Everyone's voice matters.' Sameer agrees. Whether in a village panchayat or a city municipal corporation, democracy works when people participate. The city may be more complex, but the idea is the same — everyone's voice matters. That is grassroots democracy!"]}], "guidedPractice": [{"title": "Urban Local Body for Big Cities", "difficulty": "Easy", "diffClass": "gp-easy", "statement": "What is the urban local body for cities with a population above 10 lakhs?", "steps": [{"prompt": "Type the name.", "validate": {"type": "match", "answers": ["municipal corporation", "the municipal corporation", "mahanagar nigam"]}, "formatHint": "Example: Municipal Corporation", "explanation": "Yes! Cities with a population above 10 lakhs have a Municipal Corporation (Mahanagar Nigam) as their highest body.", "hint": "It starts with 'Municipal'."}], "finalAnswer": "Municipal Corporation (Mahanagar Nigam) is for cities above 10 lakhs."}, {"title": "City Divisions", "difficulty": "Easy", "diffClass": "gp-easy", "statement": "What are the smaller units that cities and towns are divided into?", "steps": [{"prompt": "Type the name (plural).", "validate": {"type": "match", "answers": ["wards", "the wards", "ward"]}, "formatHint": "Example: wards", "explanation": "Yes! Cities and towns are divided into smaller units called 'wards'. Each ward elects representatives who form the ward committee.", "hint": "It rhymes with 'cards'."}], "finalAnswer": "Cities are divided into 'wards'."}, {"title": "Cleanest City in India", "difficulty": "Medium", "diffClass": "gp-med", "statement": "Which city has been awarded the cleanest city in India for seven years in a row?", "steps": [{"prompt": "Type the city name.", "validate": {"type": "match", "answers": ["indore", "the indore"]}, "formatHint": "Example: Indore", "explanation": "Yes! Indore in Madhya Pradesh has been awarded the cleanest city in India under the Swachh Survekshan scheme for seven years in a row!", "hint": "It is in Madhya Pradesh."}], "finalAnswer": "Indore (Madhya Pradesh) has been the cleanest city for 7 years in a row."}, {"title": "Oldest Municipal Institution", "difficulty": "Hard", "diffClass": "gp-hard", "statement": "What is the oldest municipal institution in India, established on 29 September 1688?", "steps": [{"prompt": "Type the name.", "validate": {"type": "match", "answers": ["madras corporation", "the madras corporation", "greater chennai corporation", "chennai corporation"]}, "formatHint": "Example: Madras Corporation", "explanation": "Yes! The Madras Corporation (now Greater Chennai Corporation), established on 29 September 1688, is the oldest municipal institution in India.", "hint": "It is now called Greater Chennai Corporation."}], "finalAnswer": "The Madras Corporation (now Greater Chennai Corporation), established 29 September 1688."}], "selfTest": [{"q": "What are the three types of urban local bodies, and what population does each serve?", "steps": "1. Municipal Corporation (Mahanagar Nigam): above 10 lakhs<br>2. Municipal Council (Nagar Palika): 1 to 10 lakhs<br>3. Nagar Panchayat (City Council): smaller towns (under 1 lakh)", "answer": "Municipal Corporation (>10 lakhs), Municipal Council (1-10 lakhs), Nagar Panchayat (smaller towns)."}, {"q": "What is a ward and what does a ward committee do?", "steps": "1. A ward is a smaller unit that a city/town is divided into.<br>2. Each ward elects representatives who form the ward committee.<br>3. Ward committees conduct health camps, campaigns, and report problems like water leaks or damaged roads.", "answer": "A ward is a smaller unit of a city. The ward committee (elected by the ward) conducts health camps, campaigns, and reports problems to the authorities."}, {"q": "What is decentralisation in urban governance?", "steps": "1. Decentralisation means local communities have a direct say.<br>2. Instead of a central authority at the top, decisions are made closer to the people.<br>3. Citizens in a ward can come together and take decisions about what is best for them.", "answer": "Decentralisation means local communities have a direct say in how their areas are managed, instead of a central authority making all decisions from the top."}, {"q": "Why was Indore awarded the cleanest city in India? What role did citizens play?", "steps": "1. Indore won the Swachh Survekshan award for 7 years in a row.<br>2. Citizens played a crucial role by following waste segregation rules.<br>3. They reported problems promptly and participated in cleanliness drives.<br>4. This is participatory democracy in action.", "answer": "Indore was awarded the cleanest city because citizens followed waste segregation, reported problems, and participated in cleanliness drives — working together with the Municipal Corporation."}, {"q": "What is participatory democracy and why is it important?", "steps": "1. Participatory democracy = citizens actively participate in governance.<br>2. Not just by voting, but by doing their duties.<br>3. Example: following waste segregation, reporting water leaks, etc.<br>4. It is important because urban local bodies cannot function efficiently without citizen cooperation.", "answer": "Participatory democracy is when citizens actively participate in governance by doing their duties (like following rules, reporting problems). It is important because urban local bodies need citizen cooperation to function efficiently."}]};
