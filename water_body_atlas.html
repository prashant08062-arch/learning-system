<script>
// Defensive shim — CapsuleGeometry was added in r130, r128 doesn't have it.
// Approximate it with a stretched sphere so the same code works on all versions.
if (typeof THREE !== 'undefined' && typeof THREE.CapsuleGeometry !== 'function') {
  THREE.CapsuleGeometry = function(radius, length, capSegments, radialSegments) {
    const r = Math.max(0.001, radius);
    const geo = new THREE.SphereGeometry(r, radialSegments || 12, capSegments || 12);
    geo.scale(1, 1 + (length / (2 * r)), 1);
    return geo;
  };
}
</script>

const canvas = document.getElementById('three-canvas');
const viewport = document.getElementById('viewport');
const overlayLabels = document.getElementById('overlay-labels');
const legendEl = document.getElementById('legend');
const infoPanel = document.getElementById('info-panel');
const loadingEl = document.getElementById('loading');

let renderer, scene, camera;
let currentTerm = 'sea';
let currentSceneRoot = null;
let currentSceneUpdater = null;  // function called every frame
let isPaused = false;
let isAutoRotate = false;
let clock;
let userRotation = { x: 0, y: 0 };
let targetRotation = { x: 0, y: 0 };
let targetZoom = null;
let userZoom = null;
let isDragging = false;
let isPanning = false;
let lastMouse = { x: 0, y: 0 };

function initEngine() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x0a1326, 1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x0a1326, 60, 200);

  camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
  camera.position.set(0, 25, 45);
  camera.lookAt(0, 0, 0);

  clock = new THREE.Clock();

  // ambient + directional light
  const ambient = new THREE.AmbientLight(0xffffff, 0.55);
  scene.add(ambient);
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(20, 40, 25);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -60;
  sun.shadow.camera.right = 60;
  sun.shadow.camera.top = 60;
  sun.shadow.camera.bottom = -60;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 200;
  sun.shadow.bias = -0.0005;
  scene.add(sun);
  // Subtle blue fill light from below (water reflection)
  const fill = new THREE.DirectionalLight(0x88bbff, 0.18);
  fill.position.set(-15, -8, -20);
  scene.add(fill);

  resize();
  window.addEventListener('resize', resize);
  setupCameraControls();
  loadTerm(currentTerm);
  animate();
  setTimeout(() => { loadingEl.style.display = 'none'; }, 300);
}

function resize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}

// ---------- Camera controls (drag-rotate, scroll-zoom, right-drag-pan) ----------
function setupCameraControls() {
  canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) { isDragging = true; lastMouse = { x: e.clientX, y: e.clientY }; }
    if (e.button === 2) { isPanning = true; lastMouse = { x: e.clientX, y: e.clientY }; }
  });
  window.addEventListener('mouseup', () => { isDragging = false; isPanning = false; });
  window.addEventListener('mousemove', (e) => {
    if (isDragging) {
      const dx = (e.clientX - lastMouse.x) * 0.005;
      const dy = (e.clientY - lastMouse.y) * 0.005;
      targetRotation.y += dx;
      targetRotation.x = Math.max(-1.2, Math.min(1.2, targetRotation.x + dy));
      lastMouse = { x: e.clientX, y: e.clientY };
    } else if (isPanning) {
      const dx = (e.clientX - lastMouse.x) * 0.05;
      const dy = (e.clientY - lastMouse.y) * 0.05;
      camera.position.x -= dx;
      camera.position.y += dy;
      lastMouse = { x: e.clientX, y: e.clientY };
    }
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const scale = e.deltaY > 0 ? 1.1 : 0.9;
    const dist = camera.position.length();
    const newDist = Math.max(8, Math.min(120, dist * scale));
    camera.position.normalize().multiplyScalar(newDist);
  }, { passive: false });
  // Touch support
  let lastTouch = null;
  let lastPinch = null;
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      isDragging = true;
    } else if (e.touches.length === 2) {
      isDragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastPinch = Math.hypot(dx, dy);
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && isDragging && lastTouch) {
      e.preventDefault();
      const dx = (e.touches[0].clientX - lastTouch.x) * 0.005;
      const dy = (e.touches[0].clientY - lastTouch.y) * 0.005;
      targetRotation.y += dx;
      targetRotation.x = Math.max(-1.2, Math.min(1.2, targetRotation.x + dy));
      lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else if (e.touches.length === 2 && lastPinch != null) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      const scale = lastPinch / d;
      const dist = camera.position.length();
      const newDist = Math.max(8, Math.min(120, dist * scale));
      camera.position.normalize().multiplyScalar(newDist);
      lastPinch = d;
    }
  }, { passive: false });
  canvas.addEventListener('touchend', () => { isDragging = false; lastTouch = null; lastPinch = null; });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
}

// ---------- Term switching ----------
function loadTerm(termKey) {
  currentTerm = termKey;
  // Update sidebar
  document.querySelectorAll('.term-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.term === termKey);
  });
  // Clear scene
  if (currentSceneRoot) {
    disposeHierarchy(currentSceneRoot);
    scene.remove(currentSceneRoot);
    currentSceneRoot = null;
  }
  currentSceneUpdater = null;
  // Reset camera
  camera.position.set(0, 25, 45);
  camera.lookAt(0, 0, 0);
  userRotation = { x: 0, y: 0 };
  targetRotation = { x: 0, y: 0 };
  // Build scene
  const builder = SCENE_BUILDERS[termKey];
  if (!builder) return;
  currentSceneRoot = new THREE.Group();
  scene.add(currentSceneRoot);
  builder(currentSceneRoot);
  // Update info panel
  renderInfoPanel(termKey);
  // Update labels & legend
  renderOverlayLabels(termKey);
  renderLegend(termKey);
}

function disposeHierarchy(root) {
  root.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
  });
}

// ---------- Info panel rendering ----------
function renderInfoPanel(termKey) {
  const t = TERMS[termKey];
  let html = `
    <h2>${t.icon} ${t.name}</h2>
    <div class="pronounce">pronunciation: ${t.pronounce}</div>
    <div class="definition">${t.definition}</div>
    <div class="section-title">📍 Real Example</div>
    <div class="example">${t.example}</div>
    <div class="activity">
      <span class="activity-label">🎬 What to watch</span>
      ${t.activity}
    </div>
  `;
  if (t.compare) {
    html += `<div class="section-title">⚖️ ${t.compareTitle || 'Compare'}</div>`;
    html += '<table class="compare-table">';
    t.compare.forEach((row, i) => {
      html += '<tr>';
      row.forEach((cell, j) => {
        html += i === 0
          ? `<th>${cell}</th>`
          : `<td${j === 0 ? ' style="color:#94a3b8;font-weight:600"' : ''}>${cell}</td>`;
      });
      html += '</tr>';
    });
    html += '</table>';
  }
  infoPanel.innerHTML = html;
}

function renderOverlayLabels(termKey) {
  const t = TERMS[termKey];
  overlayLabels.innerHTML = '';
  if (t.labels) {
    t.labels.forEach((label, i) => {
      const div = document.createElement('div');
      div.className = 'overlay-label';
      div.style.animationDelay = (i * 0.08) + 's';
      div.textContent = label;
      overlayLabels.appendChild(div);
    });
  }
}

function renderLegend(termKey) {
  const legends = LEGENDS[termKey];
  if (!legends) { legendEl.style.display = 'none'; return; }
  legendEl.style.display = '';
  legendEl.innerHTML = `<div class="legend-title">${legends.title || 'Legend'}</div>`;
  legends.items.forEach(item => {
    legendEl.innerHTML += `<div class="legend-row">
      <div class="legend-swatch" style="background:${item.color}"></div>
      <div>${item.label}</div>
    </div>`;
  });
}

// Wave-shaded water surface (returns mesh + update function)
function createWater(size, color, opacity = 0.85, segments = 64) {
  const geo = new THREE.PlaneGeometry(size, size, segments, segments);
  const mat = new THREE.MeshStandardMaterial({
    color: color,
    transparent: opacity < 1,
    opacity: opacity,
    roughness: 0.4,
    metalness: 0.2,
    side: THREE.DoubleSide,
    flatShading: false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.receiveShadow = true;
  // store initial vertex positions for wave animation
  const positions = geo.attributes.position;
  const initial = new Float32Array(positions.array.length);
  for (let i = 0; i < positions.array.length; i++) initial[i] = positions.array[i];
  mesh.userData.initialPositions = initial;
  mesh.userData.waveTime = 0;
  mesh.userData.isWater = true;
  return mesh;
}

function updateWater(mesh, dt, amp = 0.25, freq = 0.4) {
  if (!mesh.userData.isWater) return;
  mesh.userData.waveTime += dt;
  const t = mesh.userData.waveTime;
  const positions = mesh.geometry.attributes.position;
  const init = mesh.userData.initialPositions;
  for (let i = 0; i < positions.count; i++) {
    const x = init[i * 3];
    const y = init[i * 3 + 1];
    const z = Math.sin(x * freq + t * 1.2) * amp +
              Math.cos(y * freq + t * 0.9) * amp * 0.7 +
              Math.sin((x + y) * freq * 0.6 + t * 0.5) * amp * 0.5;
    positions.setZ(i, z);
  }
  positions.needsUpdate = true;
  mesh.geometry.computeVertexNormals();
}

// Simple landmass (returns mesh). shape is array of [x,z] points
function createLand(shapePoints, height = 3, color = 0x4a6b3a, y = 0) {
  const shape = new THREE.Shape();
  shape.moveTo(shapePoints[0][0], shapePoints[0][1]);
  for (let i = 1; i < shapePoints.length; i++) {
    shape.lineTo(shapePoints[i][0], shapePoints[i][1]);
  }
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: height,
    bevelEnabled: true,
    bevelThickness: 0.4,
    bevelSize: 0.5,
    bevelSegments: 3
  });
  // rotate so depth becomes Y height
  geo.rotateX(-Math.PI / 2);
  geo.translate(0, y, 0);
  const mat = new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.85,
    metalness: 0.05,
    flatShading: true
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// Simple ship (group) — sails along path
function createShip(scale = 1, color = 0xc04545) {
  const g = new THREE.Group();
  // Hull
  const hullGeo = new THREE.CylinderGeometry(0.7, 0.5, 2.6, 10);
  hullGeo.rotateZ(Math.PI / 2);
  hullGeo.rotateY(Math.PI / 2);
  hullGeo.scale(1, 0.5, 1);
  const hull = new THREE.Mesh(hullGeo, new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 }));
  hull.position.y = 0.3;
  hull.castShadow = true;
  g.add(hull);
  // Cabin
  const cabGeo = new THREE.BoxGeometry(0.8, 0.6, 0.8);
  const cab = new THREE.Mesh(cabGeo, new THREE.MeshStandardMaterial({ color: 0xf1f5f9 }));
  cab.position.set(-0.2, 0.75, 0);
  cab.castShadow = true;
  g.add(cab);
  // Smokestack
  const stk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.15, 0.18, 0.8, 8),
    new THREE.MeshStandardMaterial({ color: 0x1e293b })
  );
  stk.position.set(0.4, 1.3, 0);
  g.add(stk);
  // Smoke particle
  const smoke = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 8, 8),
    new THREE.MeshBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.6 })
  );
  smoke.position.set(0.4, 1.9, 0);
  smoke.userData.isSmoke = true;
  smoke.userData.life = 0;
  g.add(smoke);
  g.scale.setScalar(scale);
  return g;
}

// Fish (small cone) for reef scenes
function createFish(color = 0xff6b35) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.ConeGeometry(0.25, 0.8, 6),
    new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 })
  );
  body.rotation.z = Math.PI / 2;
  g.add(body);
  const tail = new THREE.Mesh(
    new THREE.ConeGeometry(0.18, 0.35, 4),

  );

// Cloud (soft sphere cluster)
function createClouds(count = 5, area = 30, y = 18) {
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.55 });
  for (let i = 0; i < count; i++) {
    const cg = new THREE.SphereGeometry(1.2 + Math.random(), 8, 6);
    const c = new THREE.Mesh(cg, mat);
    c.position.set(
      (Math.random() - 0.5) * area,
      y + (Math.random() - 0.5) * 2,
      (Math.random() - 0.5) * area
    );
    c.scale.set(1.5 + Math.random(), 0.7, 1);
    g.add(c);
  }
  return g;
}

const SCENE_BUILDERS = {};

// SEA ----------------------------------------------------------------
SCENE_BUILDERS.sea = function(root) {
  // Wide open sea with a partial land arc on one side
  const sea = createWater(80, 0x1e6cb0, 0.92, 80);
  sea.position.y = 0;
  root.add(sea);
  // Coastline arc — partly enclosing the sea
  const coastPoints = [];
  for (let i = 0; i <= 12; i++) {
    const a = (i / 12) * Math.PI * 0.9 + Math.PI * 0.05;
    const r = 22 + Math.sin(i * 0.7) * 2;
    coastPoints.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  // Close it inward
  coastPoints.push([5, 25], [-5, 24], [0, 18]);
  const coast = createLand(coastPoints, 4, 0x5a7a3a);
  root.add(coast);
  // A ship crossing the open sea
  const ship = createShip(0.9, 0xb03030);
  ship.position.set(-15, 0.7, -5);
  root.add(ship);
  const ship2 = createShip(0.6, 0x3050b0);
  ship2.position.set(15, 0.7, 8);
  root.add(ship2);
  // Clouds
  root.add(createClouds(6, 60, 22));
  // Sea floor visible below
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 80),
    new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.95 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3.5;
  floor.receiveShadow = true;
  root.add(floor);
  // Frame update
  const waters = [sea];
  root.userData.updater = (dt, t) => {
    waters.forEach(w => updateWater(w, dt, 0.2, 0.35));
    ship.position.x = -15 + ((t * 1.5) % 35);
    ship.position.z = -5 + Math.sin(t * 0.3) * 2;
    ship.rotation.y = Math.sin(t * 0.3) * 0.15;
    ship2.position.x = 15 - ((t * 1.2) % 35);
    ship2.position.z = 8 + Math.cos(t * 0.25) * 2;
    ship2.rotation.y = Math.PI + Math.sin(t * 0.25) * 0.15;
    // smoke rise
    ship.traverse(o => {
      if (o.userData.isSmoke) {
        o.userData.life += dt;
        o.position.y = 1.9 + o.userData.life * 0.6;
        o.material.opacity = Math.max(0, 0.6 - o.userData.life * 0.3);
        if (o.userData.life > 2) { o.userData.life = 0; o.position.set(0.4, 1.9, 0); o.material.opacity = 0.6; }
      }
    });
  };
};

// GULF ---------------------------------------------------------------
SCENE_BUILDERS.gulf = function(root) {
  // Land with a deep U-shape cut for the gulf
  const sea = createWater(80, 0x1e6cb0, 0.92, 80);
  sea.position.y = 0;
  root.add(sea);
  // Land with deep U-shape cut
  const coastPoints = [
    [-30, 30], [30, 30], [30, -5],
    // Gulf: water enters here, deeply inland
    [12, -5], [10, -10], [8, -15], [6, -20], [4, -25], [-4, -25],
    [-6, -20], [-8, -15], [-10, -10], [-12, -5],
    [-30, -5]
  ];
  const coast = createLand(coastPoints, 4, 0x5a7a3a);
  root.add(coast);
  // Gulf water — narrow finger of sea into the land
  const gulfWater = createWater(20, 0x2576c4, 0.92, 30);
  gulfWater.scale.set(0.4, 1, 1.3);
  gulfWater.position.set(0, 0.05, -15);
  root.add(gulfWater);
  // Ship entering the gulf
  const ship = createShip(0.7, 0xb03030);
  ship.position.set(0, 0.7, -20);
  root.add(ship);
  // Clouds
  root.add(createClouds(5, 50, 22));
  // Sea floor
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 80),
    new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.95 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3.5;
  floor.receiveShadow = true;
  root.add(floor);
  root.userData.updater = (dt, t) => {
    updateWater(sea, dt, 0.2, 0.35);
    updateWater(gulfWater, dt, 0.15, 0.45);
    // Ship slowly moves in/out of gulf
    const cycle = (t * 0.4) % (Math.PI * 2);
    ship.position.z = -8 - Math.sin(cycle) * 14;
    ship.rotation.y = cycle < Math.PI ? 0 : Math.PI;
    ship.traverse(o => {
      if (o.userData.isSmoke) {
        o.userData.life += dt;
        o.position.y = 1.9 + o.userData.life * 0.6;
        o.material.opacity = Math.max(0, 0.6 - o.userData.life * 0.3);
        if (o.userData.life > 2) { o.userData.life = 0; o.position.set(0.4, 1.9, 0); o.material.opacity = 0.6; }
      }
    });
  };
};

    new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.95 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3.5;
  floor.receiveShadow = true;
  root.add(floor);
  root.userData.updater = (dt, t) => {

    // Ships gently bob
    ship1.position.y = 0.7 + Math.sin(t * 1.2) * 0.15;
    ship2.position.y = 0.7 + Math.sin(t * 1.4 + 1) * 0.15;
    ship1.rotation.z = Math.sin(t * 1.2) * 0.04;
    ship2.rotation.z = Math.sin(t * 1.4 + 1) * 0.04;
  };
};

  ];

  // Land 2 (lower)
  const l2Points = [
    [-30, -30], [30, -30], [30, -8], [22, -6], [18, -4], [12, -3], [-12, -3],
    [-18, -4], [-22, -6], [-30, -8]
  ];
  root.add(createLand(l2Points, 3.5, 0x6a8a4a));
  // Strait water strip
  const straitWater = createWater(80, 0x2a78c4, 0.95, 80);

  ship1.position.set(-18, 0.7, -1.2);
  ship1.rotation.y = Math.PI / 2;
  root.add(ship1);
  const ship2 = createShip(0.6, 0x3050b0);
  ship2.position.set(18, 0.7, 1.2);
  ship2.rotation.y = -Math.PI / 2;
  root.add(ship2);
  root.add(createClouds(6, 60, 22));
  const floor = new THREE.Mesh(

        if (o.userData.life > 2) { o.userData.life = 0; o.position.set(0.4, 1.9, 0); o.material.opacity = 0.6; }

// CANAL --------------------------------------------------------------
SCENE_BUILDERS.canal = function(root) {
  const sea = createWater(80, 0x1e6cb0, 0.92, 80);
  sea.position.y = -1;
  root.add(sea);
  // Two landmasses split by a straight cut (the canal)
  // Land 1 (left of canal)
  root.add(createLand([
    [-30, -25], [-4, -25], [-4, 25], [-30, 25]
  ], 4, 0x6a8a4a));
  // Land 2 (right of canal)
  root.add(createLand([
    [4, -25], [30, -25], [30, 25], [4, 25]
  ], 4, 0x6a8a4a));
  // Canal water — straight, rectangular
  const canalGeo = new THREE.PlaneGeometry(60, 8, 40, 8);
  const canalMat = new THREE.MeshStandardMaterial({
    color: 0x1e6cb0, roughness: 0.4, metalness: 0.2,
    side: THREE.DoubleSide
  });
  const canal = new THREE.Mesh(canalGeo, canalMat);
  canal.rotation.x = -Math.PI / 2;
  canal.position.y = 0.5;
  root.add(canal);
  const canalPos = canal.geometry.attributes.position;
  const canalInit = new Float32Array(canalPos.array.length);
  for (let i = 0; i < canalPos.array.length; i++) canalInit[i] = canalPos.array[i];
  canal.userData.initialPositions = canalInit;
  canal.userData.isWater = true;
  canal.userData.waveTime = 0;
  // Two lock gates at the canal ends
  const gateMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.7 });
  const gate1 = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 0.5), gateMat);
  gate1.position.set(-30, 2, 0);
  gate1.castShadow = true;
  root.add(gate1);
  const gate2 = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 0.5), gateMat);
  gate2.position.set(30, 2, 0);
  gate2.castShadow = true;
  root.add(gate2);
  // Lock chambers (visualised by water level steps)
  // Ship in canal
  const ship = createShip(0.7, 0xc04540);
  ship.position.set(0, 1.2, 0);
  root.add(ship);
  root.add(createClouds(6, 60, 22));
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 80),
    new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.95 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3.5;
  floor.receiveShadow = true;
  root.add(floor);
  root.userData.updater = (dt, t) => {
    updateWater(sea, dt, 0.18, 0.4);
    // Canal water gentle ripple
    const cp = canal.geometry.attributes.position;
    const ci = canal.userData.initialPositions;
    canal.userData.waveTime += dt;
    const tt = canal.userData.waveTime;
    for (let i = 0; i < cp.count; i++) {
      const x = ci[i * 3];
      cp.setZ(i, Math.sin(x * 0.4 + tt * 2) * 0.06);
    }
    cp.needsUpdate = true;
    // Lock cycle: 0-4s gates closed, ship in middle chamber
    //  4-6s gate1 opens, ship moves left, 6-10s ship in left chamber
    // 10-12s gate2 opens, ship moves right, 12-16s ship exits
    const cycle = (t * 0.5) % 8;
    let gate1Open = (cycle > 1 && cycle < 3);
    let gate2Open = (cycle > 5 && cycle < 7);
    gate1.scale.x = gate1Open ? 0.1 : 1;
    gate2.scale.x = gate2Open ? 0.1 : 1;
    // Ship moves slowly along canal, pauses at locks
    if (cycle < 1) { ship.position.x = -10; ship.position.y = 1.2; ship.rotation.y = Math.PI/2; }
    else if (cycle < 3) { ship.position.x = -10 + (cycle - 1) * 5; ship.position.y = 1.2; ship.rotation.y = Math.PI/2; }
    else if (cycle < 5) { ship.position.x = 0; ship.position.y = 1.2 + Math.sin((cycle-3) * Math.PI) * 0.3; ship.rotation.y = Math.PI/2; }
    else if (cycle < 7) { ship.position.x = (cycle - 5) * 5; ship.position.y = 1.2; ship.rotation.y = Math.PI/2; }
    else { ship.position.x = 10; ship.position.y = 1.2; ship.rotation.y = Math.PI/2; }
  };
};

// TRENCH -------------------------------------------------------------
SCENE_BUILDERS.trench = function(root) {
  // Side view of ocean floor with V-shape trench
  // Sea level water surface
  const sea = createWater(80, 0x1e6cb0, 0.7, 60);
  sea.position.y = 8;
  root.add(sea);
  // Build the seafloor with a deep V cut
  // Use a series of points to define profile, then extrude
  const profile = [];
  // Right side: shallow shelf, then slope down into trench, V at bottom, slope up
  for (let i = 0; i <= 20; i++) {
    const x = -30 + (i / 20) * 22;  // -30 to -8
    profile.push([x, 6 - (i / 20) * 4]);  // 6 -> 2 (continental shelf)
  }
  // Slope down to trench
  for (let i = 0; i <= 12; i++) {
    const x = -8 + (i / 12) * 5;  // -8 to -3
    profile.push([x, 2 - (i / 12) * 10]);  // 2 -> -8
  }
  // V-shape trench bottom (deepest point)
  for (let i = 0; i <= 6; i++) {
    const x = -3 + (i / 6) * 6;  // -3 to 3
    profile.push([x, -8 - Math.sin((i / 6) * Math.PI) * 3]);  // -8 -> -11 -> -8
  }
  // Slope up
  for (let i = 0; i <= 12; i++) {
    const x = 3 + (i / 12) * 5;  // 3 to 8
    profile.push([x, -8 + (i / 12) * 10]);  // -8 -> 2
  }
  // Right shelf
  for (let i = 0; i <= 20; i++) {
    const x = 8 + (i / 20) * 22;  // 8 to 30
    profile.push([x, 2 + (i / 20) * 4]);  // 2 -> 6
  }
  const shape = new THREE.Shape();
  shape.moveTo(profile[0][0], profile[0][1]);
  for (let i = 1; i < profile.length; i++) shape.lineTo(profile[i][0], profile[i][1]);
  // Close along the bottom
  shape.lineTo(30, -15);
  shape.lineTo(-30, -15);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 50, bevelEnabled: false });
  geo.translate(0, 0, -25);
  const mat = new THREE.MeshStandardMaterial({ color: 0x3a3530, roughness: 0.95, flatShading: true });
  const floor = new THREE.Mesh(geo, mat);
  floor.receiveShadow = true;
  floor.castShadow = true;
  root.add(floor);
  // Depth markers (vertical lines + labels would be 2D; here use thin poles)
  const markerMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24 });
  // Sea level marker
  const seaLevelPole = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1, 0.2), markerMat);
  seaLevelPole.position.set(-25, 9, 0);
  root.add(seaLevelPole);
  // Mt Everest height marker (8848 m ~ scaled)
  const everestPole = new THREE.Mesh(new THREE.BoxGeometry(0.2, 16, 0.2), new THREE.MeshBasicMaterial({ color: 0xef4444 }));
  everestPole.position.set(-22, 8, 0);
  root.add(everestPole);
  // Mariana depth marker
  const trenchPole = new THREE.Mesh(new THREE.BoxGeometry(0.2, 19, 0.2), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
  trenchPole.position.set(22, 0, 0);
  root.add(trenchPole);
  // Submersible descending into trench
  const sub = new THREE.Group();
  const subBody = new THREE.Mesh(
    new THREE.CapsuleGeometry(0.7, 1.5, 4, 8),
    new THREE.MeshStandardMaterial({ color: 0xfbbf24, metalness: 0.6, roughness: 0.4 })
  );
  subBody.rotation.z = Math.PI / 2;
  sub.add(subBody);
  // Manipulator arm
  const arm = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.15, 1.2), new THREE.MeshStandardMaterial({ color: 0x64748b }));
  arm.position.set(0.8, -0.3, 0);
  sub.add(arm);
  // Light cone
  const lightCone = new THREE.Mesh(
    new THREE.ConeGeometry(1.5, 4, 16, 1, true),
    new THREE.MeshBasicMaterial({ color: 0xfff8a0, transparent: true, opacity: 0.18, side: THREE.DoubleSide })
  );
  lightCone.rotation.x = -Math.PI / 2;
  lightCone.position.set(0.6, 0, 0);
  sub.add(lightCone);
  root.add(sub);
  root.add(createClouds(4, 60, 22));
  root.userData.updater = (dt, t) => {
    updateWater(sea, dt, 0.15, 0.4);
    // Sub descends and rises
    const cycle = (t * 0.15) % (Math.PI * 2);
    sub.position.x = 0;
    sub.position.y = 5 - Math.sin(cycle) * 14;
    sub.position.z = 0;
    sub.rotation.y = Math.sin(t * 0.4) * 0.2;
  };
  // Side-view camera
  camera.position.set(0, 0, 70);
  camera.lookAt(0, -3, 0);
};

// RIDGE --------------------------------------------------------------
SCENE_BUILDERS.ridge = function(root) {
  // Underwater view of mountain chain on seafloor
  // Sea surface
  const sea = createWater(80, 0x1e6cb0, 0.75, 60);
  sea.position.y = 12;
  root.add(sea);
  // Seafloor profile with mountain chain (multiple peaks)
  const profile = [];
  for (let i = 0; i <= 40; i++) {
    const x = -30 + (i / 40) * 60;
    // Base seafloor at y=-2
    let y = -2;
    // Add ridge peaks in the middle
    const dx = x;
    if (Math.abs(dx) < 18) {
      // Multiple peaks
      y += Math.max(0, Math.sin(dx * 0.4) * 5 + Math.sin(dx * 0.7 + 1) * 3 + 4);
    }
    // Central rift valley
    if (Math.abs(dx) < 1.5) y = -3;
    profile.push([x, y]);
  }
  const shape = new THREE.Shape();
  shape.moveTo(profile[0][0], profile[0][1]);
  for (let i = 1; i < profile.length; i++) shape.lineTo(profile[i][0], profile[i][1]);
  shape.lineTo(30, -12);
  shape.lineTo(-30, -12);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: 50, bevelEnabled: false });
  geo.translate(0, 0, -25);
  const mat = new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.95, flatShading: true });
  const floor = new THREE.Mesh(geo, mat);
  floor.receiveShadow = true;
  floor.castShadow = true;
  root.add(floor);
  // Magma glow at rift
  const magma = new THREE.Mesh(
    new THREE.SphereGeometry(1, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xff6a1a, transparent: true, opacity: 0.85 })
  );
  magma.position.set(0, -2, 0);
  root.add(magma);
  // Magma particles rising
  const particles = [];
  for (let i = 0; i < 20; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xff9a3a, transparent: true, opacity: 0.9 })
    );
    p.userData.life = Math.random() * 2;
    p.userData.x = (Math.random() - 0.5) * 1.5;
    p.userData.z = (Math.random() - 0.5) * 1.5;
    particles.push(p);
    root.add(p);
  }
  // Plates spreading indicators (arrows would be 2D; use thin boxes)
  const arrowMat = new THREE.MeshBasicMaterial({ color: 0xfbbf24 });
  const aL = new THREE.Mesh(new THREE.BoxGeometry(3, 0.15, 0.15), arrowMat);
  aL.position.set(-8, 6, 0);
  root.add(aL);
  const aR = new THREE.Mesh(new THREE.BoxGeometry(3, 0.15, 0.15), arrowMat);
  aR.position.set(8, 6, 0);
  root.add(aR);
  // Clouds above
  root.add(createClouds(4, 60, 22));
  root.userData.updater = (dt, t) => {
    updateWater(sea, dt, 0.18, 0.35);
    // Magma pulse
    magma.material.opacity = 0.6 + Math.sin(t * 4) * 0.25;
    magma.scale.setScalar(1 + Math.sin(t * 3) * 0.15);
    // Particles rise
    particles.forEach(p => {
      p.userData.life += dt;
      if (p.userData.life > 2) {
        p.userData.life = 0;
        p.position.set(p.userData.x * 0.3, -2, p.userData.z * 0.3);
        p.material.opacity = 0.9;
      }
      p.position.y = -2 + p.userData.life * 3;
      p.material.opacity = Math.max(0, 0.9 - p.userData.life * 0.45);
      p.scale.setScalar(1 - p.userData.life * 0.3);
    });
    // Arrow plates spreading
    aL.position.x = -8 - (Math.sin(t * 0.5) * 0.5);
    aR.position.x = 8 + (Math.sin(t * 0.5) * 0.5);
  };
  camera.position.set(0, 8, 60);
  camera.lookAt(0, 0, 0);
};

// REEF ---------------------------------------------------------------
SCENE_BUILDERS.reef = function(root) {
  // Sea surface
  const sea = createWater(80, 0x1e6cb0, 0.75, 60);
  sea.position.y = 4;
  root.add(sea);
  // Seafloor with a sinking island
  const islandShape = [];
  for (let i = 0; i <= 20; i++) {
    const a = (i / 20) * Math.PI * 2;
    islandShape.push([Math.cos(a) * 14, Math.sin(a) * 14]);
  }
  const island = createLand(islandShape, 2, 0x6a5a3a, -3);
  island.position.y = -2;
  root.add(island);
  // Coral formations around the island
  const corals = [];
  const coralColors = [0xff6b6b, 0xffa500, 0xffd166, 0xff85a2, 0x66c7a0, 0x56cfe1];
  for (let i = 0; i < 24; i++) {
    const cg = new THREE.Group();
    const branches = 3 + Math.floor(Math.random() * 4);
    for (let b = 0; b < branches; b++) {
      const bgeo = new THREE.CylinderGeometry(0.15, 0.3, 1.5 + Math.random(), 6);
      const bm = new THREE.MeshStandardMaterial({
        color: coralColors[i % coralColors.length],
        roughness: 0.7
      });
      const branch = new THREE.Mesh(bgeo, bm);
      branch.position.set((Math.random()-0.5)*0.5, 0.5, (Math.random()-0.5)*0.5);
      branch.rotation.z = (Math.random()-0.5) * 0.6;
      branch.rotation.x = (Math.random()-0.5) * 0.6;
      branch.castShadow = true;
      cg.add(branch);
    }
    const a = (i / 24) * Math.PI * 2;
    const r = 13 + Math.random() * 2;
    cg.position.set(Math.cos(a) * r, -2, Math.sin(a) * r);
    cg.userData.swayPhase = Math.random() * Math.PI * 2;
    corals.push(cg);
    root.add(cg);
  }
  // Fish swimming
  const fishes = [];
  for (let i = 0; i < 14; i++) {
    const f = createFish([0xff6b35, 0xffd166, 0x4ec9b0, 0x4dabf7, 0xff85a2][i % 5]);
    f.position.set((Math.random()-0.5)*20, 1 + Math.random()*1.5, (Math.random()-0.5)*20);
    f.userData.angle = Math.random() * Math.PI * 2;
    f.userData.radius = 5 + Math.random() * 8;
    f.userData.height = 1 + Math.random() * 1.5;
    f.userData.speed = 0.3 + Math.random() * 0.5;
    fishes.push(f);
    root.add(f);
  }
  // Sunlight rays through water (subtle cones)
  const rayMat = new THREE.MeshBasicMaterial({
    color: 0xfff8a0, transparent: true, opacity: 0.08, side: THREE.DoubleSide
  });
  for (let i = 0; i < 6; i++) {
    const ray = new THREE.Mesh(new THREE.ConeGeometry(2.5, 8, 8, 1, true), rayMat);
    ray.position.set((Math.random()-0.5)*24, 0, (Math.random()-0.5)*24);
    ray.rotation.x = (Math.random()-0.5)*0.4;
    ray.rotation.z = (Math.random()-0.5)*0.4;
    root.add(ray);
  }
  root.add(createClouds(4, 60, 18));
  root.userData.updater = (dt, t) => {
    updateWater(sea, dt, 0.18, 0.4);
    // Coral sway
    corals.forEach(c => {
      c.rotation.z = Math.sin(t * 0.8 + c.userData.swayPhase) * 0.05;
    });
    // Fish swim in circles
    fishes.forEach(f => {
      f.userData.angle += dt * f.userData.speed;
      f.position.x = Math.cos(f.userData.angle) * f.userData.radius;
      f.position.z = Math.sin(f.userData.angle) * f.userData.radius;
      f.position.y = f.userData.height + Math.sin(t * 2 + f.userData.swayPhase) * 0.2;
      f.rotation.y = -f.userData.angle + Math.PI/2;
      f.userData.swayPhase = f.userData.swayPhase || 0;
    });
  };
  camera.position.set(0, 12, 30);
  camera.lookAt(0, -1, 0);
};

// ATOLL --------------------------------------------------------------
SCENE_BUILDERS.atoll = function(root) {
  // Sea
  const sea = createWater(80, 0x1e6cb0, 0.85, 80);
  sea.position.y = 0;
  root.add(sea);
  // Sinking volcanic base (deep underwater)
  const volcBaseGeo = new THREE.ConeGeometry(14, 10, 32, 1, false);
  const volcBase = new THREE.Mesh(volcBaseGeo, new THREE.MeshStandardMaterial({ color: 0x3a3530, roughness: 0.95 }));
  volcBase.rotation.x = Math.PI;
  volcBase.position.y = -6;
  root.add(volcBase);
  // Coral ring (low island ring)
  const ringInner = 7, ringOuter = 11;
  const ringShape = new THREE.Shape();
  ringShape.absarc(0, 0, ringOuter, 0, Math.PI * 2, false);
  const holePath = new THREE.Path();
  holePath.absarc(0, 0, ringInner, 0, Math.PI * 2, true);
  ringShape.holes.push(holePath);
  const ringGeo = new THREE.ExtrudeGeometry(ringShape, {
    depth: 1.5, bevelEnabled: true, bevelThickness: 0.3, bevelSize: 0.3, bevelSegments: 2
  });
  ringGeo.rotateX(-Math.PI / 2);
  const ring = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({ color: 0xead7a0, roughness: 0.85 }));
  ring.position.y = 0.2;
  ring.castShadow = true;
  ring.receiveShadow = true;
  root.add(ring);
  // Coral heads (pinnacles) on the outer edge
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    const r = ringOuter + 1;
    const ch = new THREE.Mesh(
      new THREE.SphereGeometry(0.8 + Math.random() * 0.5, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xff85a2, roughness: 0.7 })
    );
    ch.position.set(Math.cos(a) * r, -0.2, Math.sin(a) * r);
    ch.scale.y = 0.7;
    ch.castShadow = true;
    root.add(ch);
  }
  // Lagoon water inside ring (calmer, lighter color)
  const lagoon = new THREE.Mesh(
    new THREE.CircleGeometry(ringInner - 0.3, 48),
    new THREE.MeshStandardMaterial({ color: 0x4ad9c4, transparent: true, opacity: 0.85, roughness: 0.3, metalness: 0.1 })
  );
  lagoon.rotation.x = -Math.PI / 2;
  lagoon.position.y = 0.4;
  root.add(lagoon);
  // Waves crashing on outer ring (whitecaps — small spheres)
  const whitecaps = [];
  for (let i = 0; i < 18; i++) {
    const w = new THREE.Mesh(
      new THREE.SphereGeometry(0.4, 8, 6),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })
    );
    const a = (i / 18) * Math.PI * 2;
    w.position.set(Math.cos(a) * (ringOuter + 2), 0.5, Math.sin(a) * (ringOuter + 2));
    w.userData.angle = a;
    w.userData.phase = Math.random() * Math.PI * 2;
    whitecaps.push(w);
    root.add(w);
  }
  // Fish in lagoon
  const fishes = [];
  for (let i = 0; i < 6; i++) {
    const f = createFish([0xffd166, 0x4ec9b0, 0xff85a2][i % 3]);
    f.position.set(0, 0.8, 0);
    f.userData.angle = (i / 6) * Math.PI * 2;
    f.userData.radius = 3 + Math.random() * 2;
    f.userData.speed = 0.4 + Math.random() * 0.3;
    fishes.push(f);
    root.add(f);
  }
  root.add(createClouds(5, 50, 18));
  root.userData.updater = (dt, t) => {
    updateWater(sea, dt, 0.2, 0.35);
    // Lagoon gentle ripple
    const lp = lagoon.geometry.attributes.position;
    if (!lagoon.userData.init) {
      lagoon.userData.init = new Float32Array(lp.array.length);
      for (let i = 0; i < lp.array.length; i++) lagoon.userData.init[i] = lp.array[i];
    }
    const li = lagoon.userData.init;
    for (let i = 0; i < lp.count; i++) {
      const x = li[i * 3];
      const y = li[i * 3 + 1];
      lp.setZ(i, Math.sin(x * 0.5 + t * 1.5) * 0.05 + Math.cos(y * 0.5 + t * 1.2) * 0.05);
    }
    lp.needsUpdate = true;
    // Whitecaps appear intermittently
    whitecaps.forEach(w => {
      const phase = t * 1.5 + w.userData.phase;
      const visible = Math.sin(phase) > 0.3;
      w.material.opacity = visible ? 0.85 : 0;
      w.scale.setScalar(visible ? 1 + Math.sin(phase * 2) * 0.3 : 0.1);
    });
    // Fish swim in circles inside lagoon
    fishes.forEach(f => {
      f.userData.angle += dt * f.userData.speed;
      f.position.x = Math.cos(f.userData.angle) * f.userData.radius;
      f.position.z = Math.sin(f.userData.angle) * f.userData.radius;
      f.rotation.y = -f.userData.angle + Math.PI/2;
    });
  };
  camera.position.set(15, 22, 25);
  camera.lookAt(0, 0, 0);
};

// ISTHMUS ------------------------------------------------------------
SCENE_BUILDERS.isthmus = function(root) {
  // Sea on both sides
  const sea = createWater(80, 0x1e6cb0, 0.92, 80);
  sea.position.y = 0;
  root.add(sea);
  // Two large landmasses connected by narrow strip
  // North landmass
  root.add(createLand([
    [-30, 8], [-3, 8], [-3, 4], [-2, 3.5], [2, 3.5], [3, 4], [3, 8], [30, 8],
    [30, 30], [-30, 30]
  ], 4, 0x5a7a3a));
  // South landmass
  root.add(createLand([
    [-30, -8], [-3, -8], [-3, -4], [-2, -3.5], [2, -3.5], [3, -4], [3, -8], [30, -8],
    [30, -30], [-30, -30]
  ], 4, 0x6a8a4a));
  // Ships sailing around (the long way)
  const ship1 = createShip(0.8, 0xc04540);
  ship1.position.set(-25, 0.7, -15);
  ship1.rotation.y = 0;
  root.add(ship1);
  const ship2 = createShip(0.8, 0x4060c0);
  ship2.position.set(25, 0.7, 15);
  ship2.rotation.y = Math.PI;
  root.add(ship2);
  // A canal cut through isthmus (small detail)
  const canal = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 8, 4, 8),
    new THREE.MeshStandardMaterial({ color: 0x2576c4, roughness: 0.3 })
  );
  canal.rotation.x = -Math.PI / 2;
  canal.position.set(0, 0.3, 0);
  root.add(canal);
  root.add(createClouds(6, 60, 22));
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 80),
    new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.95 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3.5;
  floor.receiveShadow = true;
  root.add(floor);
  root.userData.updater = (dt, t) => {
    updateWater(sea, dt, 0.2, 0.35);
    // Ships go around the isthmus
    const cycle = (t * 0.3) % (Math.PI * 2);
    ship1.position.x = -25 + Math.cos(cycle) * 35;
    ship1.position.z = -15 + Math.sin(cycle) * 35;
    ship1.rotation.y = -cycle - Math.PI/2;
    const cycle2 = cycle + Math.PI;
    ship2.position.x = 25 + Math.cos(cycle2) * 35;
    ship2.position.z = 15 + Math.sin(cycle2) * 35;
    ship2.rotation.y = -cycle2 - Math.PI/2;
    [ship1, ship2].forEach(s => s.traverse(o => {
      if (o.userData.isSmoke) {
        o.userData.life += dt;
        o.position.y = 1.9 + o.userData.life * 0.6;
        o.material.opacity = Math.max(0, 0.6 - o.userData.life * 0.3);
        if (o.userData.life > 2) { o.userData.life = 0; o.position.set(0.4, 1.9, 0); o.material.opacity = 0.6; }
      }
    }));
  };
};

SCENE_BUILDERS.peninsula = function(root) {
  const sea = createWater(80, 0x1e6cb0, 0.92, 80);

  // Landmass with peninsula shape — three sides in water
  // Mainland to the north, peninsula projecting south

    [-30, 30], [30, 30], [30, 0],
    [25, -2], [18, -3], [12, -4], [6, -8], [0, -18],
    [-6, -8], [-12, -4], [-18, -3], [-25, -2], [-30, 0]
  ];
  root.add(createLand(coastPoints, 4, 0x5a7a3a));
  // Waves on three sides
  const whitecaps = [];
  for (let i = 0; i < 30; i++) {
    const w = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 6, 4),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 })
    );
    w.userData.phase = Math.random() * Math.PI * 2;

// DELTA --------------------------------------------------------------
SCENE_BUILDERS.delta = function(root) {
  const sea = createWater(80, 0x1e6cb0, 0.92, 80);
  sea.position.y = 0;
  root.add(sea);
  // Mainland at top, delta fan spreading into sea
  root.add(createLand([
    [-30, 30], [30, 30], [30, 18], [15, 14], [-15, 14], [-30, 18]
  ], 3, 0x5a7a3a));
  // Main river channel
  const riverMat = new THREE.MeshStandardMaterial({ color: 0x2576c4, roughness: 0.3 });
  const riverGeo = new THREE.PlaneGeometry(2, 16, 4, 16);
  const river = new THREE.Mesh(riverGeo, riverMat);
  river.rotation.x = -Math.PI / 2;
  river.position.set(0, 0.1, 22);
  root.add(river);
  // Distributaries (fan-shaped)
  const distributaries = [];
  for (let i = 0; i < 5; i++) {
    const angle = (i - 2) * 0.4;
    const len = 14;
    const rg = new THREE.PlaneGeometry(1.2, len, 4, 8);
    const r = new THREE.Mesh(rg, riverMat);
    r.rotation.x = -Math.PI / 2;
    r.rotation.z = angle;  // tilt in plane (around vertical)
    r.position.set(Math.sin(angle) * (len/2), 0.1, 22 - Math.cos(angle) * (len/2));
    distributaries.push(r);
    root.add(r);
  }
  // Delta sediment fan (between distributaries)
  const fanGeo = new THREE.CircleGeometry(15, 32, -Math.PI/2 - 0.6, 1.2);
  const fanMat = new THREE.MeshStandardMaterial({ color: 0xb09860, roughness: 0.9 });
  const fan = new THREE.Mesh(fanGeo, fanMat);
  fan.rotation.x = -Math.PI / 2;
  fan.position.set(0, 0.05, 18);
  fan.scale.set(1, 0.6, 1);
  root.add(fan);
  // Flow particles
  const particles = [];
  for (let i = 0; i < 30; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 })
    );
    p.userData.life = Math.random() * 3;
    p.userData.channel = Math.floor(Math.random() * 5);
    p.userData.speed = 0.8 + Math.random() * 0.5;
    particles.push(p);
    root.add(p);
  }
  root.add(createClouds(5, 50, 22));
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 80),
    new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.95 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3.5;
  floor.receiveShadow = true;
  root.add(floor);
  root.userData.updater = (dt, t) => {
    updateWater(sea, dt, 0.2, 0.35);
    // Particles flow down the river then split into distributaries
    particles.forEach(p => {
      p.userData.life += dt;
      if (p.userData.life > 3.5) {
        p.userData.life = 0;
        p.userData.channel = Math.floor(Math.random() * 5);
      }
      const a = (p.userData.channel - 2) * 0.4;
      const speed = p.userData.speed;
      // First descend main river
      if (p.userData.life < 1) {
        p.position.set(0, 0.3, 22 - p.userData.life * speed * 4);
      } else {
        // Then split into channel
        const f = (p.userData.life - 1) * speed * 4;
        p.position.set(Math.sin(a) * f, 0.3, 18 - Math.cos(a) * f);
      }
      p.material.opacity = Math.max(0, 0.7 - p.userData.life * 0.2);
    });
  };
};

// ESTUARY ------------------------------------------------------------
SCENE_BUILDERS.estuary = function(root) {
  // Mixing of fresh + seawater
  const sea = createWater(80, 0x1e6cb0, 0.92, 80);  // saltwater (blue-green)
  sea.position.y = 0;
  root.add(sea);
  // Land with funnel-shaped opening
  root.add(createLand([
    [-30, -25], [30, -25], [30, 25],
    [22, 20], [14, 12], [8, 6], [4, 2],
    [2, 0], [2, -4], [2, -8], [2, -12], [2, -16], [2, -20], [2, -25]
  ], 4, 0x5a7a3a));
  root.add(createLand([
    [-30, 25], [-22, 20], [-14, 12], [-8, 6], [-4, 2],
    [-2, 0], [-2, -4], [-2, -8], [-2, -12], [-2, -16], [-2, -20], [-2, -25]
  ], 4, 0x6a8a4a));
  // Freshwater river (lighter blue)
  const riverMat = new THREE.MeshStandardMaterial({ color: 0x80c4e8, roughness: 0.3, transparent: true, opacity: 0.95 });
  const river = new THREE.Mesh(new THREE.PlaneGeometry(4, 16, 8, 16), riverMat);
  river.rotation.x = -Math.PI / 2;
  river.position.set(0, 0.1, 18);
  root.add(river);
  // Mixing zone (between river mouth and open sea)
  const mixMat = new THREE.MeshStandardMaterial({ color: 0x4ab8b0, transparent: true, opacity: 0.7, roughness: 0.3 });
  const mix = new THREE.Mesh(new THREE.PlaneGeometry(20, 10, 20, 10), mixMat);
  mix.rotation.x = -Math.PI / 2;
  mix.position.set(0, 0.05, 5);
  root.add(mix);
  // Saltwater intrusion (in green tinge)
  const swatMat = new THREE.MeshStandardMaterial({ color: 0x2a8c8c, transparent: true, opacity: 0.6, roughness: 0.3 });
  const swat = new THREE.Mesh(new THREE.PlaneGeometry(8, 6, 8, 6), swatMat);
  swat.rotation.x = -Math.PI / 2;
  swat.position.set(0, 0.08, 14);
  root.add(swat);
  // Flow direction arrows (small particles)
  const freshParticles = [];
  const saltParticles = [];
  for (let i = 0; i < 15; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0x80c4e8, transparent: true, opacity: 0.85 })
    );
    p.userData.life = Math.random() * 3;
    freshParticles.push(p);
    root.add(p);
  }
  for (let i = 0; i < 15; i++) {
    const p = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0x2a8c8c, transparent: true, opacity: 0.85 })
    );
    p.userData.life = Math.random() * 4;
    saltParticles.push(p);
    root.add(p);
  }
  root.add(createClouds(5, 50, 22));
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 80),
    new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.95 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3.5;
  floor.receiveShadow = true;
  root.add(floor);
  root.userData.updater = (dt, t) => {
    updateWater(sea, dt, 0.2, 0.35);
    // Tidal cycle: tides flow in and out
    const tideCycle = Math.sin(t * 0.6) * 0.5 + 0.5;  // 0..1, 0=low, 1=high
    // Saltwater intrusion moves up estuary on high tide
    swat.position.z = 16 - tideCycle * 6;
    swat.scale.y = 1 + tideCycle * 0.5;
    mix.position.z = 6 - tideCycle * 2;
    // Freshwater particles flow toward sea
    freshParticles.forEach(p => {
      p.userData.life += dt;
      if (p.userData.life > 3) p.userData.life = 0;
      p.position.set((Math.random()-0.5)*2, 0.3, 20 - p.userData.life * 6);
      p.material.opacity = Math.max(0, 0.85 - p.userData.life * 0.28);
    });
    // Saltwater particles flow in on high tide, out on low tide
    saltParticles.forEach(p => {
      p.userData.life += dt;
      if (p.userData.life > 4) p.userData.life = 0;
      const phase = p.userData.life / 4;
      const range = 8 + tideCycle * 4;
      p.position.set((Math.random()-0.5)*4, 0.3, 4 + (1 - phase) * range - range/2);
      p.material.opacity = Math.max(0, 0.85 - p.userData.life * 0.2);
    });
  };
};

// LAGOON -------------------------------------------------------------
SCENE_BUILDERS.lagoon = function(root) {
  // Open sea with waves outside; calm lagoon inside, separated by barrier island
  const sea = createWater(80, 0x1e6cb0, 0.92, 80);
  sea.position.y = 0;
  root.add(sea);
  // Mainland at the top
  root.add(createLand([
    [-30, 30], [30, 30], [30, 22], [-30, 22]
  ], 3, 0x5a7a3a));
  // Barrier island (long thin strip)
  root.add(createLand([
    [-25, 12], [25, 12], [25, 10], [-25, 10]
  ], 1.5, 0xead7a0));
  // Lagoon water (calmer, lighter)
  const lagoon = new THREE.Mesh(
    new THREE.PlaneGeometry(50, 8, 30, 6),
    new THREE.MeshStandardMaterial({ color: 0x4ad9c4, transparent: true, opacity: 0.88, roughness: 0.3 })
  );
  lagoon.rotation.x = -Math.PI / 2;
  lagoon.position.set(0, 0.2, 17);
  root.add(lagoon);
  // Inlet (gap in barrier island)
  // Tiny channel of lagoon water connecting to sea
  const inlet = new THREE.Mesh(
    new THREE.PlaneGeometry(2, 2),
    new THREE.MeshStandardMaterial({ color: 0x4ad9c4, transparent: true, opacity: 0.85 })
  );
  inlet.rotation.x = -Math.PI / 2;
  inlet.position.set(0, 0.2, 11);
  root.add(inlet);
  // Whitecaps on outer (sea) side
  const whitecaps = [];
  for (let i = 0; i < 14; i++) {
    const w = new THREE.Mesh(
      new THREE.SphereGeometry(0.3, 6, 4),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 })
    );
    w.userData.x = -22 + (i / 14) * 44;
    w.userData.z = 6 + Math.random() * 2;
    w.userData.phase = Math.random() * Math.PI * 2;
    whitecaps.push(w);
    root.add(w);
  }
  // Fish in lagoon
  const fishes = [];
  for (let i = 0; i < 5; i++) {
    const f = createFish([0xffd166, 0x4ec9b0, 0xff85a2][i % 3]);
    f.position.set((Math.random()-0.5)*20, 0.6, 17);
    f.userData.angle = (i / 5) * Math.PI * 2;
    f.userData.radius = 3 + Math.random() * 3;
    f.userData.cx = (Math.random()-0.5) * 10;
    f.userData.cz = 17 + (Math.random()-0.5) * 4;
    f.userData.speed = 0.4 + Math.random() * 0.3;
    fishes.push(f);
    root.add(f);
  }
  // Birds (small spheres above)
  const birds = [];
  for (let i = 0; i < 4; i++) {
    const b = new THREE.Mesh(
      new THREE.SphereGeometry(0.2, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0xfafafa })
    );
    b.userData.phase = i * 1.5;
    birds.push(b);
    root.add(b);
  }
  root.add(createClouds(5, 50, 22));
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 80),
    new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.95 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -3.5;
  floor.receiveShadow = true;
  root.add(floor);
  root.userData.updater = (dt, t) => {
    updateWater(sea, dt, 0.22, 0.4);  // bigger waves outside
    // Lagoon gentle ripple
    const lp = lagoon.geometry.attributes.position;
    if (!lagoon.userData.init) {
      lagoon.userData.init = new Float32Array(lp.array.length);
      for (let i = 0; i < lp.array.length; i++) lagoon.userData.init[i] = lp.array[i];
    }
    const li = lagoon.userData.init;
    for (let i = 0; i < lp.count; i++) {
      const x = li[i * 3];
      const y = li[i * 3 + 1];
      lp.setZ(i, Math.sin(x * 0.5 + t * 1.2) * 0.06 + Math.cos(y * 0.5 + t) * 0.05);
    }
    lp.needsUpdate = true;
    // Whitecaps on outer side
    whitecaps.forEach(w => {
      const phase = t * 2 + w.userData.phase;
      const visible = Math.sin(phase) > 0;
      w.material.opacity = visible ? 0.7 : 0;
      w.position.set(w.userData.x, 0.4 + Math.sin(phase * 1.5) * 0.2, w.userData.z);
    });
    // Fish swim in lagoon
    fishes.forEach(f => {
      f.userData.angle += dt * f.userData.speed;
      f.position.x = f.userData.cx + Math.cos(f.userData.angle) * f.userData.radius;
      f.position.z = f.userData.cz + Math.sin(f.userData.angle) * f.userData.radius;
      f.rotation.y = -f.userData.angle + Math.PI/2;
    });
    // Birds circle above
    birds.forEach(b => {
      b.userData.phase += dt * 0.4;
      b.position.set(Math.cos(b.userData.phase) * 18, 8 + Math.sin(b.userData.phase * 2) * 1, 17 + Math.sin(b.userData.phase) * 6);
    });
  };
};

// ===============================================================
//  ANIMATION LOOP
// ===============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.getElapsedTime();
  // Smooth camera rotation
  userRotation.x += (targetRotation.x - userRotation.x) * 0.1;
  userRotation.y += (targetRotation.y - userRotation.y) * 0.1;
  if (currentSceneRoot) {
    currentSceneRoot.rotation.x = userRotation.x;
    currentSceneRoot.rotation.y = userRotation.y;
  }
  // Auto-rotate
  if (isAutoRotate && !isDragging) {
    targetRotation.y += 0.003;
  }
  // Scene-specific update
  if (currentSceneRoot && currentSceneRoot.userData.updater && !isPaused) {
    currentSceneRoot.userData.updater(dt, t);
  }
  renderer.render(scene, camera);
}

document.getElementById('play-pause').addEventListener('click', (e) => {
  isPaused = !isPaused;
  e.currentTarget.innerHTML = isPaused ? '▶ Play' : '⏸ Pause';
  e.currentTarget.classList.toggle('active', isPaused);
});
document.getElementById('reset-view').addEventListener('click', () => {
  targetRotation.x = 0;
  targetRotation.y = 0;
  camera.position.set(0, 25, 45);
  camera.lookAt(0, 0, 0);
  // Re-apply scene-specific camera if defined
  if (currentTerm === 'trench' || currentTerm === 'ridge') {
    if (currentTerm === 'trench') { camera.position.set(0, 0, 70); camera.lookAt(0, -3, 0); }
    else { camera.position.set(0, 8, 60); camera.lookAt(0, 0, 0); }
  } else if (currentTerm === 'reef') {
    camera.position.set(0, 12, 30); camera.lookAt(0, -1, 0);
  } else if (currentTerm === 'atoll') {
    camera.position.set(15, 22, 25); camera.lookAt(0, 0, 0);
  }
});
document.getElementById('rotate-toggle').addEventListener('click', (e) => {
  isAutoRotate = !isAutoRotate;
  e.currentTarget.classList.toggle('active', isAutoRotate);
});
document.getElementById('2d-toggle').addEventListener('click', (e) => {
  // Toggle 2D SVG view (handled separately)
  // For brevity: just show an alert that 2D view is in a separate file
  // (the main 3D file is the primary deliverable)
  show2DFallback(currentTerm);
});

});

// ===============================================================

//  Shown when "2D View" is toggled. Each diagram is an animated SVG
//  that explains the same concept from a side or plan view.
// ===============================================================
function show2DFallback(termKey) {
  const w = window.open('', '_blank', 'width=900,height=700');
  if (!w) { alert('Please allow pop-ups to view the 2D animated side-view.'); return; }
  const svg = SVG_VIEWS[termKey];
  if (!svg) { w.document.write('<h2>No 2D view yet — 3D is the primary reference.</h2>'); return; }
  w.document.write(`
    <html><head><title>${TERMS[termKey].name} — 2D Side View</title>
    <style>body{font-family:sans-serif;background:#0a1326;color:#e2e8f0;margin:0;padding:14px;}
    h2{color:#38bdf8;margin-top:0;} .note{font-size:13px;color:#94a3b8;margin-bottom:14px;line-height:1.5;}</style>
    </head><body>
    <h2>${TERMS[termKey].name} — 2D Animated Side View</h2>
    <div class="note">${TERMS[termKey].definition}</div>
    ${svg}
    </body></html>
  `);
  w.document.close();
}
