<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Water Body Atlas — Interactive Classroom Demonstration</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0a1326; color: #e2e8f0;
    min-height: 100vh; overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  /* ====== LAYOUT (preserved from original) ====== */
  .app { display: flex; flex-direction: column; height: 100vh; }
  .app-header {
    background: #1e293b; padding: 10px 18px;
    display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid #334155; flex-shrink: 0;
  }
  .app-header h1 {
    font-size: 17px; color: #38bdf8; font-weight: 700;
    letter-spacing: -0.2px; flex-grow: 1;
  }
  .app-header .subtitle {
    font-size: 12px; color: #94a3b8; font-weight: 500;
  }
  .layout {
    display: grid; grid-template-columns: 220px 1fr 320px;
    flex-grow: 1; min-height: 0;
  }
  /* ====== SIDEBAR (preserved) ====== */
  .sidebar {
    background: #131c2f; border-right: 1px solid #1e293b;
    overflow-y: auto; padding: 12px 8px;
  }
  .sidebar-group {
    font-size: 10px; font-weight: 700; color: #64748b;
    text-transform: uppercase; letter-spacing: 1.2px;
    margin: 12px 10px 6px;
  }
  .sidebar-group:first-child { margin-top: 0; }
  .term-btn {
    display: block; width: 100%; text-align: left;
    background: transparent; color: #cbd5e1; border: none;
    padding: 9px 12px; border-radius: 7px; cursor: pointer;
    font-size: 13px; font-weight: 500;
    transition: all 0.15s ease;
    margin-bottom: 2px;
  }
  .term-btn:hover { background: #1e293b; color: #e2e8f0; }
  .term-btn.active {
    background: linear-gradient(135deg, rgba(56,189,248,0.20), rgba(56,189,248,0.06));
    color: #38bdf8; font-weight: 600;
    box-shadow: inset 2px 0 0 #38bdf8;
  }
  .term-btn .icon { display: inline-block; width: 22px; }

  /* ====== VIEWPORT ====== */
  .viewport {
    position: relative; background: #0a1326; overflow: hidden;
  }
  #three-canvas { display: block; width: 100%; height: 100%; }
  .overlay-labels {
    position: absolute; top: 14px; left: 14px;
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: none; z-index: 4;
  }
  .overlay-label {
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.5);
    color: #e2e8f0;
    padding: 6px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    backdrop-filter: blur(8px);
    animation: labelFadeIn 0.4s ease both;
  }
  .overlay-label.highlight {
    background: rgba(251, 191, 36, 0.95);
    color: #0a1326; border-color: #fbbf24;
    font-size: 14px; font-weight: 700;
    box-shadow: 0 0 16px rgba(251,191,36,0.6);
  }
  @keyframes labelFadeIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .legend {
    position: absolute; top: 14px; right: 14px;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid #334155;
    border-radius: 8px; padding: 8px 12px;
    backdrop-filter: blur(8px); z-index: 4;
    font-size: 11px;
  }
  .legend .legend-title {
    font-size: 10px; color: #64748b; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 4px; font-weight: 700;
  }
  .legend-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .legend-swatch { width: 14px; height: 8px; border-radius: 2px; }
  .loading {
    position: absolute; inset: 0;
    background: #0a1326; display: flex;
    align-items: center; justify-content: center;
    color: #64748b; gap: 12px; z-index: 10;
  }
  .spinner {
    width: 22px; height: 22px;
    border: 2px solid #334155; border-top-color: #38bdf8;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ====== CONTROLS (extended with Teach Me + step scrubber) ====== */
  .controls {
    position: absolute; bottom: 14px; left: 14px; right: 14px;
    background: rgba(15, 23, 42, 0.88);
    border: 1px solid #334155;
    border-radius: 10px; padding: 8px 12px;
    display: flex; align-items: center; gap: 8px;
    backdrop-filter: blur(8px); z-index: 5;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    background: #1e293b; color: #e2e8f0; border: 1px solid #334155;
    padding: 7px 12px; border-radius: 6px; cursor: pointer;
    font-size: 12px; font-weight: 600;
    transition: all 0.15s ease; white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .ctrl-btn:hover { background: #334155; border-color: #475569; }
  .ctrl-btn:active { transform: scale(0.97); }
  .ctrl-btn.primary {
    background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    color: #0a1326; border-color: #fbbf24;
    box-shadow: 0 2px 8px rgba(251,191,36,0.4);
  }
  .ctrl-btn.primary:hover {
    filter: brightness(1.10);
    box-shadow: 0 4px 12px rgba(251,191,36,0.55);
  }
  .ctrl-btn.teach-me.active {
    background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
    color: #0a1326; border-color: #34d399;
    box-shadow: 0 0 16px rgba(52,211,153,0.55);
  }
  .step-scrubber {
    flex: 1 1 200px; min-width: 120px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .step-scrubber-label {
    font-size: 10px; color: #94a3b8; font-weight: 600;
    display: flex; justify-content: space-between;
  }
  .step-scrubber-label .step-name { color: #38bdf8; }
  .step-progress {
    -webkit-appearance: none; appearance: none;
    height: 6px; background: #1e293b; border-radius: 3px;
    outline: none; cursor: pointer;
  }
  .step-progress::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #38bdf8; border: 2px solid #0a1326;
    cursor: pointer;
  }
  .step-progress::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #38bdf8; border: 2px solid #0a1326;
    cursor: pointer;
  }
  .hint {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid #334155;
    border-radius: 16px; padding: 4px 12px;
    font-size: 10px; color: #94a3b8;
    backdrop-filter: blur(8px); z-index: 5;
    pointer-events: none;
  }
  .hint kbd {
    background: #334155; padding: 1px 5px;
    border-radius: 3px; font-size: 10px;
    color: #cbd5e1; font-family: monospace;
  }
  .narration {
    position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid #fbbf24; border-left-width: 3px;
    color: #fbbf24; font-weight: 600;
    border-radius: 8px; padding: 8px 14px;
    font-size: 13px; max-width: 80%;
    text-align: center;
    backdrop-filter: blur(8px); z-index: 5;
    pointer-events: none;
    opacity: 0; transition: opacity 0.3s ease;
  }
  .narration.show { opacity: 1; }

  /* ====== COMPARISON OVERLAY ====== */
  .compare-overlay {
    position: absolute; inset: 0;
    display: none; z-index: 6;
    pointer-events: none;
  }
  .compare-overlay.show { display: flex; }
  .compare-half {
    flex: 1; padding: 20px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
  }
  .compare-half.left  { background: rgba(56,189,248,0.06); border-right: 1px dashed #475569; }
  .compare-half.right { background: rgba(244,114,182,0.06); }
  .compare-label {
    background: rgba(15,23,42,0.92);
    color: #e2e8f0; font-size: 14px; font-weight: 700;
    padding: 6px 14px; border-radius: 6px;
    border: 1px solid #475569;
  }
  .compare-half.left .compare-label  { border-color: #38bdf8; color: #38bdf8; }
  .compare-half.right .compare-label { border-color: #f472b6; color: #f472b6; }
  .compare-svg { width: 100%; max-width: 360px; }

  /* ====== INFO PANEL (preserved + extended) ====== */
  .info-panel {
    background: #131c2f; border-left: 1px solid #1e293b;
    overflow-y: auto; padding: 18px;
  }
  .info-panel h2 {
    font-size: 18px; color: #38bdf8; font-weight: 700;
    margin-bottom: 4px;
  }
  .info-panel .pronounce {
    font-size: 11px; color: #64748b; font-style: italic;
    margin-bottom: 14px;
  }
  .info-panel .definition {
    font-size: 13px; line-height: 1.6; color: #cbd5e1;
    margin-bottom: 14px;
  }
  .info-panel .section-title {
    font-size: 11px; color: #fbbf24; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    margin: 14px 0 6px;
  }
  .info-panel .example {
    font-size: 12px; line-height: 1.55; color: #cbd5e1;
    background: rgba(56,189,248,0.06);
    border-left: 3px solid #38bdf8;
    padding: 8px 12px; border-radius: 6px;
    margin-bottom: 14px;
  }
  .info-panel .example strong { color: #fbbf24; }
  .info-panel .activity {
    font-size: 12px; line-height: 1.55; color: #cbd5e1;
    background: rgba(167,139,250,0.06);
    border-left: 3px solid #a78bfa;
    padding: 8px 12px; border-radius: 6px;
  }
  .info-panel .activity-label {
    font-size: 10px; color: #a78bfa; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px;
    display: block; margin-bottom: 4px;
  }
  .info-panel .compare-table {
    width: 100%; border-collapse: collapse;
    font-size: 11px; margin-top: 8px;
  }
  .info-panel .compare-table th,
  .info-panel .compare-table td {
    border: 1px solid #1e293b; padding: 6px 8px; text-align: left;
  }
  .info-panel .compare-table th {
    background: #1e293b; color: #38bdf8; font-weight: 700;
  }
  .info-panel .compare-table tr:nth-child(even) td {
    background: rgba(30,41,59,0.4);
  }
  /* Real-world mini map */
  .mini-map {
    background: #0a1326; border: 1px solid #334155;
    border-radius: 8px; padding: 10px; margin-top: 8px;
  }
  .mini-map svg { width: 100%; height: auto; display: block; }
  .mini-map-title {
    font-size: 10px; color: #94a3b8; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 6px;
  }
  .teaching-steps-list {
    margin-top: 14px;
    font-size: 11px;
  }
  .teaching-step {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 5px;
    margin-bottom: 2px;
    color: #64748b;
    transition: all 0.2s ease;
  }
  .teaching-step .step-num {
    width: 18px; height: 18px; border-radius: 50%;
    background: #1e293b; color: #64748b;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; flex-shrink: 0;
  }
  .teaching-step.done { color: #94a3b8; }
  .teaching-step.done .step-num { background: #1e293b; color: #38bdf8; }
  .teaching-step.active {
    background: rgba(56,189,248,0.15); color: #38bdf8; font-weight: 600;
  }
  .teaching-step.active .step-num {
    background: #38bdf8; color: #0a1326;
    box-shadow: 0 0 8px rgba(56,189,248,0.6);
  }

  /* ====== RESPONSIVE ====== */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
    .sidebar { max-height: 130px; border-right: none; border-bottom: 1px solid #1e293b;
               display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; }
    .sidebar-group { width: 100%; margin: 4px 4px 2px; }
    .term-btn { display: inline-block; width: auto; padding: 6px 10px; font-size: 12px; }
    .info-panel { max-height: 40vh; }
    .hint { display: none; }
    .controls { padding: 6px 8px; gap: 4px; }
    .ctrl-btn { padding: 6px 8px; font-size: 11px; }
    .step-scrubber { flex: 1 1 100%; order: 99; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <h1>🌊 Water Body Atlas — Interactive Classroom Demonstration</h1>
    <span class="subtitle">Geography · Grade 8 · Press "Teach Me" for a guided animation</span>
  </header>

  <div class="layout">
    <!-- SIDEBAR (preserved) -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-group">Coastal Inlets</div>
      <button class="term-btn active" data-term="sea"><span class="icon">🌊</span>Sea</button>
      <button class="term-btn" data-term="gulf"><span class="icon">🐃</span>Gulf</button>
      <button class="term-btn" data-term="bay"><span class="icon">🌅</span>Bay</button>
      <button class="term-btn" data-term="strait"><span class="icon">🚢</span>Strait</button>
      <button class="term-btn" data-term="canal"><span class="icon">⚙️</span>Canal</button>
      <div class="sidebar-group">Ocean Floor</div>
      <button class="term-btn" data-term="trench"><span class="icon">⬇️</span>Trench</button>
      <button class="term-btn" data-term="ridge"><span class="icon">⛰️</span>Ridge</button>
      <button class="term-btn" data-term="reef"><span class="icon">🪸</span>Reef</button>
      <button class="term-btn" data-term="atoll"><span class="icon">⭕</span>Atoll</button>
      <div class="sidebar-group">Land–Water</div>
      <button class="term-btn" data-term="isthmus"><span class="icon">🍄</span>Isthmus</button>
      <button class="term-btn" data-term="peninsula"><span class="icon">🗺️</span>Peninsula</button>
      <button class="term-btn" data-term="cape"><span class="icon">📍</span>Cape</button>
      <button class="term-btn" data-term="delta"><span class="icon">🔱</span>Delta</button>
      <button class="term-btn" data-term="estuary"><span class="icon">🍵</span>Estuary</button>
      <button class="term-btn" data-term="lagoon"><span class="icon">🏝️</span>Lagoon</button>
    </aside>

    <!-- VIEWPORT -->
    <main class="viewport" id="viewport">
      <canvas id="three-canvas"></canvas>
      <div class="overlay-labels" id="overlay-labels"></div>
      <div class="legend" id="legend"></div>
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <span>Loading 3D scene…</span>
      </div>
      <div class="hint">
        <kbd>drag</kbd> rotate · <kbd>scroll</kbd> zoom · <kbd>right-drag</kbd> pan
      </div>
      <div class="narration" id="narration"></div>
      <div class="compare-overlay" id="compare-overlay">
        <div class="compare-half left">
          <div class="compare-label" id="compare-left-label"></div>
          <svg class="compare-svg" id="compare-left-svg" viewBox="0 0 300 220"></svg>
        </div>
        <div class="compare-half right">
          <div class="compare-label" id="compare-right-label"></div>
          <svg class="compare-svg" id="compare-right-svg" viewBox="0 0 300 220"></svg>
        </div>
      </div>
      <div class="controls">
        <button class="ctrl-btn primary teach-me" id="teach-me-btn" title="Automatically step through the animation with camera + labels">🎓 Teach Me</button>
        <button class="ctrl-btn" id="play-pause" title="Play / pause animation">⏸ Pause</button>
        <button class="ctrl-btn" id="replay-btn" title="Restart from step 1">↻ Replay</button>
        <button class="ctrl-btn" id="reset-view" title="Reset camera">⟲ Reset View</button>
        <button class="ctrl-btn" id="next-step-btn" title="Advance to next teaching step">⏭ Step</button>
        <div class="step-scrubber">
          <div class="step-scrubber-label">
            <span>Teaching Steps</span>
            <span class="step-name" id="step-name">Step 1</span>
          </div>
          <input type="range" class="step-progress" id="step-progress" min="0" max="100" value="0" step="0.1">
        </div>
      </div>
    </main>

    <!-- INFO PANEL -->
    <aside class="info-panel" id="info-panel">
      <!-- Filled by JS -->
    </aside>
  </div>
</div>

<!-- Three.js from CDN (free, MIT-licensed) — r128 is widely available -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===============================================================
//  WATER BODY ATLAS — INTERACTIVE CLASSROOM DEMONSTRATION
//  Redesigned for Class 8 students.
//
//  Core idea: every term has a TIMELINE of teaching steps. Each step:
//    - reveals / highlights / moves objects in the 3D scene
//    - shows a short narration label
//    - may move the camera
//    - may show a side-by-side SVG comparison
//
//  The user can press "Teach Me" for a fully automated walkthrough,
//  or scrub through the steps manually with the slider.
// ===============================================================

// Defensive shim — CapsuleGeometry was added in r130, r128 doesn't have it.
if (!THREE.CapsuleGeometry) {
  THREE.CapsuleGeometry = function(radius, length, capSegments, radialSegments) {
    radius = radius || 1; length = length || 1;
    capSegments = capSegments || 4; radialSegments = radialSegments || 8;
    const geo = new THREE.CylinderGeometry(radius, radius, length, radialSegments);
    const topCap = new THREE.SphereGeometry(radius, radialSegments, capSegments, 0, Math.PI*2, 0, Math.PI/2);
    topCap.translate(0, length/2, 0);
    const botCap = new THREE.SphereGeometry(radius, radialSegments, capSegments, 0, Math.PI*2, Math.PI/2, Math.PI/2);
    botCap.translate(0, -length/2, 0);
    geo.merge(topCap); geo.merge(botCap);
    return geo;
  };
}

// ---------- DATA: term definitions + real-world example mini-maps ----------
const TERMS = {

    compareTitle: "Strait vs Isthmus",
    compare: [
      ["", "Strait", "Isthmus"],
      ["Type", "Water passage", "Land strip"],
      ["Connects", "Two water bodies", "Two land bodies"],
      ["Separates", "Two landmasses", "Two water bodies"]
    ]
  },
  canal: {
    name: "Canal", pronounce: "/kəˈnæl/", icon: "⚙️",

  },
  trench: {

    definition: "A long, narrow, very DEEP V-shaped depression in the ocean floor — the deepest places on Earth.",
    example: "<strong>Mariana Trench</strong> in the western Pacific — its deepest point, the Challenger Deep, is over 11,000 m below sea level — about 2,000 m deeper than Mount Everest is tall.",
    compareTitle: "Trench vs Ridge",
    compare: [
      ["", "Trench", "Ridge"],
      ["Shape", "V-shape, deep", "Mountain chain"],
      ["Motion", "Plate sinks", "Plates pull apart"],
      ["Feature", "Deepest point", "Longest mountain"]
    ]
  },
  ridge: {
    name: "Ridge", pronounce: "/rɪdʒ/", icon: "⛰️",
    definition: "A long underwater mountain chain formed where tectonic plates pull apart, with new crust being created.",
    example: "<strong>Mid-Atlantic Ridge</strong> — the longest mountain range on Earth, about 65,000 km long, running down the middle of the Atlantic Ocean.",
    compareTitle: "Ridge vs Trench",
    compare: [
      ["", "Ridge", "Trench"],
      ["Shape", "Mountain chain", "V-shape valley"],
      ["Motion", "Plates pull apart", "Plate sinks below"],
      ["Feature", "Longest mountains", "Deepest points"]
    ]
  },
  reef: {
    name: "Reef", pronounce: "/riːf/", icon: "🪸",
    definition: "A ridge of rocks, sand, or coral rising up near the water's surface. Coral reefs are built by tiny sea animals.",
    example: "<strong>Great Barrier Reef</strong> (Australia) — the largest coral reef system in the world, over 2,300 km long, visible from space.",
    compareTitle: "Reef vs Atoll",
    compare: [
      ["", "Reef", "Atoll"],
      ["Shape", "Any ridge of coral/rock", "Ring-shaped coral"],

// ===============================================================
//  ENGINE — Three.js setup, camera, controls, render loop
//  (Appended to the HTML file)
// ===============================================================
const canvas = document.getElementById('three-canvas');
const viewport = document.getElementById('viewport');
const overlayLabels = document.getElementById('overlay-labels');
const legendEl = document.getElementById('legend');
const infoPanel = document.getElementById('info-panel');
const loadingEl = document.getElementById('loading');
const narrationEl = document.getElementById('narration');
const compareOverlay = document.getElementById('compare-overlay');
const compareLeftLabel = document.getElementById('compare-left-label');
const compareRightLabel = document.getElementById('compare-right-label');
const compareLeftSVG = document.getElementById('compare-left-svg');
const compareRightSVG = document.getElementById('compare-right-svg');
const stepNameEl = document.getElementById('step-name');
const stepProgressEl = document.getElementById('step-progress');
const teachMeBtn = document.getElementById('teach-me-btn');
const playPauseBtn = document.getElementById('play-pause');
const replayBtn = document.getElementById('replay-btn');
const resetViewBtn = document.getElementById('reset-view');
const nextStepBtn = document.getElementById('next-step-btn');

let renderer, scene, camera;
let currentTerm = 'sea';
let currentSceneRoot = null;
let currentTermController = null;
let isPaused = false;
let isTeachMe = false;
let teachProgress = 0;
let clock;
let userRotation = { x: 0, y: 0 };
let targetRotation = { x: 0, y: 0 };
let cameraOverride = null;

function initEngine() {
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x0a1326, 1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0a1326, 60, 220);
    camera = new THREE.PerspectiveCamera(50, 1, 0.1, 1000);
    camera.position.set(0, 25, 45);
    camera.lookAt(0, 0, 0);
    clock = new THREE.Clock();
    const ambient = new THREE.AmbientLight(0xffffff, 0.55);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 0.85);
    sun.position.set(20, 40, 25);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
    sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
    sun.shadow.camera.near = 1; sun.shadow.camera.far = 200;
    sun.shadow.bias = -0.0005;
    scene.add(sun);
    const fill = new THREE.DirectionalLight(0x88bbff, 0.18);
    fill.position.set(-15, -8, -20);
    scene.add(fill);
    resize();
    window.addEventListener('resize', resize);
    setupCameraControls();
    setupTeachingControls();
    loadTerm(currentTerm);
    animate();
    setTimeout(() => { loadingEl.style.display = 'none'; }, 300);
  } catch (e) {
    console.error('Engine init failed:', e);
    loadingEl.innerHTML = '<div style="color:#fbbf24">⚠ 3D engine failed to start: ' + e.message + '</div>';
  }
}

function resize() {
  const w = viewport.clientWidth;
  const h = viewport.clientHeight;
  if (!renderer || !camera) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}

function setupCameraControls() {
  canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) { isDragging = true; lastMouse = { x: e.clientX, y: e.clientY }; cameraOverride = null; }
    if (e.button === 2) { isPanning = true; lastMouse = { x: e.clientX, y: e.clientY }; }
  });
  window.addEventListener('mouseup', () => { isDragging = false; isPanning = false; });
  window.addEventListener('mousemove', (e) => {
    if (isDragging) {
      const dx = (e.clientX - lastMouse.x) * 0.005;
      const dy = (e.clientY - lastMouse.y) * 0.005;
      targetRotation.y += dx;
      targetRotation.x = Math.max(-1.2, Math.min(1.2, targetRotation.x + dy));
      lastMouse = { x: e.clientX, y: e.clientY };
    } else if (isPanning) {
      const dx = (e.clientX - lastMouse.x) * 0.05;
      const dy = (e.clientY - lastMouse.y) * 0.05;
      camera.position.x -= dx;
      camera.position.y += dy;
      lastMouse = { x: e.clientX, y: e.clientY };
    }
  });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const scale = e.deltaY > 0 ? 1.1 : 0.9;
    const dist = camera.position.length();
    const newDist = Math.max(8, Math.min(120, dist * scale));
    camera.position.normalize().multiplyScalar(newDist);
    cameraOverride = null;
  }, { passive: false });
  let lastTouch = null, lastPinch = null;
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      isDragging = true; cameraOverride = null;
    } else if (e.touches.length === 2) {
      isDragging = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      lastPinch = Math.hypot(dx, dy);
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && isDragging && lastTouch) {
      e.preventDefault();
      const dx = (e.touches[0].clientX - lastTouch.x) * 0.005;
      const dy = (e.touches[0].clientY - lastTouch.y) * 0.005;
      targetRotation.y += dx;
      targetRotation.x = Math.max(-1.2, Math.min(1.2, targetRotation.x + dy));
      lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else if (e.touches.length === 2 && lastPinch != null) {
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      const scale = lastPinch / d;
      const dist = camera.position.length();
      const newDist = Math.max(8, Math.min(120, dist * scale));
      camera.position.normalize().multiplyScalar(newDist);
      lastPinch = d;
    }
  }, { passive: false });
  canvas.addEventListener('touchend', () => { isDragging = false; lastTouch = null; lastPinch = null; });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
}

function setupTeachingControls() {
  teachMeBtn.addEventListener('click', () => {
    isTeachMe = !isTeachMe;
    if (isTeachMe) {
      teachMeBtn.classList.add('active');
      teachMeBtn.innerHTML = '⏸ Stop Teaching';
      teachProgress = 0;
      isPaused = false;
      playPauseBtn.innerHTML = '⏸ Pause';
      cameraOverride = null;
    } else {
      teachMeBtn.classList.remove('active');
      teachMeBtn.innerHTML = '🎓 Teach Me';
    }
  });
  playPauseBtn.addEventListener('click', () => {
    isPaused = !isPaused;
    playPauseBtn.innerHTML = isPaused ? '▶ Play' : '⏸ Pause';
  });
  replayBtn.addEventListener('click', () => {
    teachProgress = 0;
    isPaused = false;
    playPauseBtn.innerHTML = '⏸ Pause';
    if (currentTermController) currentTermController.reset();
  });
  resetViewBtn.addEventListener('click', () => {
    cameraOverride = null;
    camera.position.set(0, 25, 45);
    camera.lookAt(0, 0, 0);
    userRotation = { x: 0, y: 0 };
    targetRotation = { x: 0, y: 0 };
  });
  nextStepBtn.addEventListener('click', () => {
    if (!currentTermController) return;
    const steps = currentTermController.steps;
    for (let i = 0; i < steps.length; i++) {
      if (teachProgress < steps[i].t) {
        teachProgress = steps[i].t;
        return;
      }
    }
    teachProgress = 0;
  });
  stepProgressEl.addEventListener('input', (e) => {
    if (!currentTermController) return;
    const v = parseFloat(e.target.value);
    teachProgress = (v / 100) * currentTermController.totalDuration;
    if (currentTermController.update) currentTermController.update(teachProgress);
  });
}

function loadTerm(termKey) {
  if (!TERMS[termKey]) return;
  currentTerm = termKey;
  isTeachMe = false;
  teachMeBtn.classList.remove('active');
  teachMeBtn.innerHTML = '🎓 Teach Me';
  document.querySelectorAll('.term-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.term === termKey);
  });
  if (currentSceneRoot) {
    scene.remove(currentSceneRoot);
    disposeHierarchy(currentSceneRoot);
    currentSceneRoot = null;
  }
  currentTermController = null;
  teachProgress = 0;
  isPaused = false;
  playPauseBtn.innerHTML = '⏸ Pause';
  camera.position.set(0, 25, 45);
  camera.lookAt(0, 0, 0);
  userRotation = { x: 0, y: 0 };
  targetRotation = { x: 0, y: 0 };
  cameraOverride = null;
  compareOverlay.classList.remove('show');
  const controllerFactory = SCENE_CONTROLLERS[termKey];
  if (!controllerFactory) return;
  currentSceneRoot = new THREE.Group();
  scene.add(currentSceneRoot);
  try {
    currentTermController = controllerFactory(currentSceneRoot);
    if (currentTermController && currentTermController.build) {
      currentTermController.build();
    }
  } catch (e) {
    console.error('Failed to build scene for', termKey, e);
  }
  renderInfoPanel(termKey);
  renderLegend(termKey);
  if (currentTermController && currentTermController.totalDuration) {
    stepProgressEl.max = 100;
    stepProgressEl.value = 0;
  }
}

function disposeHierarchy(root) {
  root.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
      else obj.material.dispose();
    }
  });
}

function renderInfoPanel(termKey) {

  let html = `
    <h2>${t.icon} ${t.name}</h2>
    <div class="pronounce">pronunciation: ${t.pronounce}</div>
    <div class="definition">${t.definition}</div>
    <div class="section-title">📍 Real Example</div>
    <div class="example">${t.example}</div>
    <div class="section-title">🗺️ On the World Map</div>
    <div class="mini-map" id="mini-map-container">
      <div class="mini-map-title">Tap "Teach Me" or scrub the timeline to see the animation. The mini-map highlights where this feature is found.</div>
      ${getMiniMapSVG(termKey)}
    </div>
  `;
  if (t.compare) {
    html += `<div class="section-title">⚖️ ${t.compareTitle || 'Compare'}</div>`;
    html += '<table class="compare-table">';
    t.compare.forEach((row, i) => {
      html += '<tr>';
      row.forEach((cell, j) => {
        html += i === 0
          ? `<th>${cell}</th>`
          : `<td${j === 0 ? ' style="color:#94a3b8;font-weight:600"' : ''}>${cell}</td>`;
      });
      html += '</tr>';
    });
    html += '</table>';
  }
  html += `<div class="section-title">🎓 Teaching Steps</div>
           <div class="teaching-steps-list" id="steps-list"></div>`;
  infoPanel.innerHTML = html;
  updateStepsList();
}

function updateStepsList() {
  const list = document.getElementById('steps-list');
  if (!list || !currentTermController) return;
  const steps = currentTermController.steps || [];
  let html = '';
  steps.forEach((s, i) => {
    let cls = 'teaching-step';
    if (teachProgress >= s.t) cls += ' done';
    const nextT = (i + 1 < steps.length) ? steps[i + 1].t : currentTermController.totalDuration;
    if (teachProgress >= s.t && teachProgress < nextT) cls = 'teaching-step active';
    html += `<div class="${cls}"><span class="step-num">${i + 1}</span><span>${s.label}</span></div>`;
  });
  list.innerHTML = html;
}

function createWater(size, color, opacity = 0.85, segments = 64) {
  const geo = new THREE.PlaneGeometry(size, size, segments, segments);
  const mat = new THREE.MeshStandardMaterial({
    color: color, transparent: opacity < 1, opacity: opacity,
    roughness: 0.4, metalness: 0.2, side: THREE.DoubleSide, flatShading: false
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.receiveShadow = true;
  const positions = geo.attributes.position;
  const initial = new Float32Array(positions.array.length);
  for (let i = 0; i < positions.array.length; i++) initial[i] = positions.array[i];
  mesh.userData.initial = initial;
  mesh.userData.isWater = true;
  return mesh;
}
function updateWater(mesh, dt, amp = 0.25, freq = 0.4) {
  if (!mesh.userData.initial) return;
  const positions = mesh.geometry.attributes.position;
  const initial = mesh.userData.initial;
  const t = performance.now() * 0.001;
  for (let i = 0; i < positions.count; i++) {
    const x = initial[i * 3];
    const y = initial[i * 3 + 1];
    const z = Math.sin(x * freq + t * 1.2) * amp + Math.cos(y * freq * 1.3 + t) * amp * 0.6;
    positions.setZ(i, z);
  }
  positions.needsUpdate = true;
}
function createLand(shapePoints, height = 3, color = 0x5a7a3a) {
  const shape = new THREE.Shape();
  shape.moveTo(shapePoints[0][0], shapePoints[0][1]);
  for (let i = 1; i < shapePoints.length; i++) shape.lineTo(shapePoints[i][0], shapePoints[i][1]);
  shape.closePath();
  const geo = new THREE.ExtrudeGeometry(shape, { depth: height, bevelEnabled: true, bevelThickness: 0.4, bevelSize: 0.4, bevelSegments: 2 });
  const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.85, metalness: 0.05 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}
function createShip(scale = 1, color = 0xc04545) {
  const grp = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 0.5),

  grp.add(hull);
  const deck = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.35, 0.35),

  grp.add(deck);
  const smoke = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 6),
    new THREE.MeshBasicMaterial({ color: 0xe2e8f0, transparent: true, opacity: 0.6 }));

  smoke.userData.isSmoke = true;
  smoke.userData.life = 0;
  grp.add(smoke);
  grp.scale.setScalar(scale);
  return grp;
}
function createClouds(count = 5, area = 30, y = 18) {
  const grp = new THREE.Group();
  for (let i = 0; i < count; i++) {
    const cloud = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, roughness: 0.9, transparent: true, opacity: 0.85 });
    for (let j = 0; j < 3; j++) {
      const r = 1.4 + Math.random() * 0.7;
      const sp = new THREE.Mesh(new THREE.SphereGeometry(r, 8, 6), mat);
      sp.position.set(j * 1.4 - 1.4, Math.random() * 0.3, (Math.random() - 0.5) * 0.6);
      cloud.add(sp);
    }
    cloud.position.set((Math.random() - 0.5) * area, y + Math.random() * 2, (Math.random() - 0.5) * area);
    cloud.scale.setScalar(0.7 + Math.random() * 0.6);
    grp.add(cloud);
  }
  return grp;
}

function smoothAt(t, t0, t1, v0, v1) {
  if (t <= t0) return v0;
  if (t >= t1) return v1;
  const u = (t - t0) / (t1 - t0);
  const s = u * u * (3 - 2 * u);
  return v0 + (v1 - v0) * s;
}

function setOpacity(obj, opacity) {
  obj.traverse(o => {
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => { m.transparent = true; m.opacity = opacity; });
      else { o.material.transparent = true; o.material.opacity = opacity; }
    }
  });
}
function setVisible(obj, visible) { obj.visible = visible; }

// Create a glowing arrow pointing at a location (used as visual highlight)
function createHighlightArrow(from, to, color = 0xfbbf24) {
  const grp = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(to, from);
  const len = dir.length();
  if (len < 0.1) return grp;
  // Shaft
  const shaftGeo = new THREE.CylinderGeometry(0.08, 0.08, len, 8);
  const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.9 });
  const shaft = new THREE.Mesh(shaftGeo, mat);
  shaft.position.copy(new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5));
  shaft.lookAt(to);
  shaft.rotateX(Math.PI / 2);
  grp.add(shaft);
  // Arrowhead
  const headGeo = new THREE.ConeGeometry(0.25, 0.6, 8);
  const head = new THREE.Mesh(headGeo, mat);
  head.position.copy(to);
  head.lookAt(to.clone().add(dir));
  head.rotateX(Math.PI / 2);
  head.position.copy(to.clone().sub(dir.clone().normalize().multiplyScalar(0.3)));
  head.lookAt(to);
  head.rotateX(-Math.PI / 2);
  grp.add(head);
  grp.userData.isHighlight = true;
  return grp;
}

// Create a 3D floating text label using a CanvasTexture sprite
function createTextLabel(text, color = '#fbbf24', size = 64) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.font = `bold ${size}px 'Segoe UI', sans-serif`;
  const w = ctx.measureText(text).width;
  canvas.width = w + 24; canvas.height = size + 12;
  ctx.font = `bold ${size}px 'Segoe UI', sans-serif`;
  ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = color; ctx.lineWidth = 4;
  ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 12, canvas.height / 2 + 1);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(canvas.width / 80, canvas.height / 80, 1);
  sprite.userData.isLabel = true;
  return sprite;
}

    coast = createLand(coastPoints, 4, 0x5a7a3a);
    setOpacity(coast, 0);
    root.add(coast);

    ship = createShip(0.9, 0xb03030);
    ship.position.set(-15, 0.7, -5);
    setOpacity(ship, 0);
    root.add(ship);
    ship2 = createShip(0.6, 0x3050b0);
    ship2.position.set(15, 0.7, 8);
    setOpacity(ship2, 0);
    root.add(ship2);
    // Clouds
    clouds = createClouds(6, 60, 22);
    setOpacity(clouds, 0);
    root.add(clouds);
    // Sea floor
    floor = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.95 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -3.5;
    floor.receiveShadow = true;
    root.add(floor);
    update(0);
  }

  function update(t) {
    // Always animate water + ship
    updateWater(sea, 0, 0.2, 0.35);
    // Ship always moves once visible
    const cycle = (t * 0.5) % (Math.PI * 2);
    ship.position.x = -15 + ((t * 1.5) % 35);
    ship.position.z = -5 + Math.sin(t * 0.3) * 2;
    ship.rotation.y = Math.sin(t * 0.3) * 0.15;
    ship2.position.x = 15 - ((t * 1.2) % 35);
    ship2.position.z = 8 + Math.cos(t * 0.25) * 2;
    ship2.rotation.y = Math.PI + Math.sin(t * 0.25) * 0.15;

    // Step 1 (0-2s): Just the sea
    // Step 2 (2-4s): Show that sea connects to the wider ocean (camera pulls back)
    // Step 3 (4-6s): Show the land coast — partly enclosing
    const coastOpacity = smoothAt(t, 4, 5.5, 0, 1);
    setOpacity(coast, coastOpacity);
    const cloudOpacity = smoothAt(t, 4.5, 6, 0, 0.85);
    setOpacity(clouds, cloudOpacity);
    // Step 4 (6-8s): Ships appear and sail
    const shipOpacity = smoothAt(t, 6, 7, 0, 1);
    setOpacity(ship, shipOpacity);
    setOpacity(ship2, shipOpacity);

    // Overlay labels

    if (t >= 4 && t < 6) labels.push({ text: 'Partly enclosed by land' });
    if (t >= 6 && t < 8) labels.push({ text: 'Ships sail across the open sea' });

    if (t >= 0 && t < 2) showNarration('🌊 The sea — a large body of saltwater connected to the ocean.');

    else if (t >= 6 && t < 8) showNarration('Ships sail across the sea, carrying goods between ports.');
    else if (t >= 8) showNarration('Compare: SEAS are smaller and partly enclosed. OCEANS are the largest and most open.');
    else showNarration(null);

    // Comparison overlay (step 5+)
    if (t >= 8) {
      showComparison('SEA', seaVsOceanSVG('sea'), 'OCEAN', seaVsOceanSVG('ocean'));
    } else {
      hideComparison();
    }

    if (isTeachMe) {
      let cam;
      if (t < 2) cam = tweenCamera(t, 0, 2, new THREE.Vector3(0, 25, 45), new THREE.Vector3(0, 18, 38), new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0));
      else if (t < 4) cam = tweenCamera(t, 2, 4, new THREE.Vector3(0, 18, 38), new THREE.Vector3(0, 30, 55), new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0));

      else cam = { pos: new THREE.Vector3(0, 25, 45), lookAt: new THREE.Vector3(0, 0, 0) };
      cameraOverride = cam;

  }

  function reset() { update(0); }

  return { build, update, reset, steps, totalDuration };
};

SCENE_CONTROLLERS.canal = function(root) {
  let sea1, sea2, land, ship, lockGate1, lockGate2, clouds, floor, canalLabel, digArrow;
  const steps = [
    { t: 0,  label: 'A landmass separates two seas' },
    { t: 2,  label: 'Humans DIG a channel through the land' },
    { t: 4,  label: 'Lock gates control water levels' },
    { t: 6,  label: 'A ship rises through the locks' },
    { t: 8,  label: 'Label: CANAL (man-made)' },
    { t: 10, label: 'Compare: Canal vs Strait' }
  ];
  const totalDuration = 12;

  function build() {
    sea1 = createWater(80, 0x1e6cb0, 0.92, 80);
    sea1.position.y = 0;
    root.add(sea1);
    // Land with a straight channel cut through it
    const coastPoints = [
      [-30, 30], [30, 30], [30, 8],
      [-5, 8], [-5, -8],  // straight channel cut
      [30, -8], [30, -30], [-30, -30],
      [-30, -8], [5, -8], [5, 8],  // straight channel cut (other side)
      [-30, 8]
    ];
    land = createLand(coastPoints, 4, 0x5a7a3a);
    setOpacity(land, 0);
    root.add(land);
    // Ship in the canal
    ship = createShip(0.6, 0xb03030);
    ship.position.set(0, 0.7, 0);
    setOpacity(ship, 0);
    root.add(ship);
    // Lock gates (two rectangular barriers)
    lockGate1 = new THREE.Mesh(
      new THREE.BoxGeometry(2, 3, 0.3),
      new THREE.MeshStandardMaterial({ color: 0x969696, roughness: 0.7 })
    );
    lockGate1.position.set(-3, 1.5, 0);
    lockGate1.rotation.y = Math.PI / 2;
    setOpacity(lockGate1, 0);
    root.add(lockGate1);
    lockGate2 = new THREE.Mesh(
      new THREE.BoxGeometry(2, 3, 0.3),
      new THREE.MeshStandardMaterial({ color: 0x969696, roughness: 0.7 })
    );
    lockGate2.position.set(3, 1.5, 0);
    lockGate2.rotation.y = Math.PI / 2;
    setOpacity(lockGate2, 0);
    root.add(lockGate2);
    clouds = createClouds(5, 50, 22);
    setOpacity(clouds, 0);
    root.add(clouds);
    floor = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.95 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -3.5;
    floor.receiveShadow = true;
    root.add(floor);
    canalLabel = createTextLabel('CANAL', '#fbbf24', 80);
    canalLabel.position.set(0, 5, 0);
    setOpacity(canalLabel, 0);
    root.add(canalLabel);
    // Dig arrow (shows digging action)
    digArrow = createHighlightArrow(
      new THREE.Vector3(0, 5, 0),
      new THREE.Vector3(0, 0.5, 0),
      0xfbbf24
    );
    setOpacity(digArrow, 0);
    root.add(digArrow);
    update(0);
  }

  function update(t) {
    updateWater(sea1, 0, 0.2, 0.35);
    // Ship moves through the canal
    const cycle = (t * 1.0) % 16;
    if (cycle < 4) {
      ship.position.x = -8 + cycle * 2;
      ship.position.y = 0.7;
    } else if (cycle < 8) {
      // Rising in the lock
      ship.position.x = 0;
      ship.position.y = 0.7 + (cycle - 4) * 0.4;
    } else if (cycle < 12) {
      ship.position.x = (cycle - 8) * 2;
      ship.position.y = 0.7 + (cycle - 8) * 0.4 - (cycle - 8) * 0.4;
    } else {
      ship.position.x = 8 + (cycle - 12) * 2;
      ship.position.y = 0.7;
    }
    setOpacity(land, smoothAt(t, 1, 2.5, 0, 1));
    setOpacity(clouds, smoothAt(t, 1, 2.5, 0, 0.85));
    setOpacity(digArrow, smoothAt(t, 2, 3, 0, 1));
    // Fade out dig arrow after digging is shown
    if (t > 4) setOpacity(digArrow, smoothAt(t, 4, 5, 1, 0));
    setOpacity(lockGate1, smoothAt(t, 4, 5, 0, 1));
    setOpacity(lockGate2, smoothAt(t, 4, 5, 0, 1));
    setOpacity(ship, smoothAt(t, 5, 6, 0, 1));
    setOpacity(canalLabel, smoothAt(t, 8, 9, 0, 1));

    let labels = [];
    if (t >= 0) labels.push({ text: 'Land separates two seas' });
    if (t >= 2 && t < 4) labels.push({ text: '↓ Humans DIG a channel', highlight: true });
    if (t >= 4 && t < 6) labels.push({ text: 'Lock gates control water level' });
    if (t >= 6 && t < 8) labels.push({ text: 'Ship rises through the lock' });
    if (t >= 8 && t < 10) labels.push({ text: 'CANAL — man-made channel', highlight: true });
    setOverlayLabels(labels);

    if (t < 2) showNarration('A landmass separates two seas. Ships must go ALL the way around...');
    else if (t < 4) showNarration('Humans DIG a straight channel through the land — saving thousands of kilometres!');
    else if (t < 6) showNarration('Lock gates raise or lower ships between water levels. Pure engineering!');
    else if (t < 8) showNarration('Watch the ship rise as the lock fills with water.');
    else if (t < 10) showNarration('This is a CANAL — a man-made water channel. (Suez Canal saves 7,000 km!)');
    else if (t >= 10) showNarration('Compare: CANAL is man-made & straight. STRAIT is natural & irregular.');
    else showNarration(null);

    if (t >= 10) {
      showComparison('CANAL', canalVsStraitSVG('canal'), 'STRAIT', canalVsStraitSVG('strait'));
    } else {
      hideComparison();
    }

    if (isTeachMe) {
      let cam;
      if (t < 2) cam = tweenCamera(t, 0, 2, new THREE.Vector3(0, 25, 45), new THREE.Vector3(0, 30, 30), new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0));
      else if (t < 4) cam = tweenCamera(t, 2, 4, new THREE.Vector3(0, 30, 30), new THREE.Vector3(8, 8, 8), new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0));
      else if (t < 6) cam = tweenCamera(t, 4, 6, new THREE.Vector3(8, 8, 8), new THREE.Vector3(0, 5, 10), new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0));
      else if (t < 8) cam = tweenCamera(t, 6, 8, new THREE.Vector3(0, 5, 10), new THREE.Vector3(0, 8, 12), new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0));
      else if (t < 10) cam = tweenCamera(t, 8, 10, new THREE.Vector3(0, 8, 12), new THREE.Vector3(0, 18, 25), new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0));
      else cam = { pos: new THREE.Vector3(0, 25, 45), lookAt: new THREE.Vector3(0, 0, 0) };
      cameraOverride = cam;
    }
  }

  function reset() { update(0); }
  return { build, update, reset, steps, totalDuration };
};

// ---------- TRENCH ----------
SCENE_CONTROLLERS.trench = function(root) {
  let seafloor, trenchWedge, water, subductArrow, descendingPlate, trenchLabel, depthMarker;
  const steps = [
    { t: 0,  label: 'The flat ocean floor' },
    { t: 2,  label: 'One tectonic plate sinks below another' },
    { t: 4,  label: 'A V-shaped valley forms' },
    { t: 6,  label: 'Highlight: the deepest point on Earth' },
    { t: 8,  label: 'Label: TRENCH' },
    { t: 10, label: 'Compare: Trench vs Ridge' }
  ];
  const totalDuration = 12;

  function build() {
    // Wide open water above
    water = createWater(80, 0x1e6cb0, 0.85, 60);
    water.position.y = 0;
    root.add(water);
    // Flat seafloor (right side)
    const floorGeo = new THREE.BoxGeometry(40, 1, 30);
    seafloor = new THREE.Mesh(floorGeo,
      new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.95 }));
    seafloor.position.set(20, -8, 0);
    seafloor.receiveShadow = true;
    root.add(seafloor);
    // Left-side plate (slightly higher) — descending
    const plateGeo = new THREE.BoxGeometry(30, 1, 30);
    descendingPlate = new THREE.Mesh(plateGeo,
      new THREE.MeshStandardMaterial({ color: 0x4a3a2a, roughness: 0.9 }));
    descendingPlate.position.set(-15, -6, 0);
    descendingPlate.rotation.z = 0;  // will be animated to tilt
    setOpacity(descendingPlate, 0);
    root.add(descendingPlate);
    // Trench — V-shaped wedge cut into the seafloor at x=0
    const trenchShape = new THREE.Shape();
    trenchShape.moveTo(-6, 0);
    trenchShape.lineTo(0, -6);  // V bottom
    trenchShape.lineTo(6, 0);
    trenchShape.lineTo(6, 1);
    trenchShape.lineTo(-6, 1);
    trenchShape.closePath();
    const trenchGeo = new THREE.ExtrudeGeometry(trenchShape, { depth: 30, bevelEnabled: false });
    trenchWedge = new THREE.Mesh(trenchGeo,
      new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 1.0, side: THREE.DoubleSide }));
    trenchWedge.rotation.x = -Math.PI / 2;
    trenchWedge.position.set(0, -7.5, -15);
    trenchWedge.scale.set(1, 1, 1);
    setOpacity(trenchWedge, 0);
    root.add(trenchWedge);
    // Subduction arrow showing plate motion
    subductArrow = createHighlightArrow(
      new THREE.Vector3(-25, -5, 0),
      new THREE.Vector3(-5, -8, 0),
      0xfbbf24
    );
    setOpacity(subductArrow, 0);
    root.add(subductArrow);
    // Depth marker label (3D sprite)
    depthMarker = createTextLabel('↓ Deepest point', '#fbbf24', 50);
    depthMarker.position.set(0, 0, 0);
    setOpacity(depthMarker, 0);
    root.add(depthMarker);
    // Trench label
    trenchLabel = createTextLabel('TRENCH', '#fbbf24', 80);
    trenchLabel.position.set(0, 5, 0);
    setOpacity(trenchLabel, 0);
    root.add(trenchLabel);
    update(0);
  }

  function update(t) {
    updateWater(water, 0, 0.2, 0.35);
    // Subduction animation: plate tilts down over time
    const tilt = smoothAt(t, 2, 5, 0, 0.4);
    descendingPlate.rotation.z = -tilt;
    setOpacity(descendingPlate, smoothAt(t, 1.5, 3, 0, 1));
    // Trench V appears as plate subducts
    setOpacity(trenchWedge, smoothAt(t, 3, 5, 0, 1));
    setOpacity(subductArrow, smoothAt(t, 4, 5, 0, 1));
    if (t > 6) setOpacity(subductArrow, smoothAt(t, 6, 7, 1, 0));
    setOpacity(depthMarker, smoothAt(t, 6, 7, 0, 1));
    depthMarker.position.set(0, smoothAt(t, 6, 8, 0, -6.5), 0);
    setOpacity(trenchLabel, smoothAt(t, 8, 9, 0, 1));

    let labels = [];
    if (t >= 0) labels.push({ text: 'Flat ocean floor' });
    if (t >= 2 && t < 4) labels.push({ text: 'Plate sinks below another →', highlight: true });
    if (t >= 4 && t < 6) labels.push({ text: 'V-shaped valley forms' });
    if (t >= 6 && t < 8) labels.push({ text: '↓ Deepest point on Earth', highlight: true });
    if (t >= 8 && t < 10) labels.push({ text: 'TRENCH — deep V-valley', highlight: true });
    setOverlayLabels(labels);

    if (t < 2) showNarration('🌊 The flat ocean floor stretches out below the water.');
    else if (t < 4) showNarration('One tectonic plate sinks below another — this is called SUBDUCTION.');
    else if (t < 6) showNarration('As the plate bends downward, a V-shaped valley forms on the seafloor.');
    else if (t < 8) showNarration('This is the DEEPEST point on Earth — over 11,000 m down (Mariana Trench).');
    else if (t < 10) showNarration('This is a TRENCH — a long, narrow, very deep V-shape on the ocean floor.');
    else if (t >= 10) showNarration('Compare: TRENCH is the deepest point. RIDGE is the longest mountain chain.');
    else showNarration(null);

    if (t >= 10) {
      showComparison('TRENCH', trenchVsRidgeSVG('trench'), 'RIDGE', trenchVsRidgeSVG('ridge'));
    } else {
      hideComparison();
    }

    if (isTeachMe) {
      let cam;
      if (t < 2) cam = tweenCamera(t, 0, 2, new THREE.Vector3(0, 25, 45), new THREE.Vector3(0, 18, 30), new THREE.Vector3(0,0,0), new THREE.Vector3(0,-6,0));
      else if (t < 4) cam = tweenCamera(t, 2, 4, new THREE.Vector3(0, 18, 30), new THREE.Vector3(-15, 5, 25), new THREE.Vector3(0,-6,0), new THREE.Vector3(-10,-7,0));
      else if (t < 6) cam = tweenCamera(t, 4, 6, new THREE.Vector3(-15, 5, 25), new THREE.Vector3(0, 5, 15), new THREE.Vector3(-10,-7,0), new THREE.Vector3(0,-7,0));
      else if (t < 8) cam = tweenCamera(t, 6, 8, new THREE.Vector3(0, 5, 15), new THREE.Vector3(0, 0, 12), new THREE.Vector3(0,-7,0), new THREE.Vector3(0,-7,0));
      else if (t < 10) cam = tweenCamera(t, 8, 10, new THREE.Vector3(0, 0, 12), new THREE.Vector3(0, 15, 25), new THREE.Vector3(0,-7,0), new THREE.Vector3(0,-6,0));
      else cam = { pos: new THREE.Vector3(0, 25, 45), lookAt: new THREE.Vector3(0, -6, 0) };
      cameraOverride = cam;
    }
  }

  function reset() { update(0); }
  return { build, update, reset, steps, totalDuration };
};

// ---------- RIDGE ----------
SCENE_CONTROLLERS.ridge = function(root) {
  let water, seafloorLeft, seafloorRight, ridgeMountain, magmaArrow, ridgeLabel, ridgeArrow;
  const steps = [
    { t: 0,  label: 'Two ocean plates side-by-side' },
    { t: 2,  label: 'Plates pull apart — magma rises' },
    { t: 4,  label: 'A mountain chain forms along the crack' },
    { t: 6,  label: 'Highlight: the longest mountain range on Earth' },
    { t: 8,  label: 'Label: RIDGE' },
    { t: 10, label: 'Compare: Ridge vs Trench' }
  ];
  const totalDuration = 12;

  function build() {
    water = createWater(80, 0x1e6cb0, 0.85, 60);
    water.position.y = 0;
    root.add(water);
    // Two ocean-floor plates — initially flat, then spread apart
    seafloorLeft = new THREE.Mesh(
      new THREE.BoxGeometry(40, 1, 30),
      new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.95 })
    );
    seafloorLeft.position.set(-22, -8, 0);
    seafloorLeft.receiveShadow = true;
    root.add(seafloorLeft);
    seafloorRight = new THREE.Mesh(
      new THREE.BoxGeometry(40, 1, 30),
      new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.95 })
    );
    seafloorRight.position.set(22, -8, 0);
    seafloorRight.receiveShadow = true;
    root.add(seafloorRight);
    // Ridge — a series of mountain peaks in the middle (initially invisible)
    const ridgeGroup = new THREE.Group();
    for (let i = -3; i <= 3; i++) {
      const h = 4 + Math.random() * 2;
      const peak = new THREE.Mesh(
        new THREE.ConeGeometry(3, h, 6),
        new THREE.MeshStandardMaterial({ color: 0x5a3a2a, roughness: 0.9 })
      );
      peak.position.set(i * 3, -8 + h / 2, 0);
      peak.castShadow = true;
      ridgeGroup.add(peak);
    }
    ridgeMountain = ridgeGroup;
    setOpacity(ridgeMountain, 0);
    root.add(ridgeMountain);
    // Magma arrow — rises from below
    magmaArrow = createHighlightArrow(
      new THREE.Vector3(0, -15, 0),
      new THREE.Vector3(0, -10, 0),
      0xff6b35
    );
    setOpacity(magmaArrow, 0);
    root.add(magmaArrow);
    // Pull-apart arrows on the plates
    const pullArrowL = createHighlightArrow(
      new THREE.Vector3(0, -7, 0),
      new THREE.Vector3(-15, -7, 0),
      0xfbbf24
    );
    setOpacity(pullArrowL, 0);
    pullArrowL.userData.name = 'pullL';
    root.add(pullArrowL);
    const pullArrowR = createHighlightArrow(
      new THREE.Vector3(0, -7, 0),
      new THREE.Vector3(15, -7, 0),
      0xfbbf24
    );
    setOpacity(pullArrowR, 0);
    pullArrowR.userData.name = 'pullR';
    root.add(pullArrowR);
    ridgeLabel = createTextLabel('RIDGE', '#fbbf24', 80);
    ridgeLabel.position.set(0, 5, 0);
    setOpacity(ridgeLabel, 0);
    root.add(ridgeLabel);
    // Save pull arrows for animation
    ridgeMountain.userData.pullL = pullArrowL;
    ridgeMountain.userData.pullR = pullArrowR;
    update(0);
  }

  function update(t) {
    updateWater(water, 0, 0.2, 0.35);
    // Plates spread apart
    const spread = smoothAt(t, 2, 6, 0, 4);
    seafloorLeft.position.x = -22 - spread;
    seafloorRight.position.x = 22 + spread;
    // Ridge mountains rise up in the middle
    const ridgeScaleY = smoothAt(t, 4, 6, 0, 1);
    ridgeMountain.scale.y = ridgeScaleY;
    setOpacity(ridgeMountain, smoothAt(t, 4, 5, 0, 1));
    // Magma rises up
    setOpacity(magmaArrow, smoothAt(t, 2, 3, 0, 1));
    if (t > 5) setOpacity(magmaArrow, smoothAt(t, 5, 6, 1, 0));
    // Pull-apart arrows
    const pullOpacity = smoothAt(t, 2, 3, 0, 1);
    setOpacity(ridgeMountain.userData.pullL, pullOpacity);
    setOpacity(ridgeMountain.userData.pullR, pullOpacity);
    if (t > 5) {
      setOpacity(ridgeMountain.userData.pullL, smoothAt(t, 5, 6, 1, 0));
      setOpacity(ridgeMountain.userData.pullR, smoothAt(t, 5, 6, 1, 0));
    }
    setOpacity(ridgeLabel, smoothAt(t, 8, 9, 0, 1));

    let labels = [];
    if (t >= 0) labels.push({ text: 'Two ocean plates' });
    if (t >= 2 && t < 4) labels.push({ text: '← Plates pull apart →', highlight: true });
    if (t >= 4 && t < 6) labels.push({ text: 'Magma rises, mountains form ↑' });
    if (t >= 6 && t < 8) labels.push({ text: 'Longest mountain range on Earth', highlight: true });
    if (t >= 8 && t < 10) labels.push({ text: 'RIDGE — underwater mountains', highlight: true });
    setOverlayLabels(labels);

    if (t < 2) showNarration('🌊 Two ocean plates sit side-by-side under the water.');
    else if (t < 4) showNarration('The plates pull APART — magma rises up from the Earth\'s mantle.');
    else if (t < 6) showNarration('As magma cools, it forms new crust — a chain of underwater mountains grows.');
    else if (t < 8) showNarration('This is the LONGEST mountain range on Earth — the Mid-Atlantic Ridge is 65,000 km long!');
    else if (t < 10) showNarration('This is a RIDGE — a long underwater mountain chain.');
    else if (t >= 10) showNarration('Compare: RIDGE = mountains (plates pull apart). TRENCH = valley (plate sinks).');
    else showNarration(null);

    if (t >= 10) {
      showComparison('RIDGE', trenchVsRidgeSVG('ridge'), 'TRENCH', trenchVsRidgeSVG('trench'));
    } else {
      hideComparison();
    }

    if (isTeachMe) {
      let cam;
      if (t < 2) cam = tweenCamera(t, 0, 2, new THREE.Vector3(0, 25, 45), new THREE.Vector3(0, 18, 30), new THREE.Vector3(0,0,0), new THREE.Vector3(0,-6,0));
      else if (t < 4) cam = tweenCamera(t, 2, 4, new THREE.Vector3(0, 18, 30), new THREE.Vector3(0, 5, 20), new THREE.Vector3(0,-6,0), new THREE.Vector3(0,-7,0));
      else if (t < 6) cam = tweenCamera(t, 4, 6, new THREE.Vector3(0, 5, 20), new THREE.Vector3(0, -2, 15), new THREE.Vector3(0,-7,0), new THREE.Vector3(0,-6,0));
      else if (t < 8) cam = tweenCamera(t, 6, 8, new THREE.Vector3(0, -2, 15), new THREE.Vector3(15, 8, 15), new THREE.Vector3(0,-6,0), new THREE.Vector3(0,-6,0));
      else if (t < 10) cam = tweenCamera(t, 8, 10, new THREE.Vector3(15, 8, 15), new THREE.Vector3(0, 20, 30), new THREE.Vector3(0,-6,0), new THREE.Vector3(0,-6,0));
      else cam = { pos: new THREE.Vector3(0, 25, 45), lookAt: new THREE.Vector3(0, -6, 0) };
      cameraOverride = cam;
    }
  }

  function reset() { update(0); }
  return { build, update, reset, steps, totalDuration };
};

// ---------- REEF ----------
SCENE_CONTROLLERS.reef = function(root) {
  let water, land, reefRing, coralBranches, ship, clouds, floor, reefLabel, reefArrow;
  const steps = [
    { t: 0,  label: 'The sea near a coastline' },
    { t: 2,  label: 'Coral polyps build rocky colonies' },
    { t: 4,  label: 'A ridge of coral rises near the surface' },
    { t: 6,  label: 'Highlight: the reef — danger to ships!' },
    { t: 8,  label: 'Label: REEF' },
    { t: 10, label: 'Compare: Reef vs Atoll' }
  ];
  const totalDuration = 12;

  function build() {
    water = createWater(80, 0x1e6cb0, 0.88, 80);
    water.position.y = 0;
    root.add(water);
    // Small island
    land = createLand([[-10, -5], [10, -5], [12, -10], [-12, -10]], 3, 0x5a7a3a);
    land.position.y = -0.2;
    setOpacity(land, 0);
    root.add(land);
    // Reef ring (initially invisible)
    const reefGeo = new THREE.TorusGeometry(15, 1.5, 8, 32);
    reefRing = new THREE.Mesh(reefGeo,
      new THREE.MeshStandardMaterial({ color: 0xc9a06b, roughness: 0.9 }));
    reefRing.position.set(0, -0.5, -8);
    reefRing.rotation.x = -Math.PI / 2;
    reefRing.scale.set(1, 1, 0.3);
    setOpacity(reefRing, 0);
    root.add(reefRing);
    // Coral branches growing up
    coralBranches = new THREE.Group();
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2;
      const r = 14;
      const h = 1 + Math.random();
      const branch = new THREE.Mesh(
        new THREE.ConeGeometry(0.4, h, 5),
        new THREE.MeshStandardMaterial({ color: i % 2 ? 0xff6b9d : 0xffaa55, roughness: 0.7 })
      );
      branch.position.set(Math.cos(a) * r, -0.5, -8 + Math.sin(a) * r * 0.3);
      branch.castShadow = true;
      coralBranches.add(branch);
    }
    coralBranches.scale.y = 0;
    setOpacity(coralBranches, 0);
    root.add(coralBranches);
    // Ship avoiding the reef
    ship = createShip(0.6, 0xb03030);
    ship.position.set(-20, 0.7, -8);
    setOpacity(ship, 0);
    root.add(ship);
    clouds = createClouds(5, 50, 22);
    setOpacity(clouds, 0);
    root.add(clouds);
    floor = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.95 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -3.5;
    floor.receiveShadow = true;
    root.add(floor);
    reefLabel = createTextLabel('REEF', '#fbbf24', 80);
    reefLabel.position.set(0, 4, -8);
    setOpacity(reefLabel, 0);
    root.add(reefLabel);
    reefArrow = createHighlightArrow(
      new THREE.Vector3(20, 5, -8),
      new THREE.Vector3(8, -0.5, -8),
      0xfbbf24
    );
    setOpacity(reefArrow, 0);
    root.add(reefArrow);
    update(0);
  }

  function update(t) {
    updateWater(water, 0, 0.2, 0.35);
    setOpacity(land, smoothAt(t, 1, 2.5, 0, 1));
    setOpacity(clouds, smoothAt(t, 1, 2.5, 0, 0.85));
    // Coral branches grow up
    const growY = smoothAt(t, 2, 4, 0, 1);
    coralBranches.scale.y = growY;
    setOpacity(coralBranches, smoothAt(t, 2, 3, 0, 1));
    // Reef ring appears
    setOpacity(reefRing, smoothAt(t, 4, 5, 0, 1));
    setOpacity(reefArrow, smoothAt(t, 6, 7, 0, 1));
    if (t > 8) setOpacity(reefArrow, smoothAt(t, 8, 9, 1, 0));
    setOpacity(ship, smoothAt(t, 6, 7, 0, 1));
    setOpacity(reefLabel, smoothAt(t, 8, 9, 0, 1));
    // Ship sails past the reef
    ship.position.x = -20 + ((t * 1.5) % 50);

    let labels = [];
    if (t >= 0) labels.push({ text: 'The sea near a coast' });
    if (t >= 2 && t < 4) labels.push({ text: 'Tiny coral animals build colonies' });
    if (t >= 4 && t < 6) labels.push({ text: 'Rocky ridge rises near surface' });
    if (t >= 6 && t < 8) labels.push({ text: '← Reef! Ships must avoid it', highlight: true });
    if (t >= 8 && t < 10) labels.push({ text: 'REEF — rocky/coral ridge', highlight: true });
    setOverlayLabels(labels);

    if (t < 2) showNarration('🌊 The sea near a coastline. Tiny coral polyps live here.');
    else if (t < 4) showNarration('Coral polyps build hard rocky colonies over thousands of years.');
    else if (t < 6) showNarration('A ridge of coral and rock rises up near the water\'s surface.');
    else if (t < 8) showNarration('Reefs are DANGEROUS to ships — they can tear a hull open!');
    else if (t < 10) showNarration('This is a REEF — a ridge of coral, rock, or sand near the surface. (Great Barrier Reef: 2,300 km)');
    else if (t >= 10) showNarration('Compare: REEF = any coral ridge. ATOLL = a ring-shaped reef with a lagoon inside.');
    else showNarration(null);

    if (t >= 10) {
      showComparison('REEF', reefVsAtollSVG('reef'), 'ATOLL', reefVsAtollSVG('atoll'));
    } else {
      hideComparison();
    }

    if (isTeachMe) {
      let cam;
      if (t < 2) cam = tweenCamera(t, 0, 2, new THREE.Vector3(0, 25, 45), new THREE.Vector3(0, 22, 40), new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,-8));
      else if (t < 4) cam = tweenCamera(t, 2, 4, new THREE.Vector3(0, 22, 40), new THREE.Vector3(0, 8, 5), new THREE.Vector3(0,0,-8), new THREE.Vector3(0,0,-8));
      else if (t < 6) cam = tweenCamera(t, 4, 6, new THREE.Vector3(0, 8, 5), new THREE.Vector3(0, 12, 20), new THREE.Vector3(0,0,-8), new THREE.Vector3(0,0,-8));
      else if (t < 8) cam = tweenCamera(t, 6, 8, new THREE.Vector3(0, 12, 20), new THREE.Vector3(15, 8, -5), new THREE.Vector3(0,0,-8), new THREE.Vector3(0,0,-8));
      else if (t < 10) cam = tweenCamera(t, 8, 10, new THREE.Vector3(15, 8, -5), new THREE.Vector3(0, 18, 25), new THREE.Vector3(0,0,-8), new THREE.Vector3(0,0,-8));
      else cam = { pos: new THREE.Vector3(0, 25, 45), lookAt: new THREE.Vector3(0, 0, -8) };
      cameraOverride = cam;
    }
  }

  function reset() { update(0); }
  return { build, update, reset, steps, totalDuration };
};

// ---------- ATOLL ----------
SCENE_CONTROLLERS.atoll = function(root) {
  let water, volcano, volcano2, volcano3, coralRing, lagoonWater, clouds, floor, atollLabel;
  const steps = [
    { t: 0,  label: 'A volcanic island in the sea' },
    { t: 2,  label: 'Coral grows around the volcano' },
    { t: 4,  label: 'The volcano slowly sinks/erodes' },
    { t: 6,  label: 'A ring of coral remains — with a lagoon inside' },
    { t: 8,  label: 'Label: ATOLL' },
    { t: 10, label: 'Compare: Atoll vs Reef' }
  ];
  const totalDuration = 12;

  function build() {
    water = createWater(80, 0x1e6cb0, 0.88, 80);
    water.position.y = 0;
    root.add(water);
    // Volcanic island (initially full size)
    volcano = new THREE.Mesh(
      new THREE.ConeGeometry(8, 6, 16),
      new THREE.MeshStandardMaterial({ color: 0x5a3a2a, roughness: 0.9 })
    );
    volcano.position.set(0, 2, 0);
    volcano.castShadow = true;
    root.add(volcano);
    // Stage 2: volcano slightly eroded
    volcano2 = new THREE.Mesh(
      new THREE.ConeGeometry(6, 4, 16),
      new THREE.MeshStandardMaterial({ color: 0x5a3a2a, roughness: 0.9 })
    );
    volcano2.position.set(0, 1, 0);
    volcano2.castShadow = true;
    setOpacity(volcano2, 0);
    root.add(volcano2);
    // Stage 3: volcano fully submerged (just a bump on the floor)
    volcano3 = new THREE.Mesh(
      new THREE.ConeGeometry(5, 1, 16),
      new THREE.MeshStandardMaterial({ color: 0x5a3a2a, roughness: 0.9 })
    );
    volcano3.position.set(0, -2.8, 0);
    setOpacity(volcano3, 0);
    root.add(volcano3);
    // Coral ring (grows around the volcano)
    const ringGeo = new THREE.TorusGeometry(10, 1.2, 10, 48);
    coralRing = new THREE.Mesh(ringGeo,
      new THREE.MeshStandardMaterial({ color: 0xc9a06b, roughness: 0.85 }));
    coralRing.position.set(0, 0.5, 0);
    coralRing.rotation.x = -Math.PI / 2;
    coralRing.scale.set(1, 1, 1);
    setOpacity(coralRing, 0);
    root.add(coralRing);
    // Lagoon water inside the ring (initially invisible)
    lagoonWater = createWater(18, 0x4ec0e8, 0.85, 30);
    lagoonWater.scale.set(1, 1, 1);
    lagoonWater.position.set(0, 0.1, 0);
    setOpacity(lagoonWater, 0);
    root.add(lagoonWater);
    clouds = createClouds(5, 50, 22);
    setOpacity(clouds, 0);
    root.add(clouds);
    floor = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.95 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -3.5;
    floor.receiveShadow = true;
    root.add(floor);
    atollLabel = createTextLabel('ATOLL', '#fbbf24', 80);
    atollLabel.position.set(0, 6, 0);
    setOpacity(atollLabel, 0);
    root.add(atollLabel);
    update(0);
  }

  function update(t) {
    updateWater(water, 0, 0.2, 0.35);
    updateWater(lagoonWater, 0, 0.15, 0.5);
    setOpacity(clouds, smoothAt(t, 1, 2.5, 0, 0.85));
    // Stage transitions:
    // 0-2: full volcano visible
    // 2-4: volcano shrinks (coral grows around it)
    // 4-6: volcano fully sinks (only stage 3 visible)
    // 6+: only coral ring + lagoon remain
    setOpacity(volcano, smoothAt(t, 2, 4, 1, 0));
    setOpacity(volcano2, smoothAt(t, 2, 3, 0, 1));
    if (t > 3) setOpacity(volcano2, smoothAt(t, 4, 5, 1, 0));
    setOpacity(volcano3, smoothAt(t, 4, 5, 0, 1));
    if (t > 6) setOpacity(volcano3, smoothAt(t, 6, 7, 1, 0));
    // Coral ring grows from radius 0 to full
    const ringScale = smoothAt(t, 2, 5, 0.2, 1.0);
    coralRing.scale.set(ringScale, ringScale, 1);
    setOpacity(coralRing, smoothAt(t, 2, 3, 0, 1));
    // Lagoon water appears once the ring is closed
    setOpacity(lagoonWater, smoothAt(t, 6, 7, 0, 1));
    setOpacity(atollLabel, smoothAt(t, 8, 9, 0, 1));

    let labels = [];
    if (t >= 0) labels.push({ text: 'A volcanic island' });
    if (t >= 2 && t < 4) labels.push({ text: 'Coral grows around the volcano' });
    if (t >= 4 && t < 6) labels.push({ text: 'Volcano slowly sinks ↓' });
    if (t >= 6 && t < 8) labels.push({ text: 'Ring of coral + lagoon inside', highlight: true });
    if (t >= 8 && t < 10) labels.push({ text: 'ATOLL — ring-shaped reef', highlight: true });
    setOverlayLabels(labels);

    if (t < 2) showNarration('🌋 A volcanic island rises out of the sea.');
    else if (t < 4) showNarration('Coral polyps begin to grow around the volcano\'s edge.');
    else if (t < 6) showNarration('Over millions of years, the volcano slowly sinks back into the sea.');
    else if (t < 8) showNarration('Only the ring of coral remains — with a calm lagoon inside!');
    else if (t < 10) showNarration('This is an ATOLL — a ring-shaped coral reef with a lagoon inside.');
    else if (t >= 10) showNarration('Compare: ATOLL = ring with lagoon. REEF = any coral ridge (any shape).');
    else showNarration(null);

    if (t >= 10) {
      showComparison('ATOLL', reefVsAtollSVG('atoll'), 'REEF', reefVsAtollSVG('reef'));
    } else {
      hideComparison();
    }

    if (isTeachMe) {
      let cam;
      if (t < 2) cam = tweenCamera(t, 0, 2, new THREE.Vector3(0, 25, 45), new THREE.Vector3(0, 15, 35), new THREE.Vector3(0,0,0), new THREE.Vector3(0,2,0));
      else if (t < 4) cam = tweenCamera(t, 2, 4, new THREE.Vector3(0, 15, 35), new THREE.Vector3(20, 10, 20), new THREE.Vector3(0,2,0), new THREE.Vector3(0,0,0));
      else if (t < 6) cam = tweenCamera(t, 4, 6, new THREE.Vector3(20, 10, 20), new THREE.Vector3(0, 25, 20), new THREE.Vector3(0,0,0), new THREE.Vector3(0,-2,0));
      else if (t < 8) cam = tweenCamera(t, 6, 8, new THREE.Vector3(0, 25, 20), new THREE.Vector3(15, 15, 15), new THREE.Vector3(0,-2,0), new THREE.Vector3(0,0,0));
      else if (t < 10) cam = tweenCamera(t, 8, 10, new THREE.Vector3(15, 15, 15), new THREE.Vector3(0, 20, 25), new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0));
      else cam = { pos: new THREE.Vector3(0, 25, 45), lookAt: new THREE.Vector3(0, 0, 0) };
      cameraOverride = cam;
    }
  }

  function reset() { update(0); }
  return { build, update, reset, steps, totalDuration };
};

// ---------- ISTHMUS ----------
SCENE_CONTROLLERS.isthmus = function(root) {
  let water, landLeft, landRight, isthmusStrip, ship1, ship2, clouds, floor, isthmusLabel, isthmusArrow;
  const steps = [

      new THREE.MeshStandardMaterial({ color: 0x4ec0e8, transparent: true, opacity: 0.9, side: THREE.DoubleSide })
    );
    branch3.rotation.x = -Math.PI / 2;
    branch3.rotation.z = -0.3;
    branch3.position.set(3, 0.2, -8);
    setOpacity(branch3, 0);
    root.add(branch3);
    clouds = createClouds(5, 50, 22);
    setOpacity(clouds, 0);
    root.add(clouds);
    floor = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshStandardMaterial({ color: 0x2a3548, roughness: 0.95 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -3.5;
    floor.receiveShadow = true;
    root.add(floor);
    deltaLabel = createTextLabel('DELTA', '#fbbf24', 80);
    deltaLabel.position.set(0, 4, -8);
    setOpacity(deltaLabel, 0);
    root.add(deltaLabel);
    sedimentArrow = createHighlightArrow(
      new THREE.Vector3(0, 5, 0),
      new THREE.Vector3(0, 0.5, -8),
      0xfbbf24
    );
    setOpacity(sedimentArrow, 0);
    root.add(sedimentArrow);
    update(0);
  }

  function update(t) {
    updateWater(water, 0, 0.2, 0.35);
    setOpacity(mainland, smoothAt(t, 1, 2.5, 0, 1));
    setOpacity(river, smoothAt(t, 1, 2.5, 0, 0.9));
    setOpacity(clouds, smoothAt(t, 1, 2.5, 0, 0.85));
    // Sediment depositing — delta grows from a flat triangle to full height
    const growScale = smoothAt(t, 4, 6, 0.1, 1);
    deltaLand.scale.set(1, growScale, 1);
    setOpacity(deltaLand, smoothAt(t, 4, 5, 0, 1));
    // Branches appear
    setOpacity(branch1, smoothAt(t, 4, 5, 0, 0.9));
    setOpacity(branch2, smoothAt(t, 4.5, 5.5, 0, 0.9));
    setOpacity(branch3, smoothAt(t, 5, 6, 0, 0.9));
    setOpacity(sedimentArrow, smoothAt(t, 4, 5, 0, 1));
    if (t > 6) setOpacity(sedimentArrow, smoothAt(t, 6, 7, 1, 0));
    setOpacity(deltaLabel, smoothAt(t, 8, 9, 0, 1));

    let labels = [];
    if (t >= 0) labels.push({ text: 'A river flows toward the sea' });
    if (t >= 2 && t < 4) labels.push({ text: 'River slows down ↓' });
    if (t >= 4 && t < 6) labels.push({ text: 'Sediment deposits, river splits' });
    if (t >= 6 && t < 8) labels.push({ text: 'Triangle (Δ) shape forms', highlight: true });
    if (t >= 8 && t < 10) labels.push({ text: 'DELTA — triangle of sediment', highlight: true });
    setOverlayLabels(labels);

    if (t < 2) showNarration('A river carries water and sediment toward the sea.');
    else if (t < 4) showNarration('As the river meets the sea, it slows down — and drops its sediment.');
    else if (t < 6) showNarration('Sediment piles up. The river splits into many branches to find a way through.');
    else if (t < 8) showNarration('The shape looks like the Greek letter Δ (delta) — that\'s where the name comes from!');
    else if (t < 10) showNarration('This is a DELTA. (Sundarbans = world\'s largest, 100,000 km²)');
    else if (t >= 10) showNarration('Compare: DELTA = triangle of deposited sediment. ESTUARY = funnel where river meets sea.');
    else showNarration(null);

    if (t >= 10) {
      showComparison('DELTA', deltaVsEstuarySVG('delta'), 'ESTUARY', deltaVsEstuarySVG('estuary'));
    } else {
      hideComparison();
    }

    if (isTeachMe) {
      let cam;
      if (t < 2) cam = tweenCamera(t, 0, 2, new THREE.Vector3(0, 25, 45), new THREE.Vector3(0, 22, 30), new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0));
      else if (t < 4) cam = tweenCamera(t, 2, 4, new THREE.Vector3(0, 22, 30), new THREE.Vector3(0, 15, 0), new THREE.Vector3(0,0,0), new THREE.Vector3(0,-5,0));
      else if (t < 6) cam = tweenCamera(t, 4, 6, new THREE.Vector3(0, 15, 0), new THREE.Vector3(15, 12, 5), new THREE.Vector3(0,-5,0), new THREE.Vector3(0,-8,0));
      else if (t < 8) cam = tweenCamera(t, 6, 8, new THREE.Vector3(15, 12, 5), new THREE.Vector3(0, 18, 15), new THREE.Vector3(0,-8,0), new THREE.Vector3(0,-8,0));
      else if (t < 10) cam = tweenCamera(t, 8, 10, new THREE.Vector3(0, 18, 15), new THREE.Vector3(0, 22, 30), new THREE.Vector3(0,-8,0), new THREE.Vector3(0,-5,0));
      else cam = { pos: new THREE.Vector3(0, 25, 45), lookAt: new THREE.Vector3(0, 0, 0) };
      cameraOverride = cam;
    }
  }

  function reset() { update(0); }
  return { build, update, reset, steps, totalDuration };
};

// ===============================================================
//  RENDER LOOP + INITIALISATION
// ===============================================================
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();

  // Update water surfaces and scene objects
  if (currentSceneRoot) {
    // Auto-update water and smoke (always animating unless paused? — for simplicity, water always animates)
    currentSceneRoot.traverse(obj => {
      if (obj.userData.isWater && obj.geometry && obj.geometry.attributes && obj.geometry.attributes.position) {
        // We only update water if its opacity > 0 (visible)
        let visible = true;
        if (obj.material) {
          if (Array.isArray(obj.material)) visible = obj.material.some(m => m.opacity > 0.05);
          else visible = obj.material.opacity > 0.05;
        }
        if (visible) updateWater(obj, dt, 0.2, 0.35);
      }
      // Update ship smoke puffs
      if (obj.userData && obj.userData.isSmoke) {
        obj.userData.life += dt;
        obj.position.y = 1.9 + obj.userData.life * 0.6;
        if (obj.material) obj.material.opacity = Math.max(0, 0.6 - obj.userData.life * 0.3);
        if (obj.userData.life > 2) {
          obj.userData.life = 0;
          obj.position.set(0.4, 1.9, 0);
          if (obj.material) obj.material.opacity = 0.6;
        }
      }
    });
  }

  // Advance teach timeline (if playing & not scrubbing)
  if (!isPaused && currentTermController && currentTermController.totalDuration) {
    teachProgress += dt;
    if (teachProgress >= currentTermController.totalDuration) {
      // Loop at end (keeps the last step visible)
      teachProgress = currentTermController.totalDuration;
    }
    // Update the controller
    try {
      currentTermController.update(teachProgress);
    } catch (e) {
      console.error('Controller update error:', e);
    }
    // Update scrubber
    stepProgressEl.value = (teachProgress / currentTermController.totalDuration) * 100;
    // Update step name
    const steps = currentTermController.steps || [];
    let activeStep = steps.length > 0 ? steps[0].label : '';
    for (let i = 0; i < steps.length; i++) {
      if (teachProgress >= steps[i].t) activeStep = `Step ${i+1}: ${steps[i].label}`;
    }
    stepNameEl.textContent = activeStep;
    // Refresh the steps list (cheap; debounced)
    if (Math.floor(teachProgress * 4) !== window.__lastStepsRefresh) {
      window.__lastStepsRefresh = Math.floor(teachProgress * 4);
      updateStepsList();
    }
  }

  // Camera override from Teach Me
  if (cameraOverride) {
    camera.position.copy(cameraOverride.pos);
    camera.lookAt(cameraOverride.lookAt);
  } else {
    // User-controlled rotation
    userRotation.x += (targetRotation.x - userRotation.x) * 0.1;
    userRotation.y += (targetRotation.y - userRotation.y) * 0.1;
    // Apply orbit around origin (the lookAt target)
    const r = camera.position.length();
    // Convert user rotation to spherical coords
    const phi = Math.max(0.1, Math.min(Math.PI - 0.1, Math.PI / 2 - userRotation.x));
    const theta = userRotation.y;
    camera.position.x = r * Math.sin(phi) * Math.sin(theta);
    camera.position.y = r * Math.cos(phi);
    camera.position.z = r * Math.sin(phi) * Math.cos(theta);
    camera.lookAt(0, 0, 0);
  }

  renderer.render(scene, camera);
}
