ext x=\"380\" y=\"220\" text-anchor=\"middle\" fill=\"#22d3ee\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 2.25s\">+ MOVES (some slowly, like plants 🌱)</text></g><g class=\"el\" data-beat=\"3\"><rect x=\"40\" y=\"250\" width=\"340\" height=\"170\" rx=\"10\" fill=\"rgba(52,211,153,0.12)\" stroke=\"#34d399\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"210\" y=\"275\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">✓ LIVING</text><text x=\"100\" y=\"305\" fill=\"#a3e635\" font-size=\"20\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">🐱</text><text x=\"100\" y=\"328\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">Cat</text><text x=\"180\" y=\"305\" fill=\"#a3e635\" font-size=\"20\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">🌳</text><text x=\"180\" y=\"328\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">Tree</text><text x=\"260\" y=\"305\" fill=\"#a3e635\" font-size=\"20\"   class=\"anim-fade-in\" style=\"animation-delay: 0.90s\">🐟</text><text x=\"260\" y=\"328\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 1.05s\">Fish</text><text x=\"340\" y=\"305\" fill=\"#a3e635\" font-size=\"20\"   class=\"anim-fade-in\" style=\"animation-delay: 1.20s\">🧒</text><text x=\"340\" y=\"328\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 1.35s\">Child</text><text x=\"210\" y=\"365\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 1.50s\">Grows · breathes · eats ·</text><text x=\"210\" y=\"380\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 1.65s\">excretes · reproduces</text><text x=\"210\" y=\"400\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"10\" font-style=\"italic; animation-delay: 1.80s\"  class=\"anim-fade-in\">Cells inside!</text></g><g class=\"el\" data-beat=\"3\"><rect x=\"400\" y=\"250\" width=\"320\" height=\"170\" rx=\"10\" fill=\"rgba(148,163,184,0.10)\" stroke=\"#94a3b8\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"560\" y=\"275\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">✗ NON-LIVING</text><text x=\"470\" y=\"305\" fill=\"#94a3b8\" font-size=\"20\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">🪨</text><text x=\"470\" y=\"328\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">Stone</text><text x=\"530\" y=\"305\" fill=\"#94a3b8\" font-size=\"20\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">🚲</text><text x=\"530\" y=\"328\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">Cycle</text><text x=\"590\" y=\"305\" fill=\"#94a3b8\" font-size=\"20\"   class=\"anim-fade-in\" style=\"animation-delay: 0.90s\">🪑</text><text x=\"590\" y=\"328\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 1.05s\">Chair</text><text x=\"650\" y=\"305\" fill=\"#94a3b8\" font-size=\"20\"   class=\"anim-fade-in\" style=\"animation-delay: 1.20s\">🖊️</text><text x=\"650\" y=\"328\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 1.35s\">Pen</text><text x=\"560\" y=\"365\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 1.50s\">No growth · no breath · no food</text><text x=\"560\" y=\"380\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 1.65s\">No excretion · no reproduction</text><text x=\"560\" y=\"400\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\" font-style=\"italic; animation-delay: 1.80s\"  class=\"anim-fade-in\">No cells!</text></g><g class=\"el\" data-beat=\"4\"><rect x=\"40\" y=\"430\" width=\"680\" height=\"80\" rx=\"8\" fill=\"rgba(251,191,36,0.12)\" stroke=\"#fbbf24\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"380\" y=\"452\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"12\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">⚠ TRICKY CASES</text><text x=\"380\" y=\"470\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">Seed = ALIVE (sleeping, can grow) · Dry wood = DEAD (was alive) · Fire = NOT alive (grows but no breath/babies)</text><text x=\"380\" y=\"488\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">Hibernating bear = ALIVE (resting) · Virus = on the edge of life</text></g><g class=\"el\" data-beat=\"5\"><rect x=\"40\" y=\"115\" width=\"0\" height=\"0\" fill=\"none\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"380\" y=\"510\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"11\" font-style=\"italic; animation-delay: 0.15s\"  class=\"anim-fade-in\">Life spans: mosquito = days · dog = 15 yrs · human = 70-100 yrs · banyan = 100s of yrs</text></g><g class=\"el\" data-beat=\"6\"><rect x=\"40\" y=\"345\" width=\"680\" height=\"0\" fill=\"none\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"380\" y=\"490\" text-anchor=\"middle\" fill=\"#22d3ee\" font-size=\"11\" font-style=\"italic; animation-delay: 0.15s\"  class=\"anim-fade-in\">Next: we will look more closely at every characteristic!</text></g>", "beats": ["Namaste, my little friend! Look around you — a cat, a tree, a stone, a cycle. Some of these are ALIVE; some are NOT alive. But how do we know the difference? Is a tree alive even though it does not move? Is a fire alive because it grows? Today we will learn the SECRET SIGNS of life. Ready? Let's begin!", "All living creatures share some SPECIAL signs. We call them the CHARACTERISTICS OF LIFE. A living thing GROWS, BREATHES, needs FOOD, EXCRETES waste, RESPONDS to things around, REPRODUCES (makes babies), and MOVES (some slowly, like plants). A non-living thing does NOT do most of these — a stone never grows, a cycle never breathes.", "Look at the picture. On one side: a cat, a tree, a child, a fish — all LIVING. On the other side: a stone, a cycle, a chair, a pen — all NON-LIVING. How do we tell? Ask the questions: Does it grow? Does it breathe? Does it need food? Does it reproduce? If yes — it is alive!", "But some things can be tricky! A seed looks dead, but it can grow into a plant when given water — so the seed is ALIVE, just sleeping. A hibernating bear looks like it is doing nothing, but it is alive. A dry piece of wood does not grow or breathe — it is DEAD (was alive once, but not anymore). The fire burns and grows, but it is NOT alive — it does not breathe or reproduce.", "Living creatures also have a LIFE SPAN — a time from birth to death. A mosquito lives for a few days; a butterfly for a few weeks; a dog for 10-15 years; a human for 70-100 years; a banyan tree for hundreds of years! Some creatures, like the bristlecone pine tree, can live for thousands of years. Every living thing has its own life cycle — birth, growth, reproduction, and finally death.", "Living creatures are made of tiny building blocks called CELLS — say it with me: CELLS. Some creatures, like bacteria, have just ONE cell. Others, like us, have BILLIONS of cells. Plants and animals are all made of cells; non-living things are not. In our next story, we will look more closely at the characteristics of living creatures. Ready? Let's turn the page…"]}, {"id": "characteristics", "label": "2. Characteristics of Living Creatures", "viewBox": "0 0 760 520", "svg": "<defs><marker id=\"arrB2\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#a3e635\"/></marker></defs><rect x=\"0\" y=\"0\" width=\"760\" height=\"520\" fill=\"#0f172a\"/><text x=\"380\" y=\"34\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"20\" font-weight=\"700\">CHARACTERISTICS OF LIVING CREATURES</text><g class=\"el\" data-beat=\"1\"><rect x=\"40\" y=\"60\" width=\"680\" height=\"70\" rx=\"8\" fill=\"rgba(52,211,153,0.12)\" stroke=\"#34d399\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><circle cx=\"80\" cy=\"95\" r=\"20\" fill=\"rgba(52,211,153,0.30)\" stroke=\"#34d399\" stroke-width=\"2\" class=\"anim-pulse-in\" style=\"animation-delay: 0.15s\" /><text x=\"80\" y=\"100\" text-anchor=\"middle\" fill=\"#34d399\" font-size=\"14\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">1</text><text x=\"115\" y=\"85\" fill=\"#34d399\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">GROWTH</text><text x=\"115\" y=\"103\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">Seed → tree · baby → adult · kitten → cat. New cells are made.</text><text x=\"115\" y=\"119\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">All living things grow bigger and change shape over time.</text></g><g class=\"el\" data-beat=\"2\"><rect x=\"40\" y=\"140\" width=\"680\" height=\"70\" rx=\"8\" fill=\"rgba(56,189,248,0.12)\" stroke=\"#38bdf8\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><circle cx=\"80\" cy=\"175\" r=\"20\" fill=\"rgba(56,189,248,0.30)\" stroke=\"#38bdf8\" stroke-width=\"2\" class=\"anim-pulse-in\" style=\"animation-delay: 0.15s\" /><text x=\"80\" y=\"180\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"14\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">2</text><text x=\"115\" y=\"165\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">RESPIRATION (breathing)</text><text x=\"115\" y=\"183\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">Take in O₂ → release CO₂ → get energy from food</text><text x=\"115\" y=\"199\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">Humans: lungs · Fish: gills · Insects: spiracles · Plants: stomata</text></g><g class=\"el\" data-beat=\"3\"><rect x=\"40\" y=\"220\" width=\"680\" height=\"70\" rx=\"8\" fill=\"rgba(251,191,36,0.12)\" stroke=\"#fbbf24\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><circle cx=\"80\" cy=\"255\" r=\"20\" fill=\"rgba(251,191,36,0.30)\" stroke=\"#fbbf24\" stroke-width=\"2\" class=\"anim-pulse-in\" style=\"animation-delay: 0.15s\" /><text x=\"80\" y=\"260\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"14\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">3</text><text x=\"115\" y=\"245\" fill=\"#fbbf24\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">NUTRITION (food)</text><text x=\"115\" y=\"263\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">Animals: eat plants or other animals. Plants: make food (photosynthesis)</text><text x=\"115\" y=\"279\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">Food gives energy to grow, move, and stay alive.</text></g><g class=\"el\" data-beat=\"4\"><rect x=\"40\" y=\"300\" width=\"680\" height=\"70\" rx=\"8\" fill=\"rgba(244,114,182,0.12)\" stroke=\"#f472b6\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><circle cx=\"80\" cy=\"335\" r=\"20\" fill=\"rgba(244,114,182,0.30)\" stroke=\"#f472b6\" stroke-width=\"2\" class=\"anim-pulse-in\" style=\"animation-delay: 0.15s\" /><text x=\"80\" y=\"340\" text-anchor=\"middle\" fill=\"#f472b6\" font-size=\"14\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">4</text><text x=\"115\" y=\"325\" fill=\"#f472b6\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">EXCRETION (throwing out waste)</text><text x=\"115\" y=\"343\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">Humans: urine + sweat · Plants: gases through stomata · Fish: ammonia into water</text><text x=\"115\" y=\"359\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">Without excretion, waste would poison the body!</text></g><g class=\"el\" data-beat=\"5\"><rect x=\"40\" y=\"380\" width=\"680\" height=\"70\" rx=\"8\" fill=\"rgba(167,139,250,0.12)\" stroke=\"#a78bfa\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><circle cx=\"80\" cy=\"415\" r=\"20\" fill=\"rgba(167,139,250,0.30)\" stroke=\"#a78bfa\" stroke-width=\"2\" class=\"anim-pulse-in\" style=\"animation-delay: 0.15s\" /><text x=\"80\" y=\"420\" text-anchor=\"middle\" fill=\"#a78bfa\" font-size=\"14\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">5</text><text x=\"115\" y=\"405\" fill=\"#a78bfa\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">RESPONSE TO STIMULI</text><text x=\"115\" y=\"423\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">Hand from hot plate · plant towards sunlight · dog wags tail</text><text x=\"115\" y=\"439\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">Living things can FEEL and REACT to surroundings.</text></g><g class=\"el\" data-beat=\"6\"><rect x=\"40\" y=\"460\" width=\"680\" height=\"50\" rx=\"8\" fill=\"rgba(249,115,22,0.12)\" stroke=\"#fb923c\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><circle cx=\"80\" cy=\"485\" r=\"18\" fill=\"rgba(249,115,22,0.30)\" stroke=\"#fb923c\" stroke-width=\"2\" class=\"anim-pulse-in\" style=\"animation-delay: 0.15s\" /><text x=\"80\" y=\"490\" text-anchor=\"middle\" fill=\"#fb923c\" font-size=\"14\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">6</text><text x=\"115\" y=\"478\" fill=\"#fb923c\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">REPRODUCTION — making new living things</text><text x=\"115\" y=\"496\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">Cat → kittens · Hen → eggs · Plant → seeds · Without it, life would END!</text></g>", "beats": ["Welcome back, my little friend! In our last story we saw that living creatures share some special signs. Today we will look at each sign closely. The first sign is GROWTH. All living things grow! A tiny seed becomes a big tree; a baby becomes a big person; a kitten becomes a cat. Growth happens because new cells are made inside the body.", "The second sign is RESPIRATION — say it with me: RES-PI-RA-TION. This means BREATHING. Living things take in oxygen from the air (or water) and use it to release energy from food. We breathe IN oxygen and breathe OUT carbon dioxide. Fish breathe through gills; insects through tiny holes called spiracles; plants through tiny pores on their leaves called stomata.", "The third sign is NUTRITION — taking in FOOD. Animals eat plants or other animals. Plants make their own food using sunlight (photosynthesis — say it: PHOTO-SYN-THE-SIS). Food gives energy to grow, move, and stay alive. Without food, a living thing dies — that is why we eat every day!", "The fourth sign is EXCRETION — say it with me: EX-CRE-TION. This is the body's way of throwing out waste. Humans excrete through urine and sweat. Plants excrete through leaves (some waste goes out as gases through stomata). Fish excrete ammonia into the water. Without excretion, waste would poison the body!", "The fifth sign is RESPONSE TO STIMULI — say it with me: STIM-U-LI. A stimulus is something that causes a reaction. You pull your hand away from a hot plate — that is a response. A plant turns towards sunlight — that is a response. A dog wags its tail when it sees its owner — that is a response. Living things can feel and react.", "The sixth sign is REPRODUCTION — say it with me: RE-PRO-DUC-TION. This is making new living things of the same kind. A cat has kittens, a hen lays eggs, a plant makes seeds that grow into new plants. Without reproduction, life on Earth would end! In our next story, we will see how PLANTS show all these characteristics. Ready? Let's turn the page…"]}, {"id": "plants_living", "label": "3. Plants as Living Creatures", "viewBox": "0 0 760 520", "svg": "<defs><marker id=\"arrB3\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#a3e635\"/></marker></defs><rect x=\"0\" y=\"0\" width=\"760\" height=\"520\" fill=\"#0f172a\"/><text x=\"380\" y=\"34\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"20\" font-weight=\"700\">PLANTS AS LIVING CREATURES</text><g class=\"el\" data-beat=\"1\"><rect x=\"80\" y=\"60\" width=\"600\" height=\"40\" rx=\"8\" fill=\"rgba(163,230,53,0.15)\" stroke=\"#a3e635\" stroke-width=\"2\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"380\" y=\"85\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"14\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Plants show every sign of life — in their own quiet way!</text></g><g class=\"el\" data-beat=\"2\"><rect x=\"40\" y=\"115\" width=\"220\" height=\"100\" rx=\"8\" fill=\"rgba(52,211,153,0.12)\" stroke=\"#34d399\" stroke-width=\"1. 395\" y=\"170\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">CO₂ out</text><text x=\"380\" y=\"195\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 0.90s\">through STOMATA</text><text x=\"380\" y=\"208\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"9\"   class=\"anim-fade-in\" style=\"animation-delay: 1.05s\">(tiny pores on leaves)</text></g><g class=\"el\" data-beat=\"4\"><rect x=\"500\" y=\"115\" width=\"220\" height=\"100\" rx=\"8\" fill=\"rgba(251,191,36,0.12)\" stroke=\"#fbbf24\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"610\" y=\"135\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"11\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">3 · NUTRITION (food)</text><circle cx=\"540\" cy=\"155\" r=\"10\" fill=\"#fde047\" class=\"anim-pulse-in\" style=\"animation-delay: 0.30s\" /><text x=\"540\" y=\"160\" text-anchor=\"middle\" fill=\"#7f1d1d\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">☀</text><text x=\"555\" y=\"158\" fill=\"#94a3b8\" font-size=\"8\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">sunlight</text><text x=\"540\" y=\"178\" fill=\"#94a3b8\" font-size=\"8\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">+ H₂O</text><text x=\"540\" y=\"190\" fill=\"#94a3b8\" font-size=\"8\"   class=\"anim-fade-in\" style=\"animation-delay: 0.90s\">+ CO₂</text><text x=\"610\" y=\"178\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"10\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 1.05s\">PHOTO-</text><text x=\"610\" y=\"190\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"10\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 1.20s\">SYNTHESIS</text><text x=\"610\" y=\"208\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"8\"   class=\"anim-fade-in\" style=\"animation-delay: 1.35s\">make own food!</text></g><g class=\"el\" data-beat=\"5\"><rect x=\"40\" y=\"230\" width=\"340\" height=\"100\" rx=\"8\" fill=\"rgba(244,114,182,0.12)\" stroke=\"#f472b6\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"210\" y=\"250\" text-anchor=\"middle\" fill=\"#f472b6\" font-size=\"11\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">4 · EXCRETION</text><text x=\"60\" y=\"272\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">• Waste gases out through stomata</text><text x=\"60\" y=\"290\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">• Waste stored in old leaves →</text><text x=\"60\" y=\"305\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">  they fall off (autumn!)</text><text x=\"60\" y=\"320\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">• Some waste stored as gums &amp; resins</text></g><g class=\"el\" data-beat=\"6\"><rect x=\"400\" y=\"230\" width=\"320\" height=\"100\" rx=\"8\" fill=\"rgba(167,139,250,0.12)\" stroke=\"#a78bfa\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"560\" y=\"250\" text-anchor=\"middle\" fill=\"#a78bfa\" font-size=\"11\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">5 · RESPONSE  &amp;  6 · REPRODUCE</text><text x=\"420\" y=\"272\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">• Sunflower turns to sun ☀</text><text x=\"420\" y=\"290\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">• Touch-me-not folds leaves 🌿</text><text x=\"420\" y=\"308\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">• Roots → water, stem → light</text><text x=\"420\" y=\"325\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">• Reproduce: seeds · stem · leaves · roots</text></g><g class=\"el\" data-beat=\"6\"><rect x=\"40\" y=\"345\" width=\"680\" height=\"160\" rx=\"8\" fill=\"rgba(15,23,42,0.5)\" stroke=\"#34d399\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><rect x=\"60\" y=\"475\" width=\"640\" height=\"20\" fill=\"rgba(120,53,15,0.5)\" class=\"anim-pop-in\" style=\"animation-delay: 0.15s\" /><text x=\"380\" y=\"490\" text-anchor=\"middle\" fill=\"#92400e\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">soil</text><rect x=\"370\" y=\"380\" width=\"20\" height=\"100\" fill=\"#166534\" class=\"anim-pop-in\" style=\"animation-delay: 0.45s\" /><ellipse cx=\"380\" cy=\"380\" rx=\"100\" ry=\"40\" fill=\"#22c55e\" class=\"anim-pop-in\" style=\"animation-delay: 0.60s\" /><ellipse cx=\"320\" cy=\"395\" rx=\"60\" ry=\"25\" fill=\"#16a34a\" class=\"anim-pop-in\" style=\"animation-delay: 0.75s\" /><ellipse cx=\"440\" cy=\"395\" rx=\"60\" ry=\"25\" fill=\"#16a34a\" class=\"anim-pop-in\" style=\"animation-delay: 0.90s\" /><circle cx=\"380\" cy=\"365\" r=\"20\" fill=\"#fde047\" class=\"anim-pulse-in\" style=\"animation-delay: 1.05s\" /><text x=\"380\" y=\"370\" text-anchor=\"middle\" fill=\"#7f1d1d\" font-size=\"14\"   class=\"anim-fade-in\" style=\"animation-delay: 1.20s\">🌸</text><line x1=\"380\" y1=\"475\" x2=\"320\" y2=\"500\" stroke=\"#92400e\" stroke-width=\"3\" class=\"anim-draw\" style=\"animation-delay: 1.35s\" /><line x1=\"380\" y1=\"475\" x2=\"440\" y2=\"500\" stroke=\"#92400e\" stroke-width=\"3\" class=\"anim-draw\" style=\"animation-delay: 1.50s\" /><text x=\"380\" y=\"365\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"9\" font-style=\"italic; animation-delay: 1.65s\"  class=\"anim-fade-in\"></text><text x=\"200\" y=\"380\" fill=\"#a3e635\" font-size=\"11\" font-weight=\"600\"   class=\"anim-fade-in\" style=\"animation-delay: 1.80s\">🌱 Plant = LIVING</text><text x=\"200\" y=\"398\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 1.95s\">Grows · breathes · makes food</text><text x=\"200\" y=\"414\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 2.10s\">Excretes · responds · reproduces</text></g>", "beats": ["Welcome back, my little friend! You might think plants are not really alive — they do not run, they do not eat, they do not breathe like us. But PLANTS ARE LIVING CREATURES TOO! They show every sign of life, just in their own quiet way. Let's see how!", "First, GROWTH. A tiny seed becomes a tall tree. Roots grow down into the soil; the stem grows up; leaves spread out; new branches appear every year. A banyan tree can grow for hundreds of years and become as big as a small forest! So plants DEFINITELY grow.", "Second, RESPIRATION. Plants DO breathe! They take in oxygen and give out carbon dioxide — just like us — through tiny pores called STOMATA on their leaves. This happens day and night. But during the day, plants also do something else — they make food using sunlight, taking in carbon dioxide and giving out oxygen. That is called PHOTOSYNTHESIS.", "Third, NUTRITION. Plants do not eat like us. They make their OWN food — using sunlight, water from the soil, and carbon dioxide from the air. This amazing process is called PHOTOSYNTHESIS — say it with me: PHO-TO-SYN-THE-SIS. The green colour in leaves, called CHLOROPHYLL, catches the sunlight. Plants are the only living things that can make their own food!", "Fourth, EXCRETION. Plants excrete too! Some waste goes out as gases through stomata. Some waste is stored in old leaves, which then fall off (so the tree throws away its waste when leaves drop in autumn). Some waste is stored in the bark or in fruits. Some plants even store waste as gums and resins.", "Fifth, RESPONSE. Plants respond — slowly! A sunflower turns to face the sun. A touch-me-not (mimosa) plant folds its leaves when touched. Roots grow towards water; stems grow towards light. Plants also REPRODUCE — by seeds (like mangoes and apples), by stems (like potato and ginger), by leaves (like bryophyllum), and by roots. Truly, plants are living creatures! In our last story, we will learn about HABITATS — the special homes where living creatures live. Ready? Let's turn the page…"]}, {"id": "habitats", "label": "4. Habitats and Adaptation", "viewBox": "0 0 760 520", "svg": "<defs><marker id=\"arrB4\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#a3e635\"/></marker></defs><rect x=\"0\" y=\"0\" width=\"760\" height=\"520\" fill=\"#0f172a\"/><text x=\"380\" y=\"34\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"20\" font-weight=\"700\">HABITATS &amp; ADAPTATIONS</text><g class=\"el\" data-beat=\"1\"><rect x=\"80\" y=\"60\" width=\"600\" height=\"40\" rx=\"8\" fill=\"rgba(163,230,53,0.15)\" stroke=\"#a3e635\" stroke-width=\"2\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"380\" y=\"85\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"14\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">Every living creature has a special HOME (habitat) and special FEATURES (adaptations)</text></g><g class=\"el\" data-beat=\"2\"><rect x=\"40\" y=\"115\" width=\"680\" height=\"60\" rx=\"8\" fill=\"rgba(34,211,238,0.12)\" stroke=\"#22d3ee\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"380\" y=\"138\" text-anchor=\"middle\" fill=\"#22d3ee\" font-size=\"14\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">🏠 HABITAT</text><text x=\"380\" y=\"156\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">The natural home of a living creature — where it finds food, water, shelter, mate</text><text x=\"380\" y=\"170\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">Terrestrial (on land) · Aquatic (in water)</text></g><g class=\"el\" data-beat=\"3\"><rect x=\"40\" y=\"190\" width=\"680\" height=\"60\" rx=\"8\" fill=\"rgba(244,114,182,0.12)\" stroke=\"#f472b6\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"380\" y=\"213\" text-anchor=\"middle\" fill=\"#f472b6\" font-size=\"14\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">🦎 ADAPTATIONS</text><text x=\"380\" y=\"231\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">Special features that help a creature live in its habitat</text><text x=\"380\" y=\"245\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">Fish: gills + fins · Camel: hump + padded feet · Polar bear: thick fur</text></g><g class=\"el\" data-beat=\"4\"><rect x=\"40\" y=\"265\" width=\"340\" height=\"170\" rx=\"8\" fill=\"rgba(251,191,36,0.12)\" stroke=\"#fbbf24\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"210\" y=\"287\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">🐪 Camel — Desert habitat</text><text x=\"100\" y=\"318\" fill=\"#fde047\" font-size=\"32\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">🐪</text><text x=\"170\" y=\"310\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">• Long legs — away from hot sand</text><text x=\"170\" y=\"326\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">• Padded feet — don't sink in sand</text><text x=\"170\" y=\"342\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">• Hump — stores FAT (not water!)</text><text x=\"170\" y=\"358\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.90s\">• Closeable nostrils — keep sand out</text><text x=\"170\" y=\"374\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 1.05s\">• Pale colour — reflects the sun</text><text x=\"170\" y=\"390\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 1.20s\">• Drinks lots of water at once!</text><text x=\"210\" y=\"415\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"11\" font-style=\"italic; animation-delay: 1.35s\"  class=\"anim-fade-in\">\"Ship of the Desert\"</text></g><g class=\"el\" data-beat=\"5\"><rect x=\"400\" y=\"265\" width=\"320\" height=\"170\" rx=\"8\" fill=\"rgba(56,189,248,0.12)\" stroke=\"#38bdf8\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"560\" y=\"287\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">🐟 Fish — Aquatic habitat</text><text x=\"430\" y=\"318\" fill=\"#38bdf8\" font-size=\"32\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">🐟</text><text x=\"480\" y=\"310\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">• Sleek body — swims fast</text><text x=\"480\" y=\"326\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.60s\">• GILLS — breathe oxygen from water</text><text x=\"480\" y=\"342\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.75s\">• FINS — steer &amp; balance</text><text x=\"480\" y=\"358\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.90s\">• SCALES — protect the body</text><text x=\"480\" y=\"374\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 1.05s\">• Streamlined shape</text><text x=\"480\" y=\"390\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 1.20s\">• Some change colour to hide</text><text x=\"560\" y=\"415\" text-anchor=\"middle\" fill=\"#38bdf8\" font-size=\"11\" font-style=\"italic; animation-delay: 1.35s\"  class=\"anim-fade-in\">Perfect for water!</text></g><g class=\"el\" data-beat=\"6\"><rect x=\"40\" y=\"445\" width=\"680\" height=\"60\" rx=\"8\" fill=\"rgba(167,139,250,0.12)\" stroke=\"#a78bfa\" stroke-width=\"1.5\" class=\"anim-pop-in\" style=\"animation-delay: 0.00s\" /><text x=\"380\" y=\"467\" text-anchor=\"middle\" fill=\"#a78bfa\" font-size=\"13\" font-weight=\"700\"   class=\"anim-fade-in\" style=\"animation-delay: 0.15s\">🌍 TYPES OF HABITATS</text><text x=\"380\" y=\"485\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.30s\">TERRESTRIAL: forest · grassland · desert · mountain</text><text x=\"380\" y=\"500\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\"   class=\"anim-fade-in\" style=\"animation-delay: 0.45s\">AQUATIC: pond · river · lake · sea · ocean</text></g>", "beats": ["Welcome back, my little friend! In our last stories, we learned that living creatures grow, breathe, eat, excrete, respond, and reproduce. Today's story is about WHERE they live. Every living creature has a special home — its HABITAT — and special features called ADAPTATIONS that help it survive there. Let's see!", "A HABITAT is the natural home of a living creature — the place where it finds food, water, shelter, and a mate. A fish's habitat is water. A camel's habitat is the desert. A frog's habitat is a pond. A monkey's habitat is a forest. Take a creature out of its habitat, and it may not survive. Habitats can be TERRESTRIAL (on land) or AQUATIC (in water).", "Different habitats have different conditions — hot or cold, wet or dry, sunny or dark, high or low. Living creatures have ADAPTATIONS — special features that help them live in their habitat. A fish has GILLS to breathe in water and FINS to swim. A camel stores water and fat in its hump for the desert. A polar bear has THICK FUR to keep warm in snow.", "Look at the camel — its long legs keep its body away from the hot sand. Its broad, padded feet do not sink in the sand. Its hump stores fat (not water!) which it uses when food is scarce. Its nostrils can close to keep sand out. Its pale colour reflects the sun. All these are adaptations for the DESERT habitat.", "Look at the fish — its body is SLEEK and STREAMLINED so it can swim fast. It has GILLS to take oxygen from water. It has FINS to steer and balance. Its body is covered in SCALES for protection. Some fish can change colour to hide from predators! All these are adaptations for the AQUATIC habitat.", "There are two main types of habitats: TERRESTRIAL (forest, grassland, desert, mountain) and AQUATIC (pond, river, sea, ocean). Some creatures live in BOTH — like frogs (adults on land, tadpoles in water), or ducks (swim and walk). Some habitats are very cold (polar), some very hot (tropical), some wet (rainforests), some dry (deserts). Each habitat has its own special plants and animals, all adapted to that home. You have completed the chapter, my little friend! Go outside and observe a creature in its habitat — you will see science everywhere!"]}], "notes": "<div style=\"background: linear-gradient(135deg, #3b0764 0%, #5b21b6 100%); border: 1px solid #a78bfa; border-radius: 14px; padding: 22px 24px; margin-bottom: 28px;\"><h2 style=\"color: #ddd6fe; font-size: 22px; margin: 0 0 8px; font-weight: 700;\">📖 Before We Begin — Story-Time Words</h2><p style=\"color: #ddd6fe; font-size: 13px; margin: 0 0 16px; line-height: 1.6;\">My little friend, before we explore living creatures, let us sit together in a garden and learn some special words. Imagine a cat sleeping next to us, a tree above, and a small fish in a pond nearby — and I am telling you each word. Ready? Let's begin!</p><div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🌱 1. Living Thing</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">A living thing is something that is ALIVE — it grows, breathes, eats, excretes, responds, and reproduces. Cats, trees, fish, humans, insects, and even tiny bacteria are all living things.</p></div><div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🪨 2. Non-living Thing</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">A non-living thing is something that has NEVER been alive — it does not grow, breathe, eat, or reproduce. Stones, water, air, cycles, chairs, and pens are non-living.</p></div><div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">💀 3. Dead Thing</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">A dead thing was ONCE alive but is not anymore — like dry wood, a fallen leaf, or a dead insect. It no longer grows or breathes.</p></div><div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🔬 4. Cell</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">A cell is the tiniest building block of a living creature. Some creatures (bacteria) have only ONE cell; others (like us) have BILLIONS of cells. Cells are the basic unit of life.</p></div><div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">📈 5. Growth</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">Growth is the increase in size and number of cells in a living thing. A seed grows into a tree; a baby grows into an adult. All living things grow during their life.</p></div><div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">💨 6. Respiration</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">Respiration (breathing) is the process of taking in oxygen and giving out carbon dioxide, to release energy from food. Humans use lungs; fish use gills; insects use spiracles; plants use stomata.</p></div><div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🍽️ 7. Nutrition</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">Nutrition is the way living things get their food. Animals eat plants or other animals. Plants make their own food by photosynthesis (using sunlight).</p></div><div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🍃 8. Photosynthesis</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">Photosynthesis is the process by which green plants make their own food using sunlight, water, and carbon dioxide. The green colour (chlorophyll) in leaves catches the sunlight.</p></div><div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🗑️ 9. Excretion</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">Excretion is the process of throwing out waste from the body. Humans excrete urine and sweat; plants excrete gases through stomata; fish excrete ammonia into water.</p></div><div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">⚡ 10. Stimulus &amp; Response</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">A stimulus is something that causes a reaction (like heat, light, touch, or sound). A response is the reaction of a living thing — like pulling your hand from a hot plate, or a plant turning towards light.</p></div><div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">👶 11. Reproduction</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">Reproduction is the process by which living things make new living things of the same kind — a cat has kittens, a hen lays eggs, a plant makes seeds. Without reproduction, life would end.</p></div><div style=\"background: rgba(15, 23, 42, 0.5); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px;\"><h3 style=\"color: #c4b5fd; font-size: 16px; margin: 0 0 8px;\">🏠 12. Habitat</h3><p style=\"color: #e9d5ff; font-size: 13px; line-height: 1.6; margin: 0;\">A habitat is the natural home of a living creature — the place where it finds food, water, shelter, and a mate. Examples: forest, pond, desert, sea, mountain.</p></div></div><h2>📝 Key Notes</h2><h3>🌿 What makes something living?</h3><p>A LIVING creature shows six main characteristics: <strong>growth, respiration, nutrition, excretion, response to stimuli, and reproduction</strong>. Living things are also made of tiny building blocks called CELLS. Non-living things (stone, cycle, chair) do NOT show these signs and have no cells.</p><h3>📋 The Six Characteristics of Living Creatures</h3><table class=\"styled-table\"><thead><tr><th>#</th><th>Characteristic</th><th>Meaning</th><th>Example</th></tr></thead><tbody><tr><td>1</td><td>Growth</td><td>Increase in size &amp; cells</td><td>Seed → tree</td></tr><tr><td>2</td><td>Respiration</td><td>Take in O₂, give out CO₂</td><td>Humans breathe with lungs</td></tr><tr><td>3</td><td>Nutrition</td><td>Take in / make food</td><td>Animals eat; plants photosynthesise</td></tr><tr><td>4</td><td>Excretion</td><td>Throw out waste</td><td>Urine, sweat, gases</td></tr><tr><td>5</td><td>Response to stimuli</td><td>React to surroundings</td><td>Pull hand from hot plate</td></tr><tr><td>6</td><td>Reproduction</td><td>Make new of same kind</td><td>Cat → kittens</td></tr></tbody></table><h3>🌱 Plants are Living Creatures too!</h3><p>Plants show every sign of life — but in their own quiet way:</p><ul><li><strong>Growth:</strong> Seed → seedling → tree (some live for hundreds of years).</li><li><strong>Respiration:</strong> Breathe through STOMATA (tiny pores on leaves) — take in O₂, give out CO₂.</li><li><strong>Nutrition:</strong> Make their OWN food by PHOTOSYNTHESIS using sunlight, water, CO₂ (chlorophyll catches sunlight).</li><li><strong>Excretion:</strong> Waste gases out through stomata; some waste stored in old leaves which then fall off.</li><li><strong>Response:</strong> Sunflower turns to sun; touch-me-not folds its leaves; roots grow towards water.</li><li><strong>Reproduction:</strong> By seeds (mango), stems (potato, ginger), leaves (bryophyllum), or roots.</li></ul><h3>🏠 Habitat &amp; Adaptations</h3><p>A HABITAT is the natural home of a living creature. An ADAPTATION is a special feature that helps the creature survive in its habitat.</p><table class=\"styled-table\"><thead><tr><th>Creature</th><th>Habitat</th><th>Adaptations</th></tr></thead><tbody><tr><td>Fish</td><td>Water (aquatic)</td><td>Gills, fins, scales, streamlined body</td></tr><tr><td>Camel</td><td>Desert (terrestrial)</td><td>Hump (fat), long legs, padded feet, closeable nostrils</td></tr><tr><td>Polar bear</td><td>Snow / Arctic</td><td>Thick white fur, layer of fat under skin, broad paws</td></tr><tr><td>Frog</td><td>Pond (both land &amp; water)</td><td>Webbed feet, can breathe through skin, lays eggs in water</td></tr><tr><td>Cactus</td><td>Desert</td><td>Thick stem stores water, spines instead of leaves</td></tr><tr><td>Lotus</td><td>Pond (aquatic)</td><td>Long stem, waxy leaves that float, hollow stems for air</td></tr></tbody></table><h3>🌍 Two Main Types of Habitats</h3><ul><li><strong>Terrestrial (on land):</strong> forest, grassland, desert, mountain.</li><li><strong>Aquatic (in water):</strong> pond, river, lake, sea, ocean.</li><li>Some creatures live in BOTH — like frogs (adults on land, tadpoles in water) and ducks.</li></ul><h3>⚠ Tricky Cases — Is it Living?</h3><table class=\"styled-table\"><thead><tr><th>Thing</th><th>Living?</th><th>Why?</th></tr></thead><tbody><tr><td>Seed</td><td>YES (alive, sleeping)</td><td>Can grow when conditions are right</td></tr><tr><td>Hibernating bear</td><td>YES (alive, resting)</td><td>Body still works slowly</td></tr><tr><td>Dry wood</td><td>NO (dead)</td><td>Was alive once; no growth, no breath</td></tr><tr><td>Fire</td><td>NO (non-living)</td><td>Grows but cannot breathe or reproduce</td></tr><tr><td>Stone</td><td>NO (non-living)</td><td>No signs of life</td></tr><tr><td>Virus</td><td>On the edge</td><td>Reproduces only inside a host; otherwise behaves like non-living</td></tr></tbody></table><div class=\"practice-card\"><h3>💡 Remember</h3><p>If something grows, breathes, eats, excretes, responds, and reproduces — it is ALIVE. Plants show all these signs in their own way. Every living thing has a habitat (home) and adaptations (special features) that help it survive there.</p></div>", "practice": "<h2>✏️ Practice</h2><div class=\"practice-card\"><h3>🧠 Quick Recall</h3><ol><li>The six characteristics of living creatures are ___, ___, ___, ___, ___, and ___.</li><li>The smallest building block of a living creature is called a ___.</li><li>The process of taking in oxygen and giving out carbon dioxide is called ___.</li><li>The process by which green plants make their own food is called ___.</li><li>The green substance in leaves that catches sunlight is called ___.</li><li>The tiny pores on leaves through which plants breathe are called ___.</li><li>The natural home of a living creature is called its ___.</li><li>The special features that help a creature live in its habitat are called ___.</li><li>The organ fish use to breathe in water is called ___.</li><li>The ___ (animal) stores fat in its hump to survive in the desert.</li><li>A habitat on land is called ___; a habitat in water is called ___.</li><li>A baby plant comes out of a ___ in the soil.</li></ol><button class=\"reveal-btn\">Reveal Answers</button><div class=\"reveal-answer\"><ol><li>growth, respiration, nutrition, excretion, response, reproduction</li><li>cell</li><li>respiration (breathing)</li><li>photosynthesis</li><li>chlorophyll</li><li>stomata</li><li>habitat</li><li>adaptations</li><li>gills</li><li>camel</li><li>terrestrial, aquatic</li><li>seed</li></ol></div></div><div class=\"practice-card\"><h3>🌍 Match the Habitat</h3><p>For each creature, write the type of habitat (Terrestrial / Aquatic / Both).</p><ol><li>Fish — ___</li><li>Camel — ___</li><li>Frog — ___</li><li>Elephant — ___</li><li>Whale — ___</li><li>Lotus — ___</li></ol><button class=\"reveal-btn\">Reveal Answers</button><div class=\"reveal-answer\"><ol><li>Aquatic</li><li>Terrestrial (desert)</li><li>Both (tadpole in water, adult on land)</li><li>Terrestrial (forest / grassland)</li><li>Aquatic (sea / ocean)</li><li>Aquatic (pond)</li></ol></div></div>", "realLife": [{"id": "desert_camel_story", "title": "🐪 The Story of the Ship of the Desert", "viewBox": "0 0 760 460", "svg": "<defs><marker id=\"arrRL4\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0,0 L8,4 L0,8 Z\" fill=\"#a3e635\"/></marker></defs><rect x=\"0\" y=\"0\" width=\"760\" height=\"460\" fill=\"#0f172a\"/><text x=\"380\" y=\"30\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"18\" font-weight=\"700\">THE SHIP OF THE DESERT</text><g class=\"el\" data-beat=\"1\"><rect x=\"80\" y=\"55\" width=\"600\" height=\"55\" rx=\"10\" fill=\"rgba(251,191,36,0.15)\" stroke=\"#fbbf24\" stroke-width=\"2\"/><text x=\"380\" y=\"78\" text-anchor=\"middle\" fill=\"#fbbf24\" font-size=\"13\" font-weight=\"700\">🏜️ The desert is HOT, DRY, and has very LITTLE water.</text><text x=\"380\" y=\"98\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">How does the camel survive here, day after day?</text></g><g class=\"el\" data-beat=\"2\"><rect x=\"40\" y=\"130\" width=\"340\" height=\"100\" rx=\"8\" fill=\"rgba(251,146,60,0.12)\" stroke=\"#fb923c\" stroke-width=\"1.5\"/><text x=\"210\" y=\"152\" text-anchor=\"middle\" fill=\"#fb923c\" font-size=\"12\" font-weight=\"700\">🐪 Adaptations of the Camel</text><text x=\"55\" y=\"175\" fill=\"#94a3b8\" font-size=\"10\">• Long legs — body away from hot sand</text><text x=\"55\" y=\"191\" fill=\"#94a3b8\" font-size=\"10\">• Padded feet — do not sink in sand</text><text x=\"55\" y=\"207\" fill=\"#94a3b8\" font-size=\"10\">• Hump — stores FAT (food reserve)</text><text x=\"55\" y=\"223\" fill=\"#94a3b8\" font-size=\"10\">• Closeable nostrils — keep sand out</text></g><g class=\"el\" data-beat=\"3\"><rect x=\"400\" y=\"130\" width=\"320\" height=\"100\" rx=\"8\" fill=\"rgba(34,211,238,0.12)\" stroke=\"#22d3ee\" stroke-width=\"1.5\"/><text x=\"560\" y=\"152\" text-anchor=\"middle\" fill=\"#22d3ee\" font-size=\"12\" font-weight=\"700\">💧 More Camel Secrets</text><text x=\"415\" y=\"175\" fill=\"#94a3b8\" font-size=\"10\">• Pale colour — reflects sun</text><text x=\"415\" y=\"191\" fill=\"#94a3b8\" font-size=\"10\">• Drinks 30+ litres at once!</text><text x=\"415\" y=\"207\" fill=\"#94a3b8\" font-size=\"10\">• Sweat very little — saves water</text><text x=\"415\" y=\"223\" fill=\"#94a3b8\" font-size=\"10\">• Thick lips — eats thorny plants</text></g><g class=\"el\" data-beat=\"4\"><rect x=\"80\" y=\"245\" width=\"600\" height=\"60\" rx=\"10\" fill=\"rgba(163,230,53,0.15)\" stroke=\"#a3e635\" stroke-width=\"2\"/><text x=\"380\" y=\"268\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"13\" font-weight=\"700\">🐪 Without these adaptations, the camel could NOT survive!</text><text x=\"380\" y=\"285\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">That is why each creature is suited to its own habitat.</text></g><g class=\"el\" data-beat=\"5\"><rect x=\"40\" y=\"320\" width=\"680\" height=\"120\" rx=\"8\" fill=\"rgba(167,139,250,0.12)\" stroke=\"#a78bfa\" stroke-width=\"1.5\"/><text x=\"380\" y=\"342\" text-anchor=\"middle\" fill=\"#a78bfa\" font-size=\"13\" font-weight=\"700\">🌍 Compare: A FISH taken to the desert would die quickly.</text><text x=\"380\" y=\"362\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">It has gills (not lungs) and fins (not legs) — wrong adaptations for land.</text><text x=\"380\" y=\"382\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"11\">A camel taken to a deep sea would also drown — wrong adaptations for water.</text><text x=\"380\" y=\"410\" text-anchor=\"middle\" fill=\"#a3e635\" font-size=\"13\" font-weight=\"700\">🌟 Lesson: Habitat + Adaptations = Survival!</text><text x=\"380\" y=\"428\" text-anchor=\"middle\" fill=\"#94a3b8\" font-size=\"10\">Every creature is perfectly matched to its own home.</text></g>", "beats": ["Imagine a vast desert — hot sand, no water, very little shade. How could any living thing survive here? And yet, the camel walks across the desert for days without drinking! The Arabs call the camel the 'Ship of the Desert' — it carries people and goods across the sand just like a ship on the sea.", "What makes the camel so perfect for the desert? Its LONG LEGS keep its body high above the hot sand. Its PADDED FEET are broad, so they do not sink in the sand. Its HUMP stores FAT — not water, as many people think — which gives the camel food when there is nothing to eat. Its NOSTRILS can close, so sand cannot blow into its nose.", "And there are more camel secrets! The camel's pale colour reflects the hot sun. It can drink 30 litres of water in just a few minutes when it finds water. It sweats very little, so it saves water. Its thick lips let it eat thorny desert plants without hurting its mouth. Every part of the camel is built for the desert!", "Without these ADAPTATIONS, the camel could NOT survive in the desert. A fish would die in hours; a polar bear would overheat. The camel lives here because its body matches its habitat. This is the great rule of nature: every creature is suited to its own home.", "Now think of a FISH. If we took a fish to the desert, it would die very quickly — it has gills (not lungs) and fins (not legs). And if we put a camel in the deep sea, it would drown. The fish belongs in water; the camel belongs in the desert. Habitat + Adaptations = Survival! This is true for every living creature on Earth — from the smallest ant to the biggest whale."]}], "guidedPractice": [{"title": "List the Six Characteristics", "difficulty": "Easy", "diffClass": "gp-easy", "statement": "What are the six main characteristics of living creatures? (Type all six, separated by commas.)", "steps": [{"prompt": "Type the six characteristics.", "validate": {"type": "match", "answers": ["growth, respiration, nutrition, excretion, response, reproduction", "growth respiration nutrition excretion response reproduction", "growth, respiration, nutrition, excretion, response to stimuli, reproduction"]}, "formatHint": "Example: growth, respiration, nutrition, excretion, response, reproduction", "explanation": "Yes! The six characteristics are: growth, respiration, nutrition, excretion, response to stimuli, and reproduction.", "hint": "Growth, breathing, food, waste, reaction, babies."}], "finalAnswer": "The six characteristics are: growth, respiration, nutrition, excretion, response to stimuli, and reproduction."}, {"title": "Camel Adaptation", "difficulty": "Medium", "diffClass": "gp-med", "statement": "What does the camel store in its hump — water or fat?", "steps": [{"prompt": "Type water or fat.", "validate": {"type": "match", "answers": ["fat"]}, "formatHint": "Example: fat", "explanation": "Yes! The camel stores FAT (not water) in its hump. This fat gives it food when there is nothing to eat in the desert.", "hint": "Many people think it is water, but it is actually food!"}], "finalAnswer": "The camel stores fat in its hump."}, {"title": "Match the Adaptation", "difficulty": "Hard", "diffClass": "gp-hard", "statement": "Which adaptation helps a fish breathe underwater? (Hint: the organ is named after what it does.)", "steps": [{"prompt": "Type the name of the organ.", "validate": {"type": "match", "answers": ["gills", "gill"]}, "formatHint": "Example: gills", "explanation": "Yes! Fish have GILLS — special organs that take oxygen DISSOLVED in water. Without gills, a fish would drown in air-less water.", "hint": "The organ rhymes with 'hills' and 'spills' — g____"}], "finalAnswer": "Fish breathe underwater using GILLS."}], "selfTest": [{"q": "List the six main characteristics of living creatures.", "steps": "1. Growth — increase in size<br>2. Respiration — breathing (O₂ in, CO₂ out)<br>3. Nutrition — taking in/making food<br>4. Excretion — throwing out waste<br>5. Response to stimuli — reacting to surroundings<br>6. Reproduction — making new of same kind", "answer": "Growth, respiration, nutrition, excretion, response to stimuli, reproduction."}, {"q": "How do plants show that they are living creatures? Give two examples.", "steps": "1. GROWTH: A seed grows into a tree.<br>2. RESPIRATION: Plants breathe through stomata (tiny pores on leaves) — take in O₂, give out CO₂.<br>3. NUTRITION: Plants make their own food by photosynthesis.<br>4. RESPONSE: A sunflower turns to face the sun.<br>5. REPRODUCTION: Plants make seeds that grow into new plants.", "answer": "Plants grow (seed → tree), breathe through stomata, make food (photosynthesis), respond to light, and reproduce by seeds."}, {"q": "What is the difference between a habitat and an adaptation? Give one example.", "steps": "1. HABITAT = the natural HOME of a living creature (where it lives).<br>2. ADAPTATION = a special FEATURE that helps the creature survive in its habitat.<br>3. Example: A fish's habitat is water; its adaptations are gills (to breathe) and fins (to swim).", "answer": "A habitat is the home (e.g. water for fish); an adaptation is a special feature (e.g. gills and fins of the fish)."}, {"q": "Why would a fish not survive in the desert? Give two reasons.", "steps": "1. A fish has GILLS that work only in water — it cannot breathe air like a camel.<br>2. A fish has FINS, not legs — it cannot walk on sand.<br>3. A fish has no way to store water or shade itself from the hot sun.", "answer": "A fish has gills (not lungs) and fins (not legs), so it cannot breathe air or walk on sand — wrong adaptations for the desert."}, {"q": "Is fire a living thing? Why or why not?", "steps": "1. Fire GROWS and uses oxygen — but these alone are not signs of life.<br>2. Fire does NOT eat food, does NOT excrete, does NOT reproduce, is NOT made of cells.<br>3. So fire is NOT a living thing — it is just a chemical reaction.", "answer": "Fire is NOT living — it grows but does not breathe, eat, excrete, reproduce, or have cells."}]};
