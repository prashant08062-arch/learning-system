<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning System — Multi-Subject Interactive Modules</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============================================================
     HOME SCREEN
     ============================================================ -->
<div id="homeScreen">
  <header class="home-header">
    <h1>🎓 Learning System</h1>
    <p>Multi-Subject Interactive Modules for Class 6 & 8</p>
    <div class="class-selector-bar">
      <button class="class-btn" data-grade="6">Class 6</button>
      <button class="class-btn" data-grade="7">Class 7</button>
      <button class="class-btn" data-grade="8">Class 8</button>
      <button class="class-btn" data-grade="all">All Classes</button>
    </div>
  </header>

  <main class="subjects-grid" id="subjectsGrid"></main>

  <footer class="home-footer">
    <p>📖 Select a subject above to see its chapters.</p>
  </footer>
</div>

<!-- ============================================================
     CHAPTER SCREEN
     ============================================================ -->
<div id="chapterScreen" style="display:none;">
  <div class="chapter-top-bar">
    <button class="back-btn" id="backBtn">← All Subjects</button>
    <div class="chapter-top-info">
      <span id="chapterTopSubject"></span>
      <span id="chapterTopTitle"></span>
    </div>
    <button class="logout-btn" id="logoutBtn" style="display:none;">Logout</button>
  </div>

  <nav class="tab-bar" id="tabBar">
    <button class="tab active" data-tab="lecture">🎓 Lecture</button>
    <button class="tab" data-tab="notes">📝 Key Notes</button>
    <button class="tab" data-tab="practice">✏️ Practice</button>
    <button class="tab" data-tab="reallife">🌍 Real Life</button>
    <button class="tab" data-tab="guided">🎯 Guided Practice</button>
    <button class="tab" data-tab="selftest">🧪 Self-Test</button>
  </nav>

  <section class="section active" id="lecture">
    <div class="lecture-section-bar" id="lectureSectionBar"></div>
    <div id="lectureContainer"></div>
  </section>
  <section class="section" id="notes"><div class="content" id="notesContent"></div></section>
  <section class="section" id="practice"><div class="content" id="practiceContent"></div></section>
  <section class="section" id="reallife"><div class="content" id="reallifeContent"></div></section>
  <section class="section" id="guided"><div id="guidedApp"></div></section>
  <section class="section" id="selftest"><div class="content" id="selftestContent"></div></section>
</div>

<!-- ============================================================
     AUTH OVERLAY
     ============================================================ -->
<div id="authOverlay" style="display:none;">
  <div class="auth-card">
    <h2>🎓 Learning System</h2>
    <p>Sign in to continue your learning journey</p>
    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="login">Student Login</button>
      <button class="auth-tab" data-mode="signup">Create Account</button>
    </div>
    <div id="loginForm">
      <input type="email" id="loginEmail" placeholder="Student Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>
      <button id="loginBtn">Login</button>
    </div>
    <div id="signupForm" style="display:none;">
      <input type="text" id="suName" placeholder="Student Name" required>
      <select id="suGrade">
        <option value="6">Class 6</option>
        <option value="7">Class 7</option>
        <option value="8">Class 8</option>
      </select>
      <input type="email" id="suEmail" placeholder="Student Email" required>
      <input type="password" id="suPassword" placeholder="Password" required>
      <input type="text" id="suParentName" placeholder="Parent Name" required>
      <input type="email" id="suParentEmail" placeholder="Parent Email" required>
      <input type="tel" id="suParentPhone" placeholder="Parent Phone" required>
      <input type="password" id="suParentPassword" placeholder="Parent Password" required>
      <button id="signupBtn">Create Account</button>
    </div>
    <div id="otpSection" style="display:none;"></div>
    <div id="authToast"></div>
    <button id="skipAuthBtn" style="display:block;margin-top:16px;background:none;border:none;color:#38bdf8;font-size:13px;cursor:pointer;text-decoration:underline;">Browse without login →</button>
  </div>
</div>
